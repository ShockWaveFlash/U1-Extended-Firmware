links:
  detect-http:
    url: /detect-http/
    icon: "🤖"
    label: "KI-Erkennung"
    condition:
      setting: camera-internal
      value: paxx12-ai

settings:
  camera:
    items:
      camera-internal:
        options:
          paxx12-ai:
            label: "Paxx12-KI (erprobend)"
            confirm: >-
              Schaltet die eigene KI-Fehlererkennung ein. Sie sieht das Kamerabild durch
              und schlägt Alarm, wenn der Druck aus dem Ruder läuft — etwa beim
              „Spaghetti“-Fehler, wenn sich das Werkstück gelöst hat und die Düse ins
              Leere fördert. ⚠ Erprobend: Fehlalarme und übersehene Fehler sind möglich,
              sie ersetzt kein Hinsehen.
            hidden: true
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal paxx12-ai &&
                /etc/init.d/S90lmd stop &&
                /etc/init.d/S99detect-rknn restart &&
                /etc/init.d/S99v4l2-mpp-mipi restart
