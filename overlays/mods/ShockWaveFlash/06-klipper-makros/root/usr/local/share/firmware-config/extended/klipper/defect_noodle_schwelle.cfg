# Spaghetti-Erkennung: Konfidenzschwelle angehoben  --  2026-09-05
#
# Auf Christophers Ansage („stell die Spaghetti-Schwelle vom Drucker selber hoeher").
#
# WARUM 0.92:
# Am 05.09. lieferte die Erkennung bei einem flachen Teil (Tesi Footwarmer, PCTG) ueber
# Stunden Konfidenzen von 0,8276 bis 0,8681 -- also dauerhaft knapp UEBER der Werksschwelle
# von 0,83. Ergebnis waren drei Fehlpausen in 40 Minuten (Layer 63/68/73) plus eine vierte
# durch die Firmware selbst (Layer 91). Gemessene Werte aus /root/logs/u1-noodle-detect.log
# auf CT 105, das dieselben Modelle abfragt.
# 0,92 liegt rund 5 Prozentpunkte ueber dem hoechsten beobachteten Fehlalarm.
#
# ⚠️ EHRLICHE LUECKE: Es gibt KEINE Messung, welche Konfidenz ECHTE Spaghetti erzeugen.
# 0,92 ist daher aus den Fehlalarmen nach oben abgegrenzt, nicht aus Positivfaellen belegt.
# Gegenbeispiel zur Vorsicht: bei der clean_bed-Erkennung erreichte ein Fehlalarm 0,95.
# Wenn ein echter Spaghetti-Fall durchrutscht, ist das der erste Verdaechtige.
#
# WAS NICHT GEHT (am Code geprueft, defect_detection.py):
# - Ueber `sensitivity` kommt man nicht hoeher: high = 0,80 / low = 0,83, wir standen
#   bereits auf `low`. Die Stufen sind fest verdrahtet (NOODLE_THRESHOLD_HIGH/LOW).
# - Der Laufzeit-Webhook `defect_detection/config` kennt nur enable / check_window /
#   sensitivity (Z. 177-187) -- die Schwellen NICHT. Deshalb dieser Config-Weg.
# - Einen „nur melden statt pausieren"-Modus gibt es im Firmware-Code nicht.
#
# Die Sektion wird additiv zu der in printer.cfg gemergt (gleiches Muster wie [mcu pico],
# das aus frame_thermistor.cfg und kalico_pico_optional.cfg zusammengesetzt wird).
# Rueckbau: diese Datei loeschen + FIRMWARE_RESTART -> zurueck auf den Werkswert 0,83.

[defect_detection]
noodle_threshold_low: 0.92
