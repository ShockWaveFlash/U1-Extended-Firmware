# Rahmenthermistor fuer das Z-Achsen-Projekt  --  angelegt 2026-08-20
# Stufe 2 scharf geschaltet 2026-08-21.
#
# temp_coeff nachgezogen 2026-08-21 aus der Gegenprobe (/root/stufe3-daten/):
#   Z-Drift 107,2 um bei 8,05 K Rahmenanstieg  ->  0,0133 mm/K
#   (Reihe 20.08.: 80,8 um / 6,78 K -> 0,0119 -- war ~12 % zu klein und liess
#    einen dauerhaften Restversatz von -11 um stehen; mit 0,0133 geht der
#    Endfehler auf +0,1 um. Der Anlauf-Peak bleibt, der kommt aus der
#    Traegheit des Deckblechs, nicht aus dem Koeffizienten.)
# Vorzeichen POSITIV: z_trigger (PROBE_ACCURACY-Average) sinkt beim Aufheizen,
# die Sonde loest also tiefer aus -> das Bett entfernt sich von der Duese
# -> Z muss nach unten nachgefuehrt werden = positiver Koeffizient
# (deckt sich mit dem Frame-Referenzwert 0.0088 aus Klipper-PR #6855).
#
# ⚠️ [temperature_sensor frame] ist ENTFALLEN: z_thermal_adjust belegt denselben
# ADC-Pin exklusiv (pheaters.setup_sensor) - beides zusammen = Pin-Konflikt.
# Die Temperatur steht weiter zur Verfuegung, als Statusfeld
# z_thermal_adjust.temperature (ungerundet, bereits geglaettet) und in Mainsail.
# ⚠️ Damit entfaellt RECORD_TEMPERATURE - das ist ein Mux-Kommando von
# [temperature_sensor] (Snapmaker-Zusatz in temperature_sensor.py) und
# existiert fuer z_thermal_adjust NICHT.
# Rueckbau: /root/u1-config-backup/frame_thermistor.cfg.vor-z_thermal_adjust

[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040-00000000000000-0000000000_E665485457836E24-if00

[z_thermal_adjust]
temp_coeff: 0.0133
sensor_type: Generic 3950
sensor_pin: pico:gpio26
min_temp: 0
max_temp: 100
smooth_time: 30
max_z_adjustment: 0.2
z_adjust_off_above: 100
