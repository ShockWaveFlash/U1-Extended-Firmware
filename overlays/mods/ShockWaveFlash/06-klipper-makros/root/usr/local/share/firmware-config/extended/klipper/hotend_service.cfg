# Kompletter Kalibrierlauf nach einem Hotend-/Duesentausch - ein Knopf.
#
#   HOTEND_SERVICE                  -> der ganze Ablauf, grob 45-60 min
#   HOTEND_SERVICE PIDTEMP=250      -> andere PID-Kalibriertemperatur
#   HOTEND_SERVICE PID=0            -> ohne PID (dann auch ohne Entladen/Laden)
#   HOTEND_SERVICE MESH=1           -> MIT Bett-Mesh (Default AUS, Begruendung unten)
#   HOTEND_SERVICE MESH=1 BEDTEMP=100 SOAK=1800   -> Mesh fuer ABS, 30 min Soak
#   HOTEND_SERVICE SHAPER=0         -> OHNE Vibrationsmessung (die ist jetzt AN)
#
#   TOOL_OFFSET_ALL                 -> nur die Werkzeug-Offsets, einzeln nutzbar
#   OFFSET_ABORT                    -> Notausstieg, wenn die Offset-Kette haengt
#
# REIHENFOLGE - und warum sie so ist:
#   1. UNLOAD_ALL  Die PID-Kalibrierung faehrt 240 C an. Steckt PLA im Kopf,
#                  steht es minutenlang weit ueber seiner Zersetzungstemperatur.
#   2. PID_ALL     Jeder der vier Koepfe hat eine eigene Heizpatrone - nach einem
#                  Hotend-Tausch sind die alten Regelwerte dort nicht mehr gueltig.
#   3. LOAD_ALL    MUSS vor der Offset-Kalibrierung kommen: deren Reinigungsschritt
#                  (EXTRUDER_OFFSET_ACTION_AUTO_CLEAN) reinigt durch EXTRUDIEREN und
#                  Abschneiden an der Discard-Station. Ohne Filament reinigt er nichts.
#   4. TOOL_OFFSET_ALL   Die eigentliche Kernkalibrierung nach einem Duesenwechsel:
#                  Lage der vier Duesen zueinander in X, Y und Z.
#   5. BED_MESH    OPTIONAL und per Default AUS, siehe naechster Absatz.
#   6. SAVE_CONFIG Nur fuers Bett-Mesh noetig. PID-Werte und Werkzeug-Offsets
#                  schreiben sich selbst in ihre JSON-Dateien unter snapmaker/.
#
# WARUM DAS BETT-MESH PER DEFAULT AUS IST (Messreihen 4 und 5, 17.08.):
#   Christopher hakt das Auto-Bed-Leveling pro Druckjob im Slicer an - jeder Druck
#   nivelliert also selbst und ueberstimmt das gespeicherte Profil `default`.
#   Ein hier aufgenommenes Service-Mesh aendert an keinem einzigen Druck etwas.
#   Dazu kommt: ein Mesh gilt nur fuer seine Temperatur. Gegen den Kaltzustand
#   gemessen (Reihe 5, Festpunkt X135/Y165):
#       Bett  60 C -> -48,2 um Versatz, X-Kippung -32,7 um
#       Bett  80 C -> -68,0 um Versatz, X-Kippung -47,4 um
#       Bett 100 C -> -93,3 um Versatz, X-Kippung -63,7 um
#   Wer MESH=1 setzt, sollte BEDTEMP auf die Temperatur des Materials setzen, das
#   er wirklich druckt - und SOAK nicht kuerzen.
#
# WAS DIESES MAKRO NICHT KANN - danach von Hand:
#   - Duesendurchmesser am Touchscreen hinterlegen (Settings -> Maintenance).
#   - In SnapmakerOrca "Synchronize nozzle information" anklicken.
#   - Dynamic Flow Calibration: FLOW_CALIBRATE laeuft nur aus einem Druckauftrag
#     heraus (braucht den Filamenttyp aus der gesliceten Datei), nicht standalone.

[gcode_macro _SAVE_IF_PENDING]
description: Hilfsmakro - SAVE_CONFIG nur, wenn wirklich etwas zu speichern ist
gcode:
    # Muss ein eigenes Makro sein: ein Klipper-Makro rendert sein Jinja EINMAL
    # vorab, save_config_pending waere im Hauptmakro noch der Wert von VORHER.
    {% if printer.configfile.save_config_pending %}
        M117 SAVE_CONFIG - Klipper startet neu
        SAVE_CONFIG
    {% else %}
        RESPOND TYPE=echo MSG="Nichts zu speichern - kein Neustart noetig."
    {% endif %}

[gcode_macro OFFSET_ABORT]
description: Notausstieg aus einer haengenden Werkzeug-Offset-Kalibrierung
gcode:
    EXTRUDER_OFFSET_ACTION_EXIT
    RESPOND TYPE=echo MSG="Offset-Kalibrierung beendet, Heizungen aus, Idle-Timeout zurueckgesetzt."

[gcode_macro TOOL_OFFSET_ALL]
description: Werkzeug-Offsets aller vier Koepfe neu vermessen und speichern
gcode:
    {% set CLEANTEMP = params.CLEANTEMP|default(200)|int %}
    {% set COOLTEMP = params.COOLTEMP|default(140)|int %}

    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("TOOL_OFFSET_ALL: Es laeuft ein Druck - abgebrochen.") }
    {% endif %}

    # PRESTART schaltet die Maschine in den Kalibrierzustand (nur aus IDLE moeglich),
    # ruft PREHEAT (Duesen 140 C, Bett 55 C) und PREHOMING selbst auf und hebt den
    # Idle-Timeout an. Das Anheben ist wesentlich: schalten die Motoren zwischendurch
    # ab, verwirft die Firmware alle bereits gemessenen Offsets. Erst EXIT setzt den
    # Timeout wieder auf den Normalwert.
    M117 Offsets: Vorbereitung
    RESPOND TYPE=echo MSG="Offsets: vorheizen und homen ..."
    EXTRUDER_OFFSET_ACTION_PRESTART

    {% for t in ['T0', 'T1', 'T2', 'T3'] %}
        M117 Offsets: {t} reinigen
        RESPOND TYPE=echo MSG="Werkzeug {t}: heizen, reinigen, abkuehlen ..."
        EXTRUDER_OFFSET_ACTION_HEAT TOOL_ID={t} HEAT_TEMP={CLEANTEMP}
        EXTRUDER_OFFSET_ACTION_AUTO_CLEAN TOOL_ID={t} SAFE_MOVE_Y_POS=250
        EXTRUDER_OFFSET_ACTION_WAIT_COOL TOOL_ID={t} TEMP={COOLTEMP}
    {% endfor %}

    M117 Offsets: messen
    RESPOND TYPE=echo MSG="Offsets: alle vier Werkzeuge vermessen ..."
    EXTRUDER_OFFSET_ACTION_PROBE_CALIBRATE_ALL

    # Alles oder nichts: fehlt auch nur ein Werkzeugergebnis, wird NICHTS gespeichert.
    EXTRUDER_OFFSET_ACTION_SAVE_RESULT FORCE_SAVE=0
    EXTRUDER_OFFSET_ACTION_EXIT
    M117 Offsets fertig
    RESPOND TYPE=echo MSG="Werkzeug-Offsets gemessen und gespeichert."

[gcode_macro HOTEND_SERVICE]
description: Kompletter Kalibrierlauf nach Hotend-/Duesentausch (ca. 1 h)
gcode:
    {% set PIDTEMP = params.PIDTEMP|default(240)|int %}
    {% set CLEANTEMP = params.CLEANTEMP|default(200)|int %}
    {% set BEDTEMP = params.BEDTEMP|default(80)|int %}
    {% set SOAK = params.SOAK|default(1200)|int %}
    {% set DO_PID = params.PID|default(1)|int %}
    {% set DO_MESH = params.MESH|default(0)|int %}
    {% set DO_SHAPER = params.SHAPER|default(1)|int %}

    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("HOTEND_SERVICE: Es laeuft ein Druck - abgebrochen.") }
    {% endif %}
    {% if PIDTEMP < 180 or PIDTEMP > 300 %}
        { action_raise_error("HOTEND_SERVICE: PIDTEMP=%d liegt ausserhalb 180-300 C." % PIDTEMP) }
    {% endif %}

    RESPOND TYPE=echo MSG="HOTEND_SERVICE gestartet - das dauert rund eine Stunde."

    {% if DO_PID %}
        RESPOND TYPE=echo MSG="Schritt 1/6: alle Koepfe entladen (PID braucht leere Duesen)"
        UNLOAD_ALL
        RESPOND TYPE=echo MSG="Schritt 2/6: PID-Autotune aller vier Koepfe bei {PIDTEMP} C"
        PID_ALL PIDTEMP={PIDTEMP} SAVE=0
        RESPOND TYPE=echo MSG="Schritt 3/6: alle Koepfe wieder laden (Offset-Reinigung braucht Filament)"
        LOAD_ALL
    {% else %}
        RESPOND TYPE=echo MSG="Schritte 1-3 uebersprungen (PID=0)"
    {% endif %}

    RESPOND TYPE=echo MSG="Schritt 4/6: Werkzeug-Offsets aller vier Koepfe"
    TOOL_OFFSET_ALL CLEANTEMP={CLEANTEMP}

    {% if DO_MESH %}
        # Standardmaessig AUS - siehe Begruendung im Kopf der Datei.
        # ADAPTIVE=0 ist noetig, sonst faehrt der Paxx-Wrapper ein Teilmesh.
        # SOAK: Zeitkonstante der Aufheizdrift ist tau = 8,1 min (Reihe 4, Fit mit
        # 1,5 um rms). 120 s = 61 um Fehler, 20 min = 6 um. Deshalb 1200 s Default.
        # Ohne diese Wartezeit ist die Wahl von BEDTEMP bedeutungslos: der Fehler
        # durch zu fruehes Messen ist dreimal so gross wie der Unterschied
        # zwischen einem 60- und einem 80-Grad-Mesh (20 um, Reihe 5).
        RESPOND TYPE=echo MSG="Schritt 5/6: Bett auf {BEDTEMP} C, {SOAK//60} min durchwaermen, dann volles Mesh"
        M117 Mesh: Bett heizen
        G90
        M190 S{BEDTEMP}
        M117 Mesh: {SOAK//60} min Heat-Soak
        G4 P{SOAK * 1000}
        M117 Mesh: messen
        BED_MESH_CALIBRATE ADAPTIVE=0
        TURN_OFF_HEATERS
    {% endif %}

    {% if DO_SHAPER %}
        # Seit 18.08. standardmaessig AN (auf Christophers Ansage). Kostet rund
        # 4 min und ist laut. Das Ergebnis bleibt erhalten, s. shaper_persist.cfg.
        # Mit SHAPER=0 abschaltbar, wenn nur die Duese getauscht wurde - die
        # Resonanzen aendern sich davon eigentlich nicht.
        RESPOND TYPE=echo MSG="Schritt 6/6: Vibrationsmessung (Input Shaper)"
        SHAPER_SERVICE
    {% endif %}

    TURN_OFF_HEATERS
    RESPOND TYPE=echo MSG="Noch von Hand: Duesendurchmesser am Touchscreen hinterlegen und in SnapmakerOrca 'Synchronize nozzle information'."
    M117 HOTEND_SERVICE fertig
    _SAVE_IF_PENDING
