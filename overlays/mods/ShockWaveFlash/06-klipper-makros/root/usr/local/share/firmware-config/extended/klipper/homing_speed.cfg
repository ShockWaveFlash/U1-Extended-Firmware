# XY-Homing-Geschwindigkeit — Overlay (last-wins, ueberlebt Firmware-Updates)
#
# Werkswert ist 40 mm/s. Der stammt aus der Zeit der 1.8-Grad-Werksmotoren.
# Seit dem Umbau auf LDO 0.9 Grad + Powge 26T 1.5GT (siehe motor_geometry.cfg)
# ist 40 mm/s zu schnell: halbes Drehmoment pro Schritt, der Kopf schiesst
# ueber den Ausloesepunkt hinaus.
#
# Messreihe 2026-08-21, je 4 Laeufe, dazwischen Mittelfahrt + 3 s Pause:
#   20 mm/s : FEHLTRIGGER im Leerlauf - homt ins Leere, faehrt diagonal rueckwaerts
#   25 mm/s : 0.073 mm Streuung, Einzelkontrolle 0.049 mm = 0.5 Vollschritte  <-- gewaehlt
#   40 mm/s : 0.26-0.33 mm, 17 Fehlversuche in 5 Laeufen  (Werkswert)
#   60 mm/s : knallt hoerbar in den Anschlag
#
# Das Arbeitsfenster ist nur ~35 mm/s breit und an beiden Enden hart begrenzt.
# Klipper-Faustregel (rotation_distance / 2 = 19.5 mm/s) liegt bereits im
# Fehltrigger-Bereich; 25 ist der praktisch ermittelte Wert.
#
# Ein Vollschritt entspricht hier 39/400 = 0.0975 mm.
# Sensorless Homing ist prinzipiell nur auf +/-1 Vollschritt reproduzierbar.

[stepper_x]
homing_speed: 25
second_homing_speed: 25

[stepper_y]
homing_speed: 25
second_homing_speed: 25
