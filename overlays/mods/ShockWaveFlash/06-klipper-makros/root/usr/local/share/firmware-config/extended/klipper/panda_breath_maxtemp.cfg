# Obergrenze der Kammerheizung auf das Geraetemaximum senken.
# Angelegt 2026-08-25 (Audit-Befund heizung-sicherheit-09, mittel).
#
# WARUM:
# Die verwaltete Datei /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg
# (per [include] aus panda_breath.cfg geladen) setzt fuer den Panda Breath max_temp: 80.
# Das Datenblatt von BIGTREETECH nennt aber ausdruecklich "Maximum Chamber Temperature: 60℃"
# (global.bttwiki.com/Panda_Breath.html; PTC-Grenze 105 °C, 300 W Heizleistung).
# Klipper reicht jeden Wert bis max_temp ungeprueft an das Geraet durch - ein Tippfehler
# im Slicer-Start-G-Code oder am HA-Schieber (80 statt 60) waere also widerspruchslos
# ausgefuehrt worden. Was das Geraet zwischen 61 und 80 tut, ist NICHT geprueft; die
# Herstellerdoku nennt nur einen "software safety monitor" ohne Zahlen.
#
# max_temp ist die einzige dieser Grenzen, die tatsaechlich greift: heaters.py:322 lehnt
# mit "Requested temperature out of range" ab, sobald der Wert GROESSER als max_temp ist.
# 60 selbst bleibt also erlaubt - genau der Wert, den das ABS-Profil und die HA-Automation
# verwenden.
#
# ⚠ REIHENFOLGE: Diese Datei wirkt nur, weil sie alphabetisch NACH panda_breath.cfg
#   geladen wird ([include extended/klipper/*.cfg], printer.cfg:1348).
#   Reihenfolge heute: panda_breath.cfg -> panda_breath_cavity_guard.cfg ->
#   panda_breath_maxtemp.cfg (diese) -> verify_heater_panda.cfg.
#   Sie darf nicht umbenannt werden, ohne das zu pruefen. Grundregel s. Memory
#   u1-mod-overlays-uebersicht.
# ⚠ Die Originaldatei liegt unter /usr/local/share und damit im Wegwerf-Overlay des
#   Root-Dateisystems - eine Aenderung dort waere beim naechsten Boot weg. Deshalb dieser
#   Override statt einer direkten Korrektur.

[heater_generic panda_breath]
max_temp: 60
