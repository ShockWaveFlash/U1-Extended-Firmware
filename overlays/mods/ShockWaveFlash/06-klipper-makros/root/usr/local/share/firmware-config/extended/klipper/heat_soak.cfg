# HEAT_SOAK -- Vorheizen fuer ABS/ASA ohne aktive Kammerheizung.
# Angelegt 2026-08-06, ueberarbeitet 2026-08-06, KALICO-FASSUNG 2026-08-23.
#
# ============================================================================
# WAS SICH MIT KALICO AENDERT
# Die Vorgaengerfassung musste auf eine feste Wartezeit (G4) ausweichen, weil
# TEMPERATURE_WAIT am 2026-08-06 den Drucker 30 Minuten blockiert hat: kein
# Zeitlimit, und die GESAMTE Befehlswarteschlange stand still -- CANCEL_PRINT,
# FIRMWARE_RESTART, M112 und der Touchscreen waren alle wirkungslos, Ausweg war
# nur `/etc/init.d/S60klipper restart` per SSH. Der Kommentar von damals hielt
# fest: "Ein Zeitlimit laesst sich in einem Klipper-Makro auch nicht
# nachruesten: Jinja wird EINMAL beim Aufruf gerendert."
#
# Genau das kann Kalico jetzt. Python-Makros (Zeilen mit `!`) laufen echt statt
# einmalig gerendert, und `wait_while(bedingung)` prueft die Bedingung
# sekuendlich. Kalicos wait_while bricht bei Drucker-Shutdown UND bei jedem
# Abbruch-Kommando ab (es vergleicht den gcode-Interrupt-Zaehler) -- die
# Blockade von damals ist damit konstruktiv ausgeschlossen.
#
# ⚠️ BRAUCHT KALICO. Auf Snapmakers Stock-Klipper laeuft diese Fassung NICHT
#    (dort gibt es keine Python-Makros). Fuer Stock: heat_soak.cfg aus dem
#    Branch `feature/paxx12-ai-zstd-20260819` verwenden.
# ============================================================================
#
# Aufruf:
#   HEAT_SOAK                       -> Bett 110 C, bis 15 min durchwaermen
#   HEAT_SOAK BED=110 MINUTES=20    -> eigene Werte
#   HEAT_SOAK BED=110 CHAMBER=45    -> wartet bis 45 C Kammer, HOECHSTENS aber
#                                      MINUTES lang. CHAMBER ist wieder echt
#                                      nutzbar, ohne Blockaderisiko.
#
# Ohne CHAMBER verhaelt es sich wie bisher: volle Zeit durchwaermen.
# Realistisch in Christophers Aufbau (Bett 110 C, ohne Panda Breath): ~40 C.
# Snapmakers 50-C-Angabe gilt mit montiertem Top Cover.
#
# last-wins Overlay -- ueberlebt Firmware-Updates.

[gcode_macro HEAT_SOAK]
description: Bett heizen und Bauraum durchwaermen (ABS/ASA, Kalico-Fassung)
gcode:
    !bed = float(params.get("BED", 110))
    !minutes = int(params.get("MINUTES", 15))
    !chamber_target = float(params.get("CHAMBER", 0))
    !
    !def cavity():
    !    return printer["temperature_sensor cavity"]["temperature"]
    !
    !action_respond_info(
    !    f"HEAT_SOAK: Bett auf {bed:.0f} C, danach bis zu {minutes} min"
    !    " durchwaermen (Deckel und Tueren zu!)"
    !)
    !emit(f"M140 S{bed}")
    !emit(f"M190 S{bed}")
    !
    !if chamber_target > 0:
    !    action_respond_info(
    !        f"HEAT_SOAK: Bett bereit, Kammer {cavity():.1f} C -- warte auf"
    !        f" {chamber_target:.0f} C, hoechstens {minutes} min"
    !    )
    !else:
    !    action_respond_info(
    !        f"HEAT_SOAK: Bett bereit, Kammer {cavity():.1f} C -- jetzt"
    !        f" {minutes} min warten"
    !    )
    !
    !# wait_while ruft die Bedingung im Sekundentakt auf; der Zaehler ist damit
    !# zugleich die Uhr. Abbruch durch den Nutzer beendet wait_while von selbst.
    !seconds_left = [minutes * 60]
    !
    !def keep_waiting():
    !    seconds_left[0] -= 1
    !    if seconds_left[0] <= 0:
    !        return False
    !    if chamber_target <= 0:
    !        return True
    !    return cavity() < chamber_target
    !
    !wait_while(keep_waiting)
    !
    !waited = minutes * 60 - max(seconds_left[0], 0)
    !if chamber_target > 0 and cavity() >= chamber_target:
    !    action_respond_info(
    !        f"HEAT_SOAK fertig: Kammer {cavity():.1f} C nach"
    !        f" {waited // 60} min -- Druck startet"
    !    )
    !else:
    !    action_respond_info(
    !        f"HEAT_SOAK fertig: Zeit um, Kammer {cavity():.1f} C"
    !        " -- Druck startet"
    !    )
