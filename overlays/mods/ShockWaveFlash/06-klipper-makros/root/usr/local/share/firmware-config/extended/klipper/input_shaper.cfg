# Input Shaper - Werte aus der geraeteeigenen Kalibrierung vom 2026-08-06 16:29.
# Quelle: /oem/printer_data/config/snapmaker/input_shaper.json
#   X: mzv 56.6 Hz   Y: mzv 48.8 Hz   (damping_ratio 0.1 = Klipper-Default)
#
# Warum dieses Overlay noetig ist: Die Kalibrierung SCHREIBT ihr Ergebnis nur
# in die JSON-Datei -- Klipper liest weiterhin die Werkswerte aus der
# printer.cfg (54 / 47.5 Hz). Ohne dieses Overlay bleibt die Messung wirkungslos.
#
# Plausibilitaet: Die eigene Messung vom 2026-08-05 (nach dem LDO-Umbau) ergab
# 57.8 / 50.8 Hz -- dieselbe Groessenordnung, die Werte passen zusammen.
#
# last-wins Overlay -- ueberlebt Firmware-Updates.

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 56.6
shaper_type_y: mzv
shaper_freq_y: 48.8
