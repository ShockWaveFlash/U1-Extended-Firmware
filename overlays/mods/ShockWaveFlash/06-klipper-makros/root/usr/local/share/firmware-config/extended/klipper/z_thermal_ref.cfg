# Automatische Referenztemperatur fuer [z_thermal_adjust] — 2026-08-21
#
# Warum: Klippers eingebauter Hook haengt am Event "homing:home_rails_end".
# Der U1 homet Z NICHT ueber Klippers home_rails -> der Hook feuert nie, die
# Referenz bleibt auf 0.0 stehen und ergibt ~0,2 mm Z-Versatz (Anschlag von
# max_z_adjustment). Deshalb hier ein eigener Flankenwaechter.
#
# Bewusst KEIN [gcode_macro G28]-Wrapper: der Waechter erkennt das Homing
# ohnehin, nur bis zu 10 s spaeter. Bei 0,0037 K/s Rampe sind das 0,5 um —
# das rechtfertigt keinen Eingriff in G28.

[gcode_macro _Z_THERMAL_REF_SET]
description: Setzt die Referenztemperatur von z_thermal_adjust auf den Istwert
gcode:
    {% set t = printer.z_thermal_adjust.temperature %}
    {% if t > 10 %}
        SET_Z_THERMAL_ADJUST REF_TEMP={t}
        RESPOND MSG="Z-Thermal-Referenz: {t|round(2)} C"
    {% else %}
        RESPOND MSG="Z-Thermal-Referenz NICHT gesetzt: {t|round(2)} C unplausibel"
    {% endif %}

[gcode_macro _Z_THERMAL_REF_STATE]
description: Merker fuer den Flankenwaechter
variable_zhomed: 0
gcode:

[delayed_gcode _Z_THERMAL_REF_WATCH]
initial_duration: 10
gcode:
    {% set z_now = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
    {% if z_now and not printer['gcode_macro _Z_THERMAL_REF_STATE'].zhomed %}
        _Z_THERMAL_REF_SET
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE={z_now}
    UPDATE_DELAYED_GCODE ID=_Z_THERMAL_REF_WATCH DURATION=10
