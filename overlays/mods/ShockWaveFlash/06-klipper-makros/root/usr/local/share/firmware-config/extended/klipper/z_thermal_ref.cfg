# Automatische Referenztemperatur fuer [z_thermal_adjust] — 2026-08-21
#
# Warum: Klippers eingebauter Hook haengt am Event "homing:home_rails_end".
# Der U1 homet Z NICHT ueber Klippers home_rails -> der Hook feuert nie, die
# Referenz bleibt auf 0.0 stehen und ergibt ~0,2 mm Z-Versatz (Anschlag von
# max_z_adjustment). Deshalb hier ein eigener Flankenwaechter.
#
# ⚠️ Fix 2026-08-23: Der Merker zhomed wurde frueher IMMER auf den Homing-Zustand
# gesetzt - auch wenn _Z_THERMAL_REF_SET die Temperatur als unplausibel (<=10 C)
# verworfen hatte. Damit gab es keinen zweiten Versuch: der Waechter hielt sich fuer
# fertig, die Referenz blieb auf 0.0 und der ganze Druck lief am 0,2-mm-Anschlag von
# max_z_adjustment. Jetzt setzt NUR der Erfolgszweig den Merker; der Waechter setzt
# ihn allein zurueck, wenn Z das Homing verliert. Bei unplausibler Temperatur wird
# alle 10 s erneut versucht.

# ⚠️ Fix 2 vom 2026-08-23: Der Waechter setzte die Referenz erst NACH dem Homing.
# Bis dahin stand ref auf 0.0 und die Kompensation rechnete mit der VOLLEN
# Rahmentemperatur als Differenz - am Geraet gemessen -0,338 mm bei 25,4 C.
# ★ Wichtig zur Einordnung: [z_thermal_adjust] haengt per gcode_move.set_move_transform
# an gcode_move (Zeile 69 in z_thermal_adjust.py), NICHT am toolhead. Das HOMING
# selbst laeuft ueber homing.py am toolhead vorbei und ist deshalb NICHT betroffen.
# Betroffen ist die erste G-CODE-BEWEGUNG nach dem Homing, solange die Referenz noch
# auf 0.0 steht - beim Druckstart also die Anfahrt zur ersten Schicht oder der erste
# Mesh-Messpunkt. max_z_adjustment begrenzte nur, wie gross dieser Fehler werden kann.
# Jetzt wird die Referenz mitgezogen, SOLANGE Z ungehomt ist (dann ist current_z_adjust
# ~0), und erst mit der steigenden Flanke eingefroren. Ab da kompensiert sie die echte
# thermische Drift. Gemessen nach dem Fix: adj direkt nach G28 = -0,0021 statt -0,3380.
# ★ Damit stimmt auch die 0,5-um-Rechnung unten wieder: sie gilt fuer die
# Temperaturaenderung im verbleibenden 10-s-Fenster, nicht fuer die Absoluttemperatur.

# Bewusst KEIN [gcode_macro G28]-Wrapper: der Waechter erkennt das Homing
# ohnehin, nur bis zu 10 s spaeter. Bei 0,0037 K/s Rampe sind das 0,5 um —
# das rechtfertigt keinen Eingriff in G28.

[gcode_macro _Z_THERMAL_REF_SET]
description: Setzt die Referenztemperatur von z_thermal_adjust auf den Istwert
gcode:
    {% set t = printer.z_thermal_adjust.temperature %}
    {% if t > 10 %}
        SET_Z_THERMAL_ADJUST REF_TEMP={t}
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE=1
        RESPOND MSG="Z-Thermal-Referenz: {t|round(2)} C"
    {% else %}
        RESPOND MSG="Z-Thermal-Referenz NICHT gesetzt: {t|round(2)} C unplausibel - neuer Versuch in 10 s"
    {% endif %}

[gcode_macro _Z_THERMAL_REF_STATE]
description: Merker fuer den Flankenwaechter
variable_zhomed: 0
gcode:

[delayed_gcode _Z_THERMAL_REF_WATCH]
initial_duration: 10
gcode:
    {% set z_now = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
    {% set st = printer['gcode_macro _Z_THERMAL_REF_STATE'] %}
    {% set t = printer.z_thermal_adjust.temperature %}
    {% set druckt = 1 if printer.print_stats.state in ['printing', 'paused'] else 0 %}
    {% if not z_now and not druckt %}
        # Z ist NICHT gehomt und es laeuft KEIN Druck: Referenz mitziehen, damit
        # current_z_adjust ~0 bleibt und die erste Bewegung nach dem Homing sauber ist.
        # ⚠ Die druckt-Bedingung ist wichtig: Verliert ein laufender Druck das Homing
        # (manuelles M84), duerfte die Referenz NICHT auf die dann heisse Temperatur
        # nachgezogen werden - beim Fortsetzen waere die aufgelaufene Kompensation weg
        # und Z spraenge um genau diesen Betrag. Der Leerlauf-Timeout (300 s -> M84)
        # kann das nicht ausloesen, weil timeout_on_pause praktisch unendlich ist.
        {% if t > 10 %}
            SET_Z_THERMAL_ADJUST REF_TEMP={t}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE=0
    {% elif not st.zhomed %}
        # Steigende Flanke: Referenz einmal endgueltig setzen und einfrieren.
        {% if t > 10 %}
            SET_Z_THERMAL_ADJUST REF_TEMP={t}
            SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE=1
            RESPOND MSG="Z-Thermal-Referenz eingefroren: {t|round(2)} C"
        {% else %}
            RESPOND MSG="Z-Thermal-Referenz NICHT gesetzt: {t|round(2)} C unplausibel - neuer Versuch in 10 s"
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_Z_THERMAL_REF_WATCH DURATION=10
