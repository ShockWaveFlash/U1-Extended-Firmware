# Luefterausfall-Erkennung fuer die vier Hotend-Luefter und den Bauteilluefter.
#
#   FAN_GUARD_STATUS   -> aktueller Zustand aller ueberwachten Luefter
#   FAN_GUARD_OFF      -> Wache aus (z. B. fuer Wartung)
#   FAN_GUARD_ON       -> Wache wieder an
#
# WARUM (09.09.2026):
# Die Tachos sind verdrahtet und Kalico liest sie (printer.cfg:734 und :762), aber
# NICHTS vergleicht sie mit einem Sollwert -- heater_fan.py und fan_generic.py
# enthalten das Wort "rpm" nicht einmal. Ein blockierter Hotendluefter fuehrt damit
# still zu Heat Creep: das Filament erweicht oberhalb der Schmelzzone, die Duese
# verstopft mitten im Druck, ohne jede Meldung. Vier Hotends = vier blinde Flecken.
#
# VORBILD IST NICHT PRUSA, SONDERN DAS HAUS SELBST:
# purifier.py:438-452 macht fuer den Luftreiniger-Innenluefter exakt das hier
# (speed > 0 und rpm == 0, Zaehler bis FAN_RPM_FAULT_THRESHOLD = 20, danach
# raise_structured_code_exception). Diese Logik fehlte nur fuer die Kuehlluefter.
#
# GEMESSEN AM GERAET (09.09.2026, Duese 0 aufgeheizt):
#   stepped_temp_table-Stufe 0.30 (ab 45 Grad)  -> 7300 rpm  (Streuung < 1 %)
#   stepped_temp_table-Stufe 0.75 (ab 220 Grad) -> 17700 rpm (Streuung < 0,3 %)
#   Zusammenhang praktisch linear, rund 24000 rpm je Duty-Einheit.
# ⚠️⚠️ Die Schwelle ist BEWUSST absolut (MIN_RPM) und nicht prozentual: Der
# Zusammenhang Sollwert->Drehzahl haengt an der PWM-Frequenz und verschiebt sich,
# sobald jemand cycle_time aendert (belegt: 5922 rpm bei 200 Hz gegen 8811 rpm bei
# 1000 Hz, jeweils 40 %). Eine prozentuale Schwelle waere danach still falsch.
# Erkannt wird der Fall, der wirklich schadet: der Luefter STEHT.
#
# ⚠️ WAS IM FEHLERFALL PASSIERT -- und warum nicht nur pausiert wird:
# Kalico laesst die Heizungen in der Pause unbegrenzt an (timeout_on_pause).
# Wuerde die Wache nur pausieren, liefe der Heat Creep munter weiter. Deshalb wird
# ZUERST der betroffene Extruder auf 0 gesetzt und erst dann pausiert.
# ⛔ KEIN invoke_shutdown -- das verlangt einen FIRMWARE_RESTART, s. u1-sicherheitsautomationen.
#
# ⚠️ Fehlalarm-Kosten: Jede Pause laeuft in die 45-Minuten-Wache, und beim
# Fortsetzen bleibt das Bett auf 0 (u1-heizbett-faellt-auf-null). Deshalb
# MIN_SPEED 0.25 (darunter misst der Tacho unzuverlaessig) und STRIKES 4
# (= 20 Sekunden Dauerfehler), bevor irgendetwas passiert.
#
# last-wins Overlay -- ueberlebt Firmware-Updates. Kein Patch an heater_fan.py:
# die Datei ist Snapmaker-modifiziert (probe_speed, stepped_temp_table) und
# wuerde bei jedem Update kollidieren.

[gcode_macro FAN_GUARD]
description: Zustandsspeicher der Luefterwache
variable_enabled: 1
variable_min_speed: 0.25
variable_min_rpm: 1000
variable_strikes: 4
variable_s_fan: 0
variable_s_e0: 0
variable_s_e1: 0
variable_s_e2: 0
variable_s_e3: 0
gcode:
    FAN_GUARD_STATUS

[gcode_macro FAN_GUARD_STATUS]
description: Zeigt Sollwert, Drehzahl und Fehlerzaehler aller ueberwachten Luefter
gcode:
    {% set g = printer['gcode_macro FAN_GUARD'] %}
    RESPOND MSG="FAN_GUARD: {'aktiv' if g.enabled else 'AUS'} | Schwelle {g.min_rpm} rpm ab Sollwert {g.min_speed} | {g.strikes} Fehlmessungen bis Alarm"
    {% for name, key in [('fan','s_fan'), ('heater_fan e0_nozzle_fan','s_e0'),
                         ('heater_fan e1_nozzle_fan','s_e1'), ('heater_fan e2_nozzle_fan','s_e2'),
                         ('heater_fan e3_nozzle_fan','s_e3')] %}
        {% if name in printer %}
            {% set f = printer[name] %}
            RESPOND MSG="  {name}: Soll {f.speed|round(2)} | {(f.rpm|default(0))|round|int} rpm | Zaehler {g[key]}"
        {% endif %}
    {% endfor %}

[gcode_macro FAN_GUARD_ON]
description: Luefterwache einschalten
gcode:
    SET_GCODE_VARIABLE MACRO=FAN_GUARD VARIABLE=enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=fan_guard_tick DURATION=5
    RESPOND MSG="FAN_GUARD: eingeschaltet"

[gcode_macro FAN_GUARD_OFF]
description: Luefterwache ausschalten (Wartung)
gcode:
    SET_GCODE_VARIABLE MACRO=FAN_GUARD VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=fan_guard_tick DURATION=0
    RESPOND MSG="FAN_GUARD: AUSGESCHALTET -- Luefterausfall wird nicht mehr erkannt"

# Reaktion auf einen bestaetigten Ausfall. TOOL = Extrudernummer, -1 = Bauteilluefter.
[gcode_macro _FAN_GUARD_ALARM]
gcode:
    {% set fan = params.FAN %}
    {% set tool = params.TOOL | int %}
    {% set rpm = params.RPM %}
    {% set spd = params.SPEED %}
    RESPOND TYPE=error MSG="FAN_GUARD: {fan} steht still -- Sollwert {spd}, aber nur {rpm} rpm."
    {% if tool >= 0 %}
        # Zuerst die Waerme weg: Heat Creep laeuft sonst in der Pause weiter.
        SET_HEATER_TEMPERATURE HEATER={'extruder' if tool == 0 else 'extruder%d' % tool} TARGET=0
        RESPOND TYPE=error MSG="FAN_GUARD: Duese {tool} abgeschaltet (Heat-Creep-Schutz)."
    {% else %}
        M107
        RESPOND TYPE=error MSG="FAN_GUARD: Bauteilluefter abgeschaltet."
    {% endif %}
    {% if printer.print_stats.state == 'printing' %}
        PAUSE
        RESPOND TYPE=error MSG="FAN_GUARD: Druck pausiert. Luefter pruefen, dann FAN_GUARD_ON und fortsetzen."
    {% endif %}
    SET_GCODE_VARIABLE MACRO=FAN_GUARD VARIABLE=enabled VALUE=0

[delayed_gcode fan_guard_tick]
initial_duration: 30
gcode:
    {% set g = printer['gcode_macro FAN_GUARD'] %}
    {% if g.enabled %}
        {% for name, key, tool in [('fan','s_fan',-1),
                                   ('heater_fan e0_nozzle_fan','s_e0',0),
                                   ('heater_fan e1_nozzle_fan','s_e1',1),
                                   ('heater_fan e2_nozzle_fan','s_e2',2),
                                   ('heater_fan e3_nozzle_fan','s_e3',3)] %}
            {% if name in printer %}
                {% set f = printer[name] %}
                {% set spd = f.speed | default(0) | float %}
                {% set rpm = f.rpm | default(0) | float %}
                {% if spd >= g.min_speed and rpm < g.min_rpm %}
                    {% set n = g[key] + 1 %}
                    SET_GCODE_VARIABLE MACRO=FAN_GUARD VARIABLE={key} VALUE={n}
                    {% if n >= g.strikes %}
                        _FAN_GUARD_ALARM FAN="{name}" TOOL={tool} RPM={rpm|round|int} SPEED={spd|round(2)}
                    {% endif %}
                {% elif g[key] > 0 %}
                    SET_GCODE_VARIABLE MACRO=FAN_GUARD VARIABLE={key} VALUE=0
                {% endif %}
            {% endif %}
        {% endfor %}
        UPDATE_DELAYED_GCODE ID=fan_guard_tick DURATION=5
    {% endif %}
