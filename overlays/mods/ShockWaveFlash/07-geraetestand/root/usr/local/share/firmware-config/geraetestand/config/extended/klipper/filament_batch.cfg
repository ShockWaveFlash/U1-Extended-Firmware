# Filament in allen vier Werkzeugkoepfen auf einmal entladen / laden.
#
#   UNLOAD_ALL     -> entlaedt alle geladenen Koepfe
#   LOAD_ALL       -> laedt alle Koepfe, die Filament im Modul haben
#   FEED_STATUS    -> zeigt nur den Zustand der vier Kanaele an (bewegt nichts)
#   FEED_ABORT     -> Notausstieg: beendet einen haengengebliebenen Batch
#
# Grundlage ist die firmwareeigene Kette AUTO_FEEDING_BATCH (fluidd.cfg Z. 1666).
# Sie heizt selbst materialrichtig vor (AUTO_FEEDING_PREHEAT), homet bei Bedarf
# und wechselt das Werkzeug selbst - deshalb hier kein eigenes T0..T3 / M109.
#
# Warum die Zwischenmakros _UNLOAD_ONE/_UNLOAD_DOING noetig sind:
# Ein Klipper-Makro rendert sein Jinja EINMAL vor der Ausfuehrung. Der Kanal-
# zustand nach einem Teilschritt ist also erst in einem SPAETER aufgerufenen
# Makro sichtbar. Das ist hier keine Kosmetik: der doing-Zweig verlangt exakt
# channel_state == 'unload_heat_finish' und wirft sonst 'state mismatch'
# (filament_feed.py:1337) - der Fehler schlaegt bis nach oben durch und wuerde
# den ganzen Ablauf abbrechen.

[gcode_macro _FEED_CH_ECHO]
description: Hilfsmakro - gibt den Zustand EINES Kanals aus
gcode:
    {% set e = params.EXTRUDER|int %}
    {% set key = 'extruder' ~ e %}
    {% set fl = printer['filament_feed left'] %}
    {% set fr = printer['filament_feed right'] %}
    {% if key in fl %}{% set ch = fl[key] %}
    {% elif key in fr %}{% set ch = fr[key] %}
    {% else %}{% set ch = {} %}{% endif %}
    RESPOND TYPE=echo MSG="Kopf {e}: {ch.channel_state|default('?')} (Fehler: {ch.channel_error|default('?')}, Filament: {ch.filament_detected|default('?')})"

[gcode_macro FEED_STATUS]
description: Zustand aller vier Filamentkanaele anzeigen
gcode:
    {% for e in range(4) %}
        _FEED_CH_ECHO EXTRUDER={e}
    {% endfor %}

[gcode_macro FEED_ABORT]
description: Haengengebliebenen Filament-Batch beenden (Heizungen aus)
gcode:
    AUTO_FEEDING_BATCH ACTION=END
    TURN_OFF_HEATERS
    RESPOND TYPE=echo MSG="Filament-Batch beendet."

# ---------------------------------------------------------------- entladen ---

[gcode_macro _UNLOAD_DOING]
description: Hilfsmakro - zweite Stufe des Entladens, nur bei passendem Zustand
gcode:
    {% set e = params.EXTRUDER|int %}
    {% set key = 'extruder' ~ e %}
    {% set fl = printer['filament_feed left'] %}
    {% set fr = printer['filament_feed right'] %}
    {% if key in fl %}{% set ch = fl[key] %}
    {% elif key in fr %}{% set ch = fr[key] %}
    {% else %}{% set ch = {} %}{% endif %}
    {% set st = ch.channel_state|default('none') %}
    {% if st == 'unload_heat_finish' %}
        AUTO_FEEDING_BATCH ACTION=DOING EXTRUDER={e} UNLOAD=1 STAGE=doing
    {% else %}
        RESPOND TYPE=echo MSG="Kopf {e}: Entladen schon im ersten Schritt fertig ({st})."
    {% endif %}

[gcode_macro _UNLOAD_ONE]
description: Hilfsmakro - einen Kopf entladen, falls ueberhaupt Filament drin ist
gcode:
    {% set e = params.EXTRUDER|int %}
    {% set key = 'extruder' ~ e %}
    {% set fl = printer['filament_feed left'] %}
    {% set fr = printer['filament_feed right'] %}
    {% if key in fl %}{% set ch = fl[key] %}
    {% elif key in fr %}{% set ch = fr[key] %}
    {% else %}{% set ch = {} %}{% endif %}
    {% set st = ch.channel_state|default('none') %}
    {% if st.startswith('load') %}
        M117 Entladen: Kopf {e}
        RESPOND TYPE=echo MSG="Kopf {e}: entladen ({st}) ..."
        AUTO_FEEDING_BATCH ACTION=DOING EXTRUDER={e} UNLOAD=1 STAGE=prepare
        _UNLOAD_DOING EXTRUDER={e}
    {% else %}
        RESPOND TYPE=echo MSG="Kopf {e}: uebersprungen, kein Filament geladen ({st})."
    {% endif %}

[gcode_macro UNLOAD_ALL]
description: Filament aus allen vier Werkzeugkoepfen entladen
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("UNLOAD_ALL: Es laeuft ein Druck - abgebrochen.") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    AUTO_FEEDING_BATCH ACTION=START
    {% for e in range(4) %}
        _UNLOAD_ONE EXTRUDER={e}
    {% endfor %}
    AUTO_FEEDING_BATCH ACTION=END
    TURN_OFF_HEATERS
    M117 Entladen fertig
    FEED_STATUS

# ------------------------------------------------------------------ laden ---

[gcode_macro _LOAD_ONE]
description: Hilfsmakro - einen Kopf laden, falls er nicht schon geladen ist
gcode:
    {% set e = params.EXTRUDER|int %}
    {% set key = 'extruder' ~ e %}
    {% set fl = printer['filament_feed left'] %}
    {% set fr = printer['filament_feed right'] %}
    {% if key in fl %}{% set ch = fl[key] %}
    {% elif key in fr %}{% set ch = fr[key] %}
    {% else %}{% set ch = {} %}{% endif %}
    {% set st = ch.channel_state|default('none') %}
    {% if st == 'load_finish' %}
        RESPOND TYPE=echo MSG="Kopf {e}: uebersprungen, ist bereits geladen."
    {% elif ch.module_exist|default(false) != true %}
        RESPOND TYPE=echo MSG="Kopf {e}: uebersprungen, kein Zufuehrmodul erkannt."
    {% else %}
        {% if st == 'wait_insert' %}
            RESPOND TYPE=echo MSG="Kopf {e}: ACHTUNG - kein Filament im Modul, Ladeversuch bleibt evtl. wirkungslos."
        {% endif %}
        M117 Laden: Kopf {e}
        RESPOND TYPE=echo MSG="Kopf {e}: laden ({st}) ..."
        AUTO_FEEDING_BATCH ACTION=DOING EXTRUDER={e} LOAD=1
    {% endif %}

[gcode_macro LOAD_ALL]
description: Filament in alle vier Werkzeugkoepfe laden
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        { action_raise_error("LOAD_ALL: Es laeuft ein Druck - abgebrochen.") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    AUTO_FEEDING_BATCH ACTION=START
    {% for e in range(4) %}
        _LOAD_ONE EXTRUDER={e}
    {% endfor %}
    AUTO_FEEDING_BATCH ACTION=END
    TURN_OFF_HEATERS
    M117 Laden fertig
    FEED_STATUS
