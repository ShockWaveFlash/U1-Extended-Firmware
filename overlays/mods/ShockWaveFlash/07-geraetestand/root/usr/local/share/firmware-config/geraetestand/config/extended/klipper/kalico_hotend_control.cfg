# Erzeugt von firmware-config (Kalico -> Hotend-Regelung).
# Nicht von Hand aendern.
#
# MPC rechnet mit einem physikalischen Modell des Hotends. Ohne
# MPC_CALIBRATE sind die Werte unten nur Schaetzungen.

[extruder]
control: mpc
heater_power: 48
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.24
filament_heat_capacity: 1.8

[extruder1]
control: mpc
heater_power: 48
cooling_fan: fan_generic e1_fan
filament_diameter: 1.75
filament_density: 1.24
filament_heat_capacity: 1.8

[extruder2]
control: mpc
heater_power: 48
cooling_fan: fan_generic e2_fan
filament_diameter: 1.75
filament_density: 1.24
filament_heat_capacity: 1.8

[extruder3]
control: mpc
heater_power: 48
cooling_fan: fan_generic e3_fan
filament_diameter: 1.75
filament_density: 1.24
filament_heat_capacity: 1.8
