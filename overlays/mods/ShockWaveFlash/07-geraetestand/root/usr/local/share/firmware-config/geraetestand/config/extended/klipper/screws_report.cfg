# Klartext-Zahlen fuer die Schraubennivellierung.
# Angelegt 2026-08-18, weil der Touchscreen nur einen Balken mit zwei Strichen
# zeigt ("gruen = gut") und man daran nicht ablesen kann, WIE weit man daneben
# liegt oder ob eine schon eingestellte Ecke wieder mitgewandert ist.
#
#   SCREWS_REPORT   -> die vier gemessenen Eckhoehen im Klartext, in Mikrometer
#
# WAS DER BALKEN VERSCHWEIGT (Quellcode gelesen, 18.08.2026):
# auto_screws_tilt_adjust.py fuehrt intern alles mit fuenf Nachkommastellen und
# exportiert es per get_status (Z.145-161): base_point1..4 = die gemessene Hoehe
# an jeder Schraube, need_adjusted_z = Restfehler der gerade bearbeiteten,
# min_z / max_z / target_z. Die GUI abonniert dieses Objekt sogar (String-Fund
# in /usr/bin/gui), zeichnet daraus aber nur den Balken.
# Gruen bedeutet: Restfehler < adjust_tolerance. Das steht am Geraet auf
# 0,025 mm -> "gruen" heisst also nur "irgendwo innerhalb 25 um".
#
# ZUORDNUNG DER ECKEN (printer.cfg, [auto_screws_tilt_adjust]):
#   1 = vorne links (15,15)     2 = vorne rechts (255,15)
#   4 = hinten links (15,255)   3 = hinten rechts (255,255)
# Abgearbeitet wird in der Reihenfolge screw_order: 2 -> 3 -> 4 -> 1.
#
# ANKNUEPFUNG AN DIE ORIGINAL-GUI:
# Die Touchscreen-Nivellierung ist keine Blackbox, sie ruft der Reihe nach
# einzelne G-Code-Kommandos auf (alle als Strings in /usr/bin/gui belegt):
#   ENTRY -> HOMING -> DETECT_PLATE -> RESET_TO_INITIAL
#   -> PROBE_REFERENCE_POINTS  (misst alle vier Ecken, danach stehen die Werte)
#   -> MANUAL_TUNING (je Schraube, hier laeuft das Drehen) -> EXIT
# Deshalb genuegt ein Wrapper um diese beiden Schritte, damit die Zahlen bei
# der normalen Bedienung ueber den Touchscreen von selbst mitlaufen.
# ⚠️ Die Ausgabe erscheint in der Konsole (Mainsail), NICHT auf dem Touchscreen
# -- die GUI ist ein kompiliertes Binary, deren Anzeige laesst sich von hier aus
# nicht veraendern. Beim Schraubendrehen also Handy/Tablet mit Mainsail daneben.

[gcode_macro SCREWS_REPORT]
description: Die vier Eckhoehen der Schraubennivellierung als Zahlen in um
gcode:
    {% set s = printer['auto_screws_tilt_adjust'] %}

    {% if s.base_point1 is none %}
        RESPOND TYPE=echo MSG="SCREWS_REPORT: noch keine Messung vorhanden - erst die Nivellierung am Touchscreen starten (oder AUTO_SCREWS_TILT_ADJUST)."
    {% else %}
        {% set p = [s.base_point1, s.base_point2, s.base_point3, s.base_point4] %}
        {% set namen = ['vorne links ', 'vorne rechts', 'hinten rechts', 'hinten links'] %}
        # Bezug ist target_z, wenn die Firmware eines gesetzt hat, sonst der
        # Mittelwert der vier Ecken.
        {% set bezug = s.target_z if s.target_z is not none else (p|sum / 4) %}

        RESPOND TYPE=echo MSG="--- Schraubennivellierung, Abweichung je Ecke (+ = Ecke steht zu tief) ---"
        {% for i in range(4) %}
            RESPOND TYPE=echo MSG="Schraube {i+1} {namen[i]}: {'%+7.1f' % ((bezug - p[i]) * 1000)} um"
        {% endfor %}
        RESPOND TYPE=echo MSG="Spanne hoechste/niedrigste Ecke: {'%.1f' % ((p|max - p|min) * 1000)} um   (gruener Balken ab {'%.0f' % (s.adjust_tolerance * 1000)} um)"
    {% endif %}

# --- Feinere Toleranz --------------------------------------------------------
# ENTRY nimmt ADJUST_TOLERANCE und SCREW_ADJUST_THRESHOLD als Parameter
# (auto_screws_tilt_adjust.py:431-435, Bedingung: TOLERANCE <= THRESHOLD).
# Die GUI ruft ENTRY ohne Parameter -> es blieb bei 0,025 mm. Hier auf 0,015 mm
# verschaerft: die Sonde streut mit ~5 um, 15 um sind also noch sauber
# aufloesbar, und die gemessene Bettschiefe liegt mit 50-80 um weit darueber.
# ⚠️ Je feiner die Toleranz, desto laenger das Nachjustieren -- der Balken wird
# spaeter gruen. Wird es zu fummelig, ist der Rueckweg eine Zeile: hier
# ADJUST_TOLERANCE=0.025 eintragen, oder einmalig von Hand
# "AUTO_SCREWS_TILT_ADJUST_ENTRY ADJUST_TOLERANCE=0.025" absetzen (der Wert
# bleibt dann bis zum naechsten Klipper-Neustart stehen).
# ⚠️ max_adjust_times steht auf 100 - bei zu strenger Toleranz kann die
# Prozedur theoretisch aufgeben, bevor sie fertig ist.

# ⚠️⚠️ ES SIND ZWEI PARAMETER, UND DER WICHTIGERE IST screw_adjust_threshold.
# Am 18.08. gemessen: Spanne 48,8 um, und die GUI meldete trotzdem "manuelle
# Nivellierung erfolgreich". Grund (auto_screws_tilt_adjust.py:222):
#     if abs(self.max_z - self.min_z) < self.screw_adjust_threshold:
#         "All 4 points meet requirements, no further adjustment needed"
# und Z.76: Vorgabewert 0.1 -- in printer.cfg ist der Wert NICHT gesetzt.
# Der U1 verlangt ab Werk also erst bei ueber 100 um Schieflage ein Nachstellen.
#   screw_adjust_threshold = ab welcher Spanne ueberhaupt gedreht werden soll
#   adjust_tolerance       = wann der Balken beim Drehen gruen wird (max. = threshold)
# Beide muessen gesenkt werden; nur adjust_tolerance zu senken ist wirkungslos,
# weil die Prozedur dann schon vorher "fertig" meldet.
# Gewaehlt: 30 um Schwelle / 15 um Zielkorridor. Die Schwelle liegt bewusst
# ueber der Toleranz -- sonst wird man wegen 16 um zum Drehen aufgefordert und
# kaempft sich dann muehsam unter 15 um.

[gcode_macro AUTO_SCREWS_TILT_ADJUST_ENTRY]
rename_existing: AUTO_SCREWS_TILT_ADJUST_ENTRY_BASE
description: Nivellierung starten (Original), aber mit feinerer Toleranz
gcode:
    {% if params.ADJUST_TOLERANCE is defined or params.SCREW_ADJUST_THRESHOLD is defined %}
        AUTO_SCREWS_TILT_ADJUST_ENTRY_BASE {rawparams}
    {% else %}
        AUTO_SCREWS_TILT_ADJUST_ENTRY_BASE {rawparams} ADJUST_TOLERANCE=0.015 SCREW_ADJUST_THRESHOLD=0.03
    {% endif %}

# --- Durchwaermen vor dem Antasten -------------------------------------------
# Warum ueberhaupt: Der Rahmen waechst beim Aufheizen (tau = 8,1 min, gemessen
# 17.08.), und ein Teil davon aeussert sich als KIPPUNG in X -- also genau als
# das, was hier mit den Schrauben eingestellt wird. Wer im Moment des
# Temperaturerreichens nivelliert, stellt die Ecken auf einen Zustand ein, den
# der Drucker im Betrieb nie hat: bei 80 C sind das rund 47 um Kippung, das
# Dreifache der Toleranz von 15 um. Die Wartezeit ist also kein Feinschliff,
# sondern entscheidet darueber, ob die ganze Prozedur ueberhaupt etwas taugt.
#
# ⚠️ NICHT _MESH_HEAT_SOAK benutzen (mesh_heatsoak.cfg): das stellt am Ende
# SET_IDLE_TIMEOUT auf den Normalwert 300 s zurueck. Mitten in der
# Nivellierung waere das schaedlich -- das Drehen einer Schraube dauert leicht
# laenger als 5 Minuten, und die Motoren duerfen dabei nicht abschalten.
#
# IDLE-TIMEOUT hier: AUTO_SCREWS_TILT_ADJUST_ENTRY setzt ihn selbst auf
# idle_timeout.timeout_on_pause (auto_screws_tilt_adjust.py:446-450), und der
# steht in printer.cfg auf 9999999999 -- waehrend der Nivellierung koennen die
# Motoren also gar nicht abschalten. Die Zeile unten setzt denselben Wert noch
# einmal, damit die Routine auch dann sicher ist, wenn sie ohne ENTRY
# aufgerufen wird. Aufgeraeumt wird am Ende von ..._EXIT (setzt 300 zurueck).
#
# ⚠️ UNGEPRUEFT bleibt, ob die Touchscreen-GUI das lange Ausbleiben der
# Antwort auf PROBE_REFERENCE_POINTS mitmacht oder in einen eigenen Timeout
# laeuft -- sie ist ein kompiliertes Binary. Beim ersten Lauf danebenstehen.
# Wenn sie haengt: MINUTES-Staffelung unten auf 0 setzen und stattdessen von
# Hand vorheizen (Bett in Mainsail auf 80, 10 min warten, dann starten).

# ⚠️⚠️ WARUM ES EIN "SCHON GEWAERMT"-MERKZEICHEN GIBT (Vorfall 18.08., 21:52):
# Waehrend der Soak lief, reagierte der Touchscreen nicht mehr -- jeder
# Tastendruck geht als G-Code an Klipper, und Klipper hing im G4. Christopher
# hat daraufhin zehnmal getippt. Klipper hat alle zehn Aufrufe brav in die
# Warteschlange gelegt, also ZEHN Durchlaeufe zu je 5 min Warten plus Antasten
# = rund 50 Minuten. Aufgeraeumt werden konnte das nur mit
# "/etc/init.d/S60klipper restart" (leert die Warteschlange; ein Notaus ueber
# Moonraker gibt es nicht, /printer/emergency_stop antwortet mit 404).
# Das Merkzeichen sorgt dafuer, dass pro Nivellierung nur EINMAL gewartet wird;
# weitere Aufrufe laufen sofort durch.
# Zurueckgesetzt wird es von ..._EXIT, also am Ende der Nivellierung -- NICHT
# von ENTRY. Dadurch laesst sich eine Wartezeit auch bewusst ueberspringen,
# wenn das Bett schon lange warm ist:
#     SET_GCODE_VARIABLE MACRO=_SCREWS_STATE VARIABLE=soaked VALUE=1
# und umgekehrt eine erneute erzwingen mit VALUE=0.

[gcode_macro _SCREWS_STATE]
description: Merkzeichen, ob in dieser Nivellierung schon durchgewaermt wurde
variable_soaked: 0
gcode:
    RESPOND TYPE=echo MSG="Schrauben-Soak in dieser Nivellierung bereits gelaufen: {printer['gcode_macro _SCREWS_STATE'].soaked}"

[gcode_macro _SCREWS_HEAT_SOAK]
description: Vor dem Antasten der Eckpunkte durchwaermen (Unterroutine)
gcode:
    # Zum Nachpruefen ohne Warten:  _SCREWS_HEAT_SOAK DRYRUN=1
    # Zum Kuerzen von Hand:         _SCREWS_HEAT_SOAK MINUTES=1
    # ⚠️ NICHT nur heater_bed.target nehmen! Am 18.08. live beobachtet: die
    # Touchscreen-GUI setzt beim Start der Nivellierung das Bett-Ziel auf 0
    # (Log: "step=adjust_homing bett=65/0"). Das Bett ist dann zwar noch warm,
    # das Ziel aber 0 -> der Soak haette gar nicht ausgeloest. Massgeblich ist
    # deshalb der GROESSERE von Ist- und Zieltemperatur.
    {% set t = params.TARGET|default([printer.heater_bed.target, printer.heater_bed.temperature]|max)|float %}
    {% set minutes = params.MINUTES|default(10 if t >= 90 else (5 if t >= 55 else 0))|float %}

    {% if printer['gcode_macro _SCREWS_STATE'].soaked %}
        RESPOND TYPE=echo MSG="Schrauben-Soak: in dieser Nivellierung schon gelaufen - kein zweites Warten."
    {% elif minutes <= 0 %}
        RESPOND TYPE=echo MSG="Schrauben-Soak: Bett {t|round(0)|int} C - keine Wartezeit noetig."
    {% elif params.DRYRUN|default(0)|int %}
        RESPOND TYPE=echo MSG="Schrauben-Soak (Trockenlauf): Bett {t|round(0)|int} C wuerde {minutes} min warten."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_SCREWS_STATE VARIABLE=soaked VALUE=1
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout_on_pause|int}
        RESPOND TYPE=echo MSG="Schrauben-Soak: Bett {t|round(0)|int} C - {minutes} min durchwaermen, dann messen. Touchscreen reagiert solange NICHT."
        # In halbe Minuten zerlegt, damit auf dem Display ein Countdown
        # mitlaeuft. Ohne den sieht die Wartezeit wie ein Absturz aus -- genau
        # daran ist der erste Versuch gescheitert (s. Kommentar oben).
        {% for rest in range((minutes * 2)|round(0)|int, 0, -1) %}
            M117 Durchwaermen noch {(rest / 2.0)|round(1)} min
            G4 P30000
        {% endfor %}
        M117 Nivellierung
    {% endif %}

# --- Anknuepfung an die Original-GUI -----------------------------------------
# Nach dem Antasten der vier Referenzpunkte stehen alle Werte fest -> Report.

[gcode_macro AUTO_SCREWS_TILT_ADJUST_PROBE_REFERENCE_POINTS]
rename_existing: AUTO_SCREWS_TILT_ADJUST_PROBE_REFERENCE_POINTS_BASE
description: Durchwaermen, vier Eckpunkte antasten (Original), Werte im Klartext
gcode:
    _SCREWS_HEAT_SOAK
    AUTO_SCREWS_TILT_ADJUST_PROBE_REFERENCE_POINTS_BASE {rawparams}
    SCREWS_REPORT

# Waehrend des Drehens: nach jedem Nachmessen den Restfehler der aktuellen
# Schraube als Zahl ausgeben - das ist der Wert, den der Balken darstellt.

[gcode_macro AUTO_SCREWS_TILT_ADJUST_MANUAL_TUNING]
rename_existing: AUTO_SCREWS_TILT_ADJUST_MANUAL_TUNING_BASE
description: Schraube nachmessen (Original) und den Restfehler in um melden
gcode:
    AUTO_SCREWS_TILT_ADJUST_MANUAL_TUNING_BASE {rawparams}
    {% set s = printer['auto_screws_tilt_adjust'] %}
    {% if s.need_adjusted_z is not none %}
        RESPOND TYPE=echo MSG="Schraube {s.current_point}: noch {'%+.1f' % (s.need_adjusted_z * 1000)} um  (gruen ab {'%.0f' % (s.adjust_tolerance * 1000)} um)"
    {% endif %}

# Ende der Nivellierung: Merkzeichen loeschen, damit beim naechsten Mal wieder
# durchgewaermt wird. (Das Original raeumt hier ohnehin auf und setzt den
# idle_timeout zurueck.)

[gcode_macro AUTO_SCREWS_TILT_ADJUST_EXIT]
rename_existing: AUTO_SCREWS_TILT_ADJUST_EXIT_BASE
description: Nivellierung beenden (Original) und das Soak-Merkzeichen loeschen
gcode:
    SET_GCODE_VARIABLE MACRO=_SCREWS_STATE VARIABLE=soaked VALUE=0
    AUTO_SCREWS_TILT_ADJUST_EXIT_BASE {rawparams}
