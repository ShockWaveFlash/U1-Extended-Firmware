# 2026-08-25: Smooth-Shaper, nutzbar nach dem Patch in input_shaper.py und
# shaper_calibrate.py (Smoother lesen smoother_freq_*, nicht shaper_freq_*).
[resonance_tester]
fixed_shaper: smooth_mzv

# Extruder-PA-Synchronisation mit dem Input Shaping (Kalico Bleeding Edge).
# Kalicos Doku nennt ausdruecklich den Fall unterschiedlicher Resonanz-
# frequenzen auf X und Y - am U1 51,2 vs 46,0 Hz. smooth_mzv ist in
# extruder_smoother.EXTURDER_SMOOTHERS ausdruecklich hinterlegt.
[input_shaper]
enabled_extruders: extruder, extruder1, extruder2, extruder3
