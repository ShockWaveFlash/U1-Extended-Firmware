# Erzeugt von firmware-config (Kalico -> Rahmen-Pico entbehrlich).
# Nicht von Hand aendern.
#
# Klipper startet auch ohne den Pico und nimmt ihn wieder an, sobald
# er wieder da ist. Ohne diese Zeile ist ein fehlender Pico ein
# Startfehler: "mcu 'pico': Unable to open serial port".

[mcu pico]
is_non_critical: True
