# Uebertemperaturschutz fuer die Panda-Breath-Kammerheizung.
# Angelegt 2026-08-25 (Audit-Befund: Kammerheizung ohne Uebertemperaturschutz).
#
# WARUM DAS NOETIG IST -- am 2026-08-25 IM CODE NACHGESEHEN, nicht vermutet:
#  1) [heater_generic panda_breath] setzt min_temp 15 / max_temp 80, aber der
#     Panda-Sensor setzt sie NICHT durch. In panda_breath.py steht
#         def setup_minmax(self, min_temp, max_temp):
#             pass
#     (Zeile 1058) -- ein leerer Rumpf; _min_temp/_max_temp kommen im ganzen
#     Modul nirgends vor. Einen MCU-ADC-Bereichstest gibt es nicht, weil der
#     Messwert per HTTP vom Panda-Geraet kommt und nie einen Pin beruehrt.
#     max_temp wirkt deshalb NUR als Obergrenze fuer die ZIELVORGABE
#     (heaters.py:322, "Requested temperature out of range"), nicht als
#     Ueberhitzungsschutz fuer die Ist-Temperatur.
#  2) [verify_heater] schuetzt ausschliesslich gegen ZU KALT. Der Fehler wird
#     nur in dieser einen Richtung aufaddiert (verify_heater.py:67):
#         self.error += (target - self.hysteresis) - temp
#     Ueber dem Ziel wird nie ein Fehler gezaehlt, egal wie heiss es wird.
#  3) Der frueher in verify_heater_panda.cfg behauptete
#     "_panda_breath_cavity_guard mit limit_c: 70" existierte NIRGENDS im
#     System (grep ueber Config- und Codebaum am 2026-08-25: nur die
#     Kommentarzeile selbst). Diese Datei loest die Behauptung endlich ein.
#
# ZWEI STUFEN:
#   ab WARN_C  65 C : Kammerheizung wird abgeschaltet (M141 S0) und gemeldet.
#                     Der Druck laeuft weiter -- ein Kammerziel ist kein Grund,
#                     ein laufendes Teil wegzuwerfen.
#   ab ABORT_C 72 C : M112. Der Notaus fuer den Fall, dass das Abschalten nicht
#                     wirkt. panda_breath.py:714 _handle_shutdown() ruft dabei
#                     zusaetzlich _force_device_off("shutdown"), das Geraet geht
#                     also auch geraeteseitig aus.
#   ⚠ Stufe 2 nur bei PLAUSIBLEM Messwert (<= 150 C). Ein Ausreisser aus dem
#     HTTP-Sensor soll keinen Notaus mitten im Druck ausloesen.
#
# Warum 65/72 C (2026-08-25 von 70/78 gesenkt, Audit-Befund heizung-sicherheit-09):
# BIGTREETECH gibt fuer den Panda Breath ausdruecklich "Maximum Chamber Temperature:
# 60 C" an (global.bttwiki.com/Panda_Breath.html). Die alten Schwellen lagen 10 bzw.
# 18 C ueber dem Geraetemaximum - der Guard haette also erst eingegriffen, wenn das
# Geraet laengst ausserhalb seiner Spezifikation gelaufen waere.
# Nach unten ist reichlich Luft: real erreicht die Kammer rund 46 C bei Ziel 60
# (gemessen 2026-08-22). 65 C wird im Normalbetrieb also nicht erreicht, stoert
# nicht im Alltag und greift trotzdem frueh. Der Druckerraum hat kein Fenster;
# deshalb ueberhaupt zwei Stufen statt nur einer Warnung.
# ⚠ Zusaetzlich sperrt panda_breath_maxtemp.cfg das Ziel bei 60 C ab - der Guard
#   ist die zweite Verteidigungslinie, nicht die einzige.
#
# Taktung 10 s: der Panda meldet in 1-C-Schritten und traege; haeufiger zu
# pruefen bringt nichts und belastet nur die Gcode-Queue.
#
#
# ZWEI QUELLEN, DER HOEHERE WERT ZAEHLT (2026-08-25 ergaenzt): Der U1 hat einen
# eigenen NTC-Kammersensor -- [temperature_sensor cavity], sensor_pin PC0,
# printer.cfg:241. Er ist von der Panda voellig unabhaengig. Am 2026-08-25
# meldeten beide 27 bzw. 26 C. Der Waechter nimmt das Maximum aus beiden, damit
# ein haengender oder eingefrorener Messwert einer Quelle ihn nicht blind macht.
# ⚠ Auch dieser Sensor faengt nichts von allein ab: er steht auf max_temp 999.
#
# Rueckbau: diese Datei loeschen + FIRMWARE_RESTART.

[delayed_gcode _panda_breath_cavity_guard]
initial_duration: 30
gcode:
    {% set warn_c  = 65.0 %}
    {% set abort_c = 72.0 %}
    {% set quellen = [] %}
    {% if printer["heater_generic panda_breath"] is defined %}
        {% set quellen = quellen + [printer["heater_generic panda_breath"].temperature|float(0)] %}
    {% endif %}
    {% if printer["temperature_sensor cavity"] is defined %}
        {% set quellen = quellen + [printer["temperature_sensor cavity"].temperature|float(0)] %}
    {% endif %}
    {% if quellen %}
        {% set t = quellen|max %}
        {% if t >= abort_c and t <= 150.0 %}
            { action_respond_info("PANDA CAVITY GUARD: " ~ t|round(1) ~ " C -- NOTAUS (Grenze " ~ abort_c ~ " C, Quellen " ~ quellen ~ ")") }
            M141 S0
            M112
        {% elif t >= warn_c %}
            { action_respond_info("PANDA CAVITY GUARD: " ~ t|round(1) ~ " C ueber Grenze " ~ warn_c ~ " C -- Kammerheizung wird abgeschaltet (Quellen " ~ quellen ~ ")") }
            M141 S0
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_panda_breath_cavity_guard DURATION=10
