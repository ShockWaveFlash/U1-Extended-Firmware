# Angelegt 2026-08-22, am 2026-08-25 scharf gestellt und richtiggestellt.
# Zweck: verhindert den Klipper-Shutdown, wenn die Panda Breath ein Kammerziel
# nicht erreicht ("Heater panda_breath not heating at expected rate").
# Ausloeser war Ziel 60 C bei real erreichbaren ~46 C -> Shutdown nach 12 s.
#
# ⚠⚠ 2026-08-25 RICHTIGGESTELLT: Hier stand frueher, der Ueberhitzungsschutz
#    bleibe "unabhaengig davon aktiv -- _panda_breath_cavity_guard mit
#    limit_c: 70 in panda_breath.cfg". DAS WAR FALSCH. Ein solcher Guard
#    existierte nirgends im System (grep ueber Config- UND Codebaum). Der Schutz
#    ist am 2026-08-25 nachgebaut worden und steht jetzt wirklich da:
#    -> extended/klipper/panda_breath_cavity_guard.cfg
#    Dort auch die Belege, warum weder max_temp noch verify_heater als
#    Ueberhitzungsschutz taugen (setup_minmax ist beim Panda-Sensor ein leeres
#    pass; verify_heater addiert Fehler ausschliesslich nach UNTEN).
#
# ⚠ max_error war bis 2026-08-25 auf 999999 -- damit war auch die
#   Zu-kalt-Erkennung praktisch abgeschaltet. Ein ausgefallener oder
#   abgezogener Panda waere mitten in einem ABS-Druck unbemerkt geblieben.
#
# DIE WERTE, DURCHGERECHNET (check_event laeuft im 1-Sekunden-Takt,
# verify_heater.py: "return eventtime + 1.0"; der Fehler waechst je Sekunde um
# (target - hysteresis) - temp):
#   hysteresis 25 : Als "nah am Ziel" gilt alles ab target-25. Bei Ziel 60 also
#                   ab 35 C -- die real erreichbaren ~46 C liegen sicher darin,
#                   ebenso noch bei Ziel 70. Ein Ziel ueber 71 C wuerde
#                   Fehlalarme geben, ist mit dieser Kammer aber ohnehin sinnlos.
#   max_error 3600: Faellt die Kammer bei Ziel 60 auf Raumtemperatur (~25 C, also
#                   Panda tot oder abgezogen), waechst der Fehler um 10/s ->
#                   Fault nach 6 Minuten. Ein kurzer Einbruch, etwa durch eine
#                   offene Tuer, laeuft dagegen nicht ins Messer.
#   heating_gain / check_gain_time: 0,5 C Anstieg in 15 min genuegen als
#                   Fortschritt beim Aufheizen.
#
# Rueckbau: diese Datei loeschen + FIRMWARE_RESTART (dann gelten wieder die
# Werte aus panda_breath_heater_auto.cfg: hysteresis 5, max_error 600).

# ⚠⚠ ES GIBT EINE ZWEITE, KONKURRIERENDE SEKTION (2026-08-25 belegt, Audit-Befund
#    heizung-sicherheit-08). Sie steht in der firmware-verwalteten Datei
#      /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg
#    und wird per [include] aus extended/klipper/panda_breath.cfg geladen, mit:
#      max_error: 600   check_gain_time: 360   hysteresis: 5   heating_gain: 1
#    Diese Datei hier gewinnt AUSSCHLIESSLICH deshalb, weil "verify_heater_panda.cfg"
#    alphabetisch nach "panda_breath.cfg" einsortiert wird ([include extended/klipper/*.cfg],
#    printer.cfg:1348). Es gibt keinen anderen Mechanismus, der das entscheidet.
#    ⚠ Diese Datei also NICHT in einen Namen umbenennen, der vor "panda_breath.cfg"
#      einsortiert wird - dann gaelten schlagartig wieder die Werksschwellen, ohne
#      jede Fehlermeldung. Grundregel: Memory u1-mod-overlays-uebersicht.
#    ⚠ Die Originaldatei liegt unter /usr/local/share, also im Wegwerf-Overlay des
#      Root-Dateisystems - sie dort zu aendern haelt keinen Boot durch.
#    Pruefen, was tatsaechlich gilt:
#      curl -s "http://192.168.178.136:7125/printer/objects/query?configfile" \
#        | jq '.result.status.configfile.settings["verify_heater panda_breath"]'

[verify_heater panda_breath]
hysteresis: 25
max_error: 3600
heating_gain: 0.5
check_gain_time: 900
