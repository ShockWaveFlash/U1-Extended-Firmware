# Erzeugt von firmware-config (Kalico -> Homing-Strom X/Y).
# Nicht von Hand aendern - der naechste Schalterdruck ueberschreibt die Datei.
#
# Strom waehrend des Referenzierens. Zu hoch = StallGuard erkennt den Anschlag
# nicht ("No trigger on x/y after full movement"), zu niedrig = der Kopf bleibt
# schon unterwegs stehen und meldet einen Anschlag, der keiner ist.

[tmc2240 stepper_x]
home_current: 0.650
current_change_dwell_time: 0.5

[tmc2240 stepper_y]
home_current: 0.650
current_change_dwell_time: 0.5
