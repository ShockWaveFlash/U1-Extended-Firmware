# Z-Limits nach dem Schuetteln wiederherstellen.
# Angelegt 2026-08-25 (Audit-Befund klipper-config-04, mittel — in der Gegenpruefung bestaetigt).
#
# DAS PROBLEM (am Geraet belegt):
# [bed_mesh] ruft vor jedem Mess-/Mesh-Lauf einmal SHAKE_Z auf (printer.cfg:303,
# "first_raise_tool_gcode"; probe_inductance_coil.py:1155 "if not probe_num").
# Das Werksmakro schuettelt mit erhoehten Grenzen und endet auf
#     SET_MAX_Z_ACCEL A=500  /  SET_MAX_Z_VELOCITY V=30      (printer.cfg:501-502)
# also auf den WERKSWERTEN - nicht auf den eingestellten. Kalico schreibt die Werte
# direkt in die Kinematik (toolhead.py:1088-1098 "self.kin.max_z_accel = accel") und
# hat dafuer keinen Rueckweg: sie gelten bis zum naechsten Klipper-Neustart.
# Folge: Ab dem ersten Mesh einer Sitzung lief die Z-Achse auf 500/30 statt auf den
# 20/300 aus z_motion.cfg - und zwar genau die Werte, deren hoerbares Anschlagen beim
# Z-Hop am 06.08. der Anlass fuer z_motion.cfg war.
# Nachgezaehlt ueber alle klippylogs: 13 SHAKE_Z-Laeufe zwischen dem 18. und 23.08.,
# jeder mit 780/50 gefolgt von 500/30 - und KEIN einziger Eintrag mit 300 oder 20.
# Da der U1 bei JEDEM Druck ein frisches Mesh faehrt, galt das bei jedem Druck.
#
# DIE LOESUNG - bewusst NICHT das Makro ueberschreiben:
# Der naheliegende Weg waere ein eigenes [gcode_macro SHAKE_Z] mit kopiertem Rumpf.
# Dagegen sprechen zwei Dinge:
#   1. Gleichnamige Makros in zwei Dateien verschmelzen in Klipper, eines stirbt STILL -
#      genau die Falle, die am 18.08. BED_MESH_CALIBRATE wirkungslos gemacht hat
#      (Memory u1-druckstart-mesh-und-wrapper-konflikt).
#   2. Der Rumpf ist rund 118 Zeilen. Eine Kopie friert Snapmakers Fassung ein; aendert
#      eine kuenftige Firmware das Schuetteln, bekaeme der Drucker das nie zu sehen.
# Stattdessen bleibt SHAKE_Z voellig unangetastet und nur der AUFRUF wird umgebogen:
# der Wrapper hier ruft es auf und stellt danach die konfigurierten Werte wieder her.
# Waehrend des Schuettelns gelten weiterhin die hohen Grenzen - das ist gewollt.
#
# ⚠ Die Werte werden NICHT hart hingeschrieben, sondern aus der geladenen Konfiguration
#   gelesen (printer.configfile.settings.printer.*). Damit folgt der Wrapper automatisch,
#   wenn z_motion.cfg jemals geaendert wird - und kann nie mit ihr auseinanderlaufen.
# ⚠ NICHT "RESET_VELOCITY_LIMIT" nehmen, obwohl Kalico es kennt (toolhead.py:1042): das
#   setzt auch max_velocity und max_accel zurueck und wuerde damit ein M204 aus dem
#   Druck-G-Code ueberschreiben. Hier wird ausschliesslich Z angefasst.
#
# Gegenprobe nach einem Mesh - beide Werte muessen wieder 20/300 melden:
#   curl -s "http://192.168.178.136:7125/printer/objects/query?toolhead" \
#     | jq '.result.status.toolhead | {max_z_velocity, max_z_accel}'

[bed_mesh]
first_raise_tool_gcode: _SHAKE_Z_MIT_ZLIMITS

[gcode_macro _SHAKE_Z_MIT_ZLIMITS]
description: SHAKE_Z, danach die konfigurierten Z-Grenzen wiederherstellen
gcode:
    SHAKE_Z
    SET_MAX_Z_ACCEL A={printer.configfile.settings.printer.max_z_accel}
    SET_MAX_Z_VELOCITY V={printer.configfile.settings.printer.max_z_velocity}
