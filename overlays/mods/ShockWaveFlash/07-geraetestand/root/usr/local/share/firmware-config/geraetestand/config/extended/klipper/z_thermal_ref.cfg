# Automatische Referenztemperatur fuer [z_thermal_adjust] — 2026-08-21
#
# Warum: Klippers eingebauter Hook haengt am Event "homing:home_rails_end".
# Der U1 homet Z NICHT ueber Klippers home_rails -> der Hook feuert nie, die
# Referenz bleibt auf 0.0 stehen und ergibt ~0,2 mm Z-Versatz (Anschlag von
# max_z_adjustment). Deshalb hier ein eigener Flankenwaechter.
#
# ⚠️ Fix 2026-08-23: Der Merker zhomed wurde frueher IMMER auf den Homing-Zustand
# gesetzt - auch wenn _Z_THERMAL_REF_SET die Temperatur als unplausibel (<=10 C)
# verworfen hatte. Damit gab es keinen zweiten Versuch: der Waechter hielt sich fuer
# fertig, die Referenz blieb auf 0.0 und der ganze Druck lief am 0,2-mm-Anschlag von
# max_z_adjustment. Jetzt setzt NUR der Erfolgszweig den Merker; der Waechter setzt
# ihn allein zurueck, wenn Z das Homing verliert. Bei unplausibler Temperatur wird
# alle 10 s erneut versucht.

# ⚠️ Fix 2 vom 2026-08-23: Der Waechter setzte die Referenz erst NACH dem Homing.
# Bis dahin stand ref auf 0.0 und die Kompensation rechnete mit der VOLLEN
# Rahmentemperatur als Differenz - am Geraet gemessen -0,338 mm bei 25,4 C.
# ★ Wichtig zur Einordnung: [z_thermal_adjust] haengt per gcode_move.set_move_transform
# an gcode_move (Zeile 69 in z_thermal_adjust.py), NICHT am toolhead. Das HOMING
# selbst laeuft ueber homing.py am toolhead vorbei und ist deshalb NICHT betroffen.
# Betroffen ist die erste G-CODE-BEWEGUNG nach dem Homing, solange die Referenz noch
# auf 0.0 steht - beim Druckstart also die Anfahrt zur ersten Schicht oder der erste
# Mesh-Messpunkt. max_z_adjustment begrenzte nur, wie gross dieser Fehler werden kann.
# Jetzt wird die Referenz mitgezogen, SOLANGE Z ungehomt ist (dann ist current_z_adjust
# ~0), und erst mit der steigenden Flanke eingefroren. Ab da kompensiert sie die echte
# thermische Drift. Gemessen nach dem Fix: adj direkt nach G28 = -0,0021 statt -0,3380.
# ★ Damit stimmt auch die 0,5-um-Rechnung unten wieder: sie gilt fuer die
# Temperaturaenderung im verbleibenden 10-s-Fenster, nicht fuer die Absoluttemperatur.

# Bewusst KEIN [gcode_macro G28]-Wrapper: der Waechter erkennt das Homing
# ohnehin, nur bis zu 10 s spaeter. Bei 0,0037 K/s Rampe sind das 0,5 um —
# das rechtfertigt keinen Eingriff in G28.

[gcode_macro _Z_THERMAL_REF_SET]
description: Setzt die Referenztemperatur von z_thermal_adjust auf den Istwert
gcode:
    {% set t = printer.z_thermal_adjust.temperature %}
    {% if t > 5 %}
        SET_Z_THERMAL_ADJUST REF_TEMP={t}
        # 2026-08-25: zieht zusaetzlich den ANZEIGEWERT current_z_adjust auf 0.
        # cmd_SET_Z_THERMAL_ADJUST (z_thermal_adjust.py:174) setzt nur ref_temperature,
        # NICHT z_adjust_mm - anders als handle_homing_move_end (Z. 101-106), das genau
        # das tut, am U1 aber nie feuert. Der alte Wert steht danach also noch in der
        # Anzeige, obwohl die Referenz schon neu ist.
        # Der ENABLE-Wechsel raeumt ihn ohne jede Bewegung ab: er ruft
        # gcode_move.reset_last_position() (Z. 185-187), das ueber die Transform-Kette
        # get_position() -> calc_adjust() geht (Z. 133-136). Da die Referenz gerade auf den
        # Istwert gesetzt wurde, ist delta_t = 0 -> z_adjust_mm wird auf 0 gezogen.
        # Beide Zeilen sind noetig: reset_last_position laeuft nur bei einem ECHTEN
        # Zustandswechsel ("if enable != self.adjust_enable").
        #
        # ⚠⚠ WAS DAS *NICHT* IST: kein Sicherheitsfix. Der Audit-Befund z-thermal-pico-06
        # behauptet, ein stehengebliebener Offset wuerde in einen reinen Z-Move
        # durchschlagen (Z-Hop, erste Schichthoehe, Duesenreinigung), und zitiert dafuer
        # "newpos[0:2] == last_position[0:2]". Im Code steht aber [0:3] (Zeile 141), und
        # der Kommentar darueber sagt ausdruecklich "don't apply to extrude only moves":
        # der eingefrorene Wert wird AUSSCHLIESSLICH bei reinen Extrusionsmoves benutzt,
        # und die bewegen Z nicht. Jeder echte Z-Move rechnet neu, BEVOR er wirkt.
        # Der Nutzen hier ist also allein Ehrlichkeit der Anzeige - und die ist ihr Geld
        # wert, weil man aus current_z_adjust im Stillstand sonst falsche Schluesse zieht
        # (s. Memory u1-zdrift-gegenmassnahmen, Abschnitt vom 2026-08-25).
        SET_Z_THERMAL_ADJUST ENABLE=0
        SET_Z_THERMAL_ADJUST ENABLE=1
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE=1
        RESPOND MSG="Z-Thermal-Referenz: {t|round(2)} C (Offset auf 0 gezogen)"
    {% else %}
        # ⚠ Schwelle am 2026-08-25 von 10 auf 5 C gesenkt (Audit-Befund z-thermal-pico-07):
        # 10 C schloss einen legitimen Betriebszustand aus - die niedrigste je geloggte
        # Rahmentemperatur war 7,9 C (fensterloser Raum, Winter, Drucker lange stromlos).
        # 5 C faengt weiterhin den echten Sensordefekt ab (offener Thermistor liest min_temp = 0).
        # Der Merker zhomed bleibt hier bewusst UNGESETZT, damit es der Waechter in 10 s
        # erneut versucht, statt in einer Sackgasse zu enden.
        RESPOND MSG="Z-Thermal-Referenz NICHT gesetzt: {t|round(2)} C unplausibel - neuer Versuch in 10 s"
    {% endif %}

[gcode_macro _Z_THERMAL_REF_STATE]
description: Merker fuer den Flankenwaechter
variable_zhomed: 0
variable_deckel: 0
variable_letzte_t: 0
variable_letzte_probe: 0
gcode:

[delayed_gcode _Z_THERMAL_REF_WATCH]
initial_duration: 10
gcode:
    {% set z_now = 1 if 'z' in printer.toolhead.homed_axes else 0 %}
    {% set st = printer['gcode_macro _Z_THERMAL_REF_STATE'] %}
    {% set t = printer.z_thermal_adjust.temperature %}
    {% set druckt = 1 if printer.print_stats.state in ['printing', 'paused'] else 0 %}
    {% if not z_now %}
        # Z ist NICHT gehomt: Merker zuruecksetzen, und ausserhalb eines Drucks die
        # Referenz mitziehen, damit current_z_adjust ~0 bleibt und die erste Bewegung
        # nach dem Homing sauber ist.
        # ⚠ Der Merker faellt IMMER zurueck, wenn Z ungehomt ist - nur das NACHFUEHREN
        # ist druckgeschuetzt. Grund: Snapmakers [gcode_macro PRINT_START] fuehrt selbst
        # ein M84 aus, bei JEDEM Druckstart geht das Homing also verloren.
        # ★ 2026-08-25 nachgeprueft und belegt: das Makro steht in fluidd.cfg (NICHT in
        # printer.cfg - dort sucht man vergeblich), und das M84 steht dort direkt vor
        # "G92 E0 / M220 S100". Der Slicer ruft PRINT_START in Zeile ~110 der .gcode-Datei.
        # Deshalb ist auch keine zusaetzliche Flanke auf den Druckstart noetig: der
        # Audit-Befund z-thermal-pico-05 ("zweiter Druck derselben Sitzung bekommt keine
        # neue Referenz") geht davon aus, dass homed_axes nur ueber [idle_timeout] faellt.
        # Das M84 in PRINT_START macht die Flanke bei JEDEM Druck.
        # ★ Empirisch bestaetigt ist das laengst: die Messreihe vom 22.08. ueber vier
        # Drucklaeufe zeigt vier verschiedene Referenzen (27,11 / 32,35 / 29,95 / 32,69 C)
        # - s. Memory u1-zdrift-gegenmassnahmen. Der Befund ist damit erledigt. Faellt der
        # Merker dann nicht zurueck, wird die Referenz nach dem folgenden G28 nie neu
        # gesetzt. Umgekehrt darf bei einem laufenden Druck nicht nachgezogen werden:
        # sonst landete die Referenz auf der dann heissen Rahmentemperatur und die
        # aufgelaufene Kompensation waere weg.
        {% if not druckt and t > 5 %}
            SET_Z_THERMAL_ADJUST REF_TEMP={t}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=zhomed VALUE=0
    {% elif not st.zhomed %}
        # Steigende Flanke: Referenz einmal endgueltig setzen und einfrieren.
        # 2026-08-25: ruft jetzt _Z_THERMAL_REF_SET, statt dessen Inhalt ein zweites Mal
        # auszuschreiben - die beiden Fassungen waren sonst schon auseinandergelaufen
        # (die Offset-Nullung haette hier gefehlt).
        #
        # ★★ EINSCHWINGSPERRE (2026-08-25, Audit-Befund klipper-config-03).
        # z_thermal_adjust.py glaettet mit smooth_time: 30 und startet nach jedem
        # FIRMWARE_RESTART bei 0 - der gemeldete Wert ist also erst nach rund zwei
        # Minuten der echte. Am 2026-08-25 nachgemessen, 10-s-Schritte nach einem
        # Neustart bei ~25,3 C Rahmen:
        #     21,75 -> 22,96 -> 23,83 -> 24,44 -> 24,87 -> 25,16
        #     Aenderung je Schritt: 1,21 / 0,87 / 0,61 / 0,43 / 0,29 K
        # Wird in dieser Phase gehomt, friert eine um mehrere Kelvin zu niedrige
        # Referenz ein - bei temp_coeff 0,0133 sind 3,5 K bereits 0,047 mm, und der
        # Fehler bleibt die ganze Sitzung stehen. Die alte 10-C-Schwelle hat das nur
        # zufaellig abgefangen; seit die Schwelle bei 5 C liegt (fuer kalte Raeume,
        # s. u.), faengt sie es gar nicht mehr ab.
        # Deshalb: erst setzen, wenn sich der Wert zwischen zwei Waechterlaeufen um
        # weniger als 0,3 K bewegt. Die echte Rahmenerwaermung im Druck liegt bei rund
        # 0,04 K je 10 s (15 K ueber eine Stunde) und wird davon nicht behindert.
        # ⚠ Schlaegt die Pruefung an, bleibt zhomed auf 0 - der Waechter versucht es in
        #   10 s erneut. Keine Sackgasse.
        {% set dt = (t - st.letzte_t)|abs %}
        {% if dt < 0.3 %}
            _Z_THERMAL_REF_SET
        {% else %}
            RESPOND MSG="Z-Thermal-Referenz noch nicht gesetzt: Sensor schwingt ein ({t|round(2)} C, {dt|round(2)} K seit dem letzten Lauf) - neuer Versuch in 10 s"
        {% endif %}
    {% endif %}
    # ★★ NEU 2026-09-05: Referenz nach einer NEUEN NIVELLIERUNG nachziehen.
    # Grund (am 2026-09-05 im Quellcode belegt): bed_mesh und z_thermal_adjust sind
    # zwei unabhaengige, ADDITIVE Transform-Layer. Kette:
    #     gcode_move -> z_thermal_adjust.move() -> bed_mesh.move() -> toolhead.move()
    # (z_thermal_adjust.py:69 registriert sich in handle_connect, bed_mesh.py:145 schon
    # in __init__ - deshalb faengt z_thermal_adjust immer bed_mesh als next_transform ab.)
    # Das ANTASTEN laeuft ueber homing.py direkt am toolhead, also am gcode_move-Stack
    # VORBEI (probe.py:117/137/315 -> HomingMove; kein einziger gcode_move-Aufruf).
    # Ein Mesh misst damit die reale Bettlage zum Messzeitpunkt, und da
    # zero_reference_position NICHT gesetzt ist, traegt es die absolute Hoehe
    # (probed_matrix lag am 05.09. im Mittel bei +0,48 mm).
    # ⇒ Die bis zur Nivellierung aufgelaufene thermische Drift steckt BEREITS im Mesh.
    #   Eine Referenz, die aelter ist als das Mesh, laesst z_thermal_adjust dieselbe
    #   Drift ein ZWEITES Mal abziehen - die Duese faehrt zu tief.
    # Gemessen am 2026-09-05: Referenz 15:04:55 bei 36,42 C eingefroren, finale
    # Nivellierung erst 15:29:33 bei ~39,6 C -> 3,2 K -> -0,043 mm Doppelkorrektur.
    # Ausgeloest wird das vom Mesh-Soak, der bewusst ERST NACH dem Durchwaermen
    # nivelliert - also bei JEDEM Druck mit Soak.
    # BED_MESH_CALIBRATE zieht die Referenz von sich aus nicht nach: z_thermal_adjust.py
    # setzt sie nur in handle_homing_move_end (Z. 87-91), und der Hook feuert am U1 nie.
    #
    # Erkennung ueber probed_matrix[0][0] - der Wert aendert sich mit jeder neuen
    # Messung. ⚠ Angenommen wird dabei, dass dieser Messpunkt nie exakt 0.0 ist
    # (reale Werte am 05.09.: 0,4283..0,5537); 0.0 gilt hier als "noch nichts gemerkt".
    # ⚠ Bewusst OHNE Druckschutz: die entscheidende Nivellierung passiert MITTEN im
    # Druck, genau dort muss nachgezogen werden. Das laufende Nachfuehren im Leerlauf
    # (weiter oben) bleibt dagegen druckgeschuetzt - dort wuerde ein Nachziehen die
    # aufgelaufene Kompensation loeschen.
    # ⚠ Verzoegerung bis zu 10 s (Waechtertakt). Bei 0,0037 K/s sind das 0,5 um.
    {% set pm = printer.bed_mesh.probed_matrix %}
    {% if pm and pm|length > 0 and pm[0]|length > 0 %}
        {% set probe0 = pm[0][0] %}
        {% if st.letzte_probe != 0 and (probe0 - st.letzte_probe)|abs > 0.0001 and t > 5 %}
            RESPOND MSG="Z-Thermal: neue Nivellierung erkannt - Referenz wird nachgezogen"
            _Z_THERMAL_REF_SET
        {% endif %}
        {% if t > 5 or st.letzte_probe == 0 %}
            SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=letzte_probe VALUE={probe0}
        {% endif %}
    {% endif %}

    # 2026-08-25 (Audit-Befund, hoch): Der Anschlag an max_z_adjustment ist im
    # Klipper-Code voellig still - z_thermal_adjust.py, calc_adjust() begrenzt mit
    # min([max_z_adjust_mm*sign, adjust], key=abs), ohne Logeintrag, ohne Statusflag.
    # Ab da friert die Kompensation ein und der Rest der Drift laeuft ungefangen in
    # die erste Schicht. Bei max_z_adjustment 0,4 und temp_coeff 0,0133 ist der Deckel
    # 30 K ueber der Referenz erreicht; gemessene Rahmentemperaturen gehen bis 43,5 C.
    # Gemeldet wird nur die FLANKE, sonst kaeme die Meldung alle 10 s.
    {% set adj = printer.z_thermal_adjust.current_z_adjust|abs %}
    {% set deckel = printer.configfile.settings.z_thermal_adjust.max_z_adjustment %}
    {% if adj >= deckel * 0.95 and not st.deckel %}
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=deckel VALUE=1
        RESPOND TYPE=error MSG="Z-Thermal: Anschlag erreicht ({adj|round(3)} von {deckel} mm) - ab hier wird die Drift NICHT mehr ausgeglichen"
    {% elif adj < deckel * 0.8 and st.deckel %}
        SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=deckel VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_Z_THERMAL_REF_STATE VARIABLE=letzte_t VALUE={t}
    UPDATE_DELAYED_GCODE ID=_Z_THERMAL_REF_WATCH DURATION=10
