# Haltestrom XY reduzieren.
# Angelegt 2026-08-05 nach dem Umbau auf LDO-2504, neu gesetzt 2026-08-06.
#
# Warum: Klipper setzt hold_current = run_current, wenn nichts angegeben ist.
# Mit run_current 1.4A standen die TMC2240 im STILLSTAND bei 89 bzw. 84 Grad
# und die Motoren summten hoerbar (ihold=31 = voller Strom, stst=1).
# Zum Halten reicht die Haelfte; das Fahr-Drehmoment bleibt unveraendert,
# die Homing-Zuverlaessigkeit also auch.
#
# last-wins Overlay -- ueberlebt Firmware-Updates.

[tmc2240 stepper_x]
hold_current: 0.7

[tmc2240 stepper_y]
hold_current: 0.7

# --- Z nachgezogen 2026-08-18 -------------------------------------------------
# Christopher hoerte den Drucker im Stand summen. Nachgesehen statt geraten:
# DUMP_TMC stepper_z meldete IHOLD_IRUN ihold=27 irun=27, also HALTESTROM =
# FAHRSTROM. Ursache ist derselbe Klipper-Vorgabewert wie oben bei XY: ohne
# Angabe wird hold_current = run_current gesetzt (printer.cfg gibt fuer
# stepper_z nur run_current: 0.85 an, keinen Haltestrom).
# Gegenprobe: nach M84 war das Summen sofort weg -> es war der Haltestrom.
#
# 0.6 A = 70 % statt 50 % wie bei XY: die Z-Achse haelt gegen die Schwerkraft,
# deshalb hier bewusst mehr Reserve. Verlustwaerme geht trotzdem auf die
# Haelfte zurueck (steigt im Quadrat zum Strom: 0.6^2/0.85^2 = 0.50).
# Das Fahr-Drehmoment bleibt unveraendert -- run_current wird nicht angefasst.
# ⚠️ Der TMC2209 hat KEINEN Temperatursensor (nur die 2240 an X/Y), die
# Z-Treibertemperatur laesst sich also nicht nachmessen.

[tmc2209 stepper_z]
hold_current: 0.6
