# Netzteilluefter dauerhaft auf 100 %.
# Angelegt 2026-09-09, zweiter Anlauf.
#
# WARUM HIER UND NICHT IN printer.cfg:
# Am 04.09. stand dieselbe Aenderung direkt im Block [heater_fan power_fan]
# (printer.cfg:318). Sie war wirksam, war aber am 06.09. wieder verschwunden -
# an dem Tag wurde die printer.cfg umgebaut (dabei wurde auch [purifier] in
# eigene [fan_generic]-Bloecke aufgeteilt). Keine einzige Sicherung ab dem
# 06.09. enthaelt die Fassung noch. Aenderungen an printer.cfg halten also nicht.
# Diese Datei wird ueber [include extended/klipper/*.cfg] (printer.cfg:1372)
# NACH printer.cfg geladen; Kalico liest mit strict=False (configfile.py:537),
# gleichnamige Sektionen verschmelzen, der spaetere Wert gewinnt.
#
# WERKSFASSUNG (printer.cfg:322-324):
#   temp_speed_table:
#     9999, 260, 1, 3, 1
#     9999, 45, 1, 1, 0.6
# Spalten laut heater_fan.py:131 -
#   temp_threshold, target_temp_threshold, satisfied_heater_threshold,
#   heater_count_threshold, rule_speed
# Ausgewertet wird 'current_temp > temp_threshold ODER target_temp >
# target_temp_threshold' (Zeile 138); die erste zutreffende Regel gewinnt (break).
# Werk hiess also: ab Soll 45 C nur 60 %, volle Drehzahl erst ab Soll 260 C UND
# drei gleichzeitig aktiven Heizern - bei PETG mit 255 C nie erreicht.
#
# JETZT: zweite Regel greift ab jedem Heizer-Sollwert ueber 0 C und gibt 100 %.
# Die erste Regel bleibt unveraendert stehen, sie ist damit nur noch Formsache.
#
# heater_temp wird bewusst NICHT gesetzt: sobald eine temp_speed_table da ist,
# wertet heater_fan.py:129 ausschliesslich die Tabelle aus.
#
# Gegenprobe (Soll muss 1.0 sein, sobald ein Extruder heizt):
#   curl -s 'http://192.168.178.136:7125/printer/objects/query?heater_fan%20power_fan'
#
# RUECKBAU: diese Datei loeschen, dann FIRMWARE_RESTART.

[heater_fan power_fan]
temp_speed_table:
  9999, 260, 1, 3, 1
  9999, 0, 1, 1, 1
