# Erstschicht-Testmuster -- Gegenprobe nach Eingriffen an Z-Offset, Mesh oder
# Bettschrauben, ohne ein echtes Teil zu opfern.
#
#   FIRST_LAYER_TEST                     -> 60 mm Quadrat, Duese 0, PLA-Temperaturen
#   FIRST_LAYER_TEST TEMP=240 BED=80     -> PETG
#   FIRST_LAYER_TEST SIZE=40 EXTRUDER=2  -> kleiner, mit Werkzeug 2
#
# WARUM UEBERHAUPT (09.09.2026):
# Nach jeder Aenderung an Z-Offset, Mesh oder den Schrauben liess sich bisher nur
# ein echter Druck als Gegenprobe fahren. Ein festes Muster macht Vorher/Nachher
# vergleichbar: gleiche Bahnen, gleiche Reihenfolge, gleiche Menge.
# Vorbild ist Prusas G26 ("Mesh Validation Pattern", G26.cpp:379-383); die
# Maschinenwerte stammen aber NICHT von Prusa, sondern aus Snapmakers eigener
# Purge-Linie SM_PRINT_START_LINE_EXTRUDER_0 (fluidd.cfg:946): Erstschicht 0.2,
# Anfahrt X10 Y3 Z2, Purge G1 X40 E15 F360, danach G0 E-0.5.
#
# WAS MAN AM ERGEBNIS SIEHT
#   Bahnen liegen als getrennte Wuerste nebeneinander -> Duese zu hoch
#   Muster glaenzt, Bahnen verschmiert, Grate an den Raendern -> Duese zu tief
#   Eine Ecke anders als die drei uebrigen -> Schraube dort nachstellen
#     (Zahlen dazu: SCREWS_REPORT, s. screws_report.cfg)
#   Streifenmuster quer ueber die Flaeche -> Mesh nicht geladen oder veraltet
#
# EXTRUSION wird gerechnet, nicht geraten:
#   E je mm Weg = (Linienbreite * Schichthoehe) / Filamentquerschnitt
#   Querschnitt 1.75 mm Filament = pi * (1.75/2)^2 = 2.4053 mm^2
#   Standardfall 0.42 * 0.2 / 2.4053 = 0.0349 mm/mm
#
# ⚠️ Es ist ein ECHTER Druck auf Erstschichthoehe. Bei falschem Z-Offset kratzt
#    die Duese ins PEI -- deshalb bricht das Makro ohne vorheriges Homing ab.
# ⚠️ Am Ende werden Duese und Bett ABGESCHALTET. Fuer einen zweiten Lauf also
#    neu aufheizen lassen (dauert bei 60 Grad Bett wenige Minuten).
#
# last-wins Overlay -- ueberlebt Firmware-Updates.

[gcode_macro FIRST_LAYER_TEST]
description: Erstschicht-Testmuster als Gegenprobe fuer Z-Offset, Mesh und Schrauben
gcode:
    {% set temp   = params.TEMP        | default(215) | float %}
    {% set bed    = params.BED         | default(60)  | float %}
    {% set size   = params.SIZE        | default(60)  | float %}
    {% set lh     = params.LAYER_HEIGHT| default(0.2) | float %}
    {% set lw     = params.LINE_WIDTH  | default(0.42)| float %}
    {% set speed  = params.SPEED       | default(40)  | float * 60 %}
    {% set tool   = params.EXTRUDER    | default(0)   | int %}

    # --- Sicherheitspruefungen, bevor irgendetwas heizt oder faehrt ---
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("FIRST_LAYER_TEST: Achsen sind nicht gehomt. Erst G28 fahren -- "
                             "ohne Referenz waere die Duesenhoehe geraten.") }
    {% endif %}
    {% if printer.print_stats.state in ('printing','paused') %}
        { action_raise_error("FIRST_LAYER_TEST: es laeuft gerade ein Druck.") }
    {% endif %}
    {% if size < 20 or size > 200 %}
        { action_raise_error("FIRST_LAYER_TEST: SIZE muss zwischen 20 und 200 mm liegen.") }
    {% endif %}

    # --- Geometrie: mittig auf dem Bett (X 0..271, Y 0..335 laut printer.cfg) ---
    {% set cx = printer.toolhead.axis_maximum.x / 2.0 %}
    {% set cy = printer.toolhead.axis_maximum.y / 2.0 %}
    {% set x0 = cx - size / 2.0 %}
    {% set y0 = cy - size / 2.0 %}
    {% set e_mm = (lw * lh) / 2.4053 %}

    RESPOND MSG="FIRST_LAYER_TEST: {size|int} mm Quadrat bei X{x0|round(1)} Y{y0|round(1)}, Duese {tool}, {temp|int}/{bed|int} Grad, E {e_mm|round(4)} mm/mm"

    # --- Aufheizen und anfahren, Ablauf wie SM_PRINT_START_LINE_EXTRUDER_0 ---
    T{tool} A0
    M140 S{bed}
    G90
    M83
    G0 X10 Y3 Z2 F18000
    M190 S{bed}
    M109 S{temp}

    # Purge-Linie: Snapmakers eigene Werte, reinigt die Duese vor dem Muster
    G1 Z{lh} F600
    G1 X50 E15 F360
    G1 E-0.5 F1800
    G0 Z2 F600

    # --- Anfahrt zum Muster ---
    G0 X{x0} Y{y0} F18000
    G1 Z{lh} F600
    G1 E0.5 F1800

    # --- Zwei Umrandungen ---
    {% for r in range(2) %}
        {% set o  = r * lw %}
        {% set xa = x0 + o %}{% set ya = y0 + o %}
        {% set xb = x0 + size - o %}{% set yb = y0 + size - o %}
        G1 X{xb} Y{ya} E{((xb - xa) * e_mm)|round(5)} F{speed}
        G1 X{xb} Y{yb} E{((yb - ya) * e_mm)|round(5)} F{speed}
        G1 X{xa} Y{yb} E{((xb - xa) * e_mm)|round(5)} F{speed}
        G1 X{xa} Y{ya} E{((yb - ya) * e_mm)|round(5)} F{speed}
    {% endfor %}

    # --- Maeander-Fuellung zwischen den Umrandungen ---
    {% set fx0 = x0 + 2 * lw %}
    {% set fy0 = y0 + 2 * lw %}
    {% set fy1 = y0 + size - 2 * lw %}
    {% set flen = fy1 - fy0 %}
    {% set bahnen = ((size - 4 * lw) / lw) | int %}
    G0 X{fx0} Y{fy0} F18000
    {% for i in range(bahnen) %}
        {% set x = fx0 + i * lw %}
        {% if i % 2 == 0 %}
            G1 X{x|round(3)} Y{fy1|round(3)} E{(flen * e_mm)|round(5)} F{speed}
        {% else %}
            G1 X{x|round(3)} Y{fy0|round(3)} E{(flen * e_mm)|round(5)} F{speed}
        {% endif %}
        {% if i < bahnen - 1 %}
            G1 X{(x + lw)|round(3)} E{(lw * e_mm)|round(5)} F{speed}
        {% endif %}
    {% endfor %}

    # --- Sauber beenden ---
    G1 E-1.0 F1800
    G0 Z10 F600
    G0 X{cx} Y10 F18000
    TURN_OFF_HEATERS
    M107
    RESPOND MSG="FIRST_LAYER_TEST fertig: {bahnen} Bahnen gedruckt, Heizungen aus. Muster von der Seite und schraeg von oben ansehen -- Kopfzeile dieser Datei erklaert die Bilder."
