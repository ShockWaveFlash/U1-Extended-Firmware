# Firmware-Retraction: macht G10/G11 verfuegbar, damit sich Retraction zur
# Laufzeit abstimmen laesst (SET_RETRACTION / GET_RETRACTION) statt fuer jeden
# Versuch neu zu slicen.
#
# ⚠ AENDERT VON SICH AUS NICHTS AM DRUCK. Die Werte greifen nur, wenn der
# Slicer G10/G11 ausgibt - in SnapmakerOrca ist dafuer "Firmware-Retraction"
# im Druckerprofil einzuschalten. Solange das aus ist, extrudiert SnOrca die
# Rueckzuege wie bisher selbst.
#
# Werte = Snapmakers Maschinenprofil (am Geraet ausgelesen 2026-08-14):
# retraction_length 1,5 mm, retraction_speed/deretraction_speed je 30 mm/s,
# retract_restart_extra 0. Snapmakers Fenster fuer die Direct-Drive-Toolheads
# ist 0,5-1,5 mm und 25-45 mm/s.
#
# ⚠ z_hop_height bewusst NICHT gesetzt (Standard 0 = aus): Der Z-Hub kommt aus
# dem Slicerprofil (z_hop 0,4 mm, "Auto Lift"). Beides zugleich hiebe doppelt.
[firmware_retraction]
retract_length: 1.5
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30
