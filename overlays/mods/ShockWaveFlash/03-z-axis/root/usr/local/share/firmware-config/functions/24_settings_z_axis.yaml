settings:
  z_axis:
    label: "Z-Achse"
    items:
      z_motion:
        label: "Z-Geschwindigkeit und -Beschleunigung"
        description: >-
          Grenzwerte für die Z-Bewegung, ab Werk 30 mm/s und 500 mm/s². <br>Niedrigere
          Werte nehmen dem Z-Antrieb das Schlagen bei jedem Schichtwechsel und beim
          Z-Hop. Der Hebel ist dabei die BESCHLEUNIGUNG, nicht die Geschwindigkeit: Das
          hörbare Bumsen entsteht beim Anfahren, wo das volle Drehmoment gefragt ist.
          <br>Der Preis sind geringfügig langsamere Z-Bewegungen — bei einem Bruchteil
          einer Sekunde je Schicht fällt das kaum ins Gewicht. Klipper startet beim
          Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/z_motion.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^max_z_velocity:' "$f" | awk '{print $2}')
            a=$(grep -m1 '^max_z_accel:' "$f" | awk '{print $2}')
            if [ "$v" = "20" ] && [ "$a" = "300" ]; then echo smooth
            elif [ "$v" = "15" ] && [ "$a" = "200" ]; then echo extra_smooth
            else echo custom
            fi
        options:
          default:
            label: "Werkseinstellung (30 / 500)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_motion.cfg &&
                echo "Z motion limits back to stock. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          smooth:
            label: "Ruhig (20 / 300)"
            confirm: >-
              Z auf 20 mm/s und 300 mm/s² begrenzen? Diese Werte haben sich gegen das
              Schlagen der Z-Achse bewährt. Schichtwechsel und Referenzfahrt werden
              geringfügig langsamer. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh 20 300 &&
                /etc/init.d/S60klipper restart
          extra_smooth:
            label: "Sehr ruhig (15 / 200)"
            confirm: >-
              Z auf 15 mm/s und 200 mm/s² begrenzen? Die leiseste Vorgabe; Z-Bewegungen
              und Referenzfahrt werden merklich langsamer. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh 15 200 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigene Werte…"
            confirm: >-
              Eigene Z-Grenzwerte setzen? Geschwindigkeit 5–30 mm/s, Beschleunigung
              50–500 mm/s²; die Werkswerte sind die Obergrenze. Klipper startet neu.
            inputs:
              - name: Z_VEL
                label: "Höchstgeschwindigkeit Z in mm/s (5–30)"
                placeholder: "20"
                regex: '^([5-9]|[12][0-9]|30)$'
              - name: Z_ACC
                label: "Höchstbeschleunigung Z in mm/s² (50–500)"
                placeholder: "300"
                regex: '^([5-9][0-9]|[1-4][0-9][0-9]|500)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh "${Z_VEL}" "${Z_ACC}" &&
                /etc/init.d/S60klipper restart
        default: default

      z_stealthchop:
        label: "Z-Treiber im Flüstermodus"
        description: >-
          Betreibt den Z-Schrittmotortreiber bei allen Geschwindigkeiten im leisen
          Betriebsmodus (StealthChop). <br>Der Unterschied liegt darin, WIE der Treiber
          den Strom durch die Spulen schaltet: Der Werksmodus SpreadCycle regelt hart
          und erzeugt dabei ein hörbares Sirren, der Flüstermodus arbeitet mit weichen
          Übergängen und ist nahezu lautlos. <br>Das ist die wirkungsvollste
          Einzelmaßnahme gegen Z-Geräusche. Der Preis: bei höherem Tempo etwas weniger
          Drehmoment. <br>⚠ Die Z-Achse referenziert ohne Endschalter über die
          Drehmomenterkennung des Treibers — und die verhält sich im Flüstermodus
          anders. Nach dem Umschalten G28 Z prüfen und die ersten Drucke im Auge
          behalten. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/z_stealthchop.cfg && echo "enabled" || echo "disabled"
        options:
          disabled:
            label: "Werkseinstellung (SpreadCycle)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                echo "Z back to SpreadCycle. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          enabled:
            label: "Flüstermodus (StealthChop)"
            confirm: >-
              Den Z-Treiber in den Flüstermodus schalten? ⚠ Die Z-Referenzfahrt läuft
              ohne Endschalter über die Drehmomenterkennung. Danach unbedingt G28 Z
              prüfen und die ersten Drucke beobachten, ob unter Bettlast Schritte
              verloren gehen. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                printf '%s\n' '# Z StealthChop override' '# Managed by firmware-config (Settings > Z Axis). Do not edit manually.' '' '[tmc2209 stepper_z]' 'stealthchop_threshold: 999999' > /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                echo "Z StealthChop enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled

      z_current:
        label: "Z-Motorstrom"
        description: >-
          Fahrstrom des Z-Motors, ab Werk 0,85 A. <br>Weniger Strom heißt leiser und
          kühler. Aber: Der Z-Antrieb hebt das gesamte Druckbett mitsamt Werkstück. Ist
          der Strom zu klein, verliert der Motor unter Last Schritte — das Bett sackt
          langsam ab, und die Schichthöhe wandert über den Druck hinweg. <br>⚠ Auch die
          Referenzfahrt hängt daran: Die Drehmomenterkennung reagiert je nach Strom
          anders, nach einer Änderung also G28 Z prüfen. Klipper startet beim Umschalten
          neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/z_current.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^run_current:' "$f" | awk '{print $2}')
            case "$v" in
              0.7) echo c07 ;;
              *) echo custom ;;
            esac
        options:
          default:
            label: "Werkseinstellung (0,85 A)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_current.cfg &&
                echo "Z run current back to stock (0.85A). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          c07:
            label: "0,7 A"
            confirm: >-
              Z-Fahrstrom auf 0,7 A setzen? ⚠ Der Z-Antrieb hebt das ganze Bett. Auf
              verlorene Schritte achten: wandernde Schichthöhe, absackendes Bett —
              besonders bei schwerem Werkstück. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-current.sh 0.7 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigene Werte…"
            confirm: >-
              Eigenen Z-Fahrstrom setzen (0,50–0,90 A)? ⚠ Der Z-Antrieb hebt das ganze
              Bett; zu wenig Strom kostet Schritte und lässt das Bett absacken. Danach
              auch die Referenzfahrt prüfen — die Drehmomenterkennung reagiert bei
              anderem Strom anders. Klipper startet neu.
            inputs:
              - name: Z_CUR
                label: "Fahrstrom in A (0,50–0,90)"
                placeholder: "0.75"
                regex: '^(0\.[5-8][0-9]?|0\.90?)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-current.sh "${Z_CUR}" &&
                /etc/init.d/S60klipper restart
        default: default
