settings:
  z_axis:
    label: Z Axis
    items:
      z_motion:
        label: Z Speed / Accel
        description: Z motion limits (stock 30 mm/s, 500 mm/s2). Lower values reduce Z bumps and noise on layer changes at the cost of slightly slower Z moves.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/z_motion.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^max_z_velocity:' "$f" | awk '{print $2}')
            a=$(grep -m1 '^max_z_accel:' "$f" | awk '{print $2}')
            if [ "$v" = "20" ] && [ "$a" = "300" ]; then echo smooth
            elif [ "$v" = "15" ] && [ "$a" = "200" ]; then echo extra_smooth
            else echo custom
            fi
        options:
          default:
            label: Stock (30 / 500)
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_motion.cfg &&
                echo "Z motion limits back to stock. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          smooth:
            label: Smooth (20 / 300)
            confirm: "Limit Z to 20 mm/s and 300 mm/s2 (community-proven values against Z bumps and noise)? Layer changes and homing get slightly slower. Klipper will restart."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh 20 300 &&
                /etc/init.d/S60klipper restart
          extra_smooth:
            label: Extra Smooth (15 / 200)
            confirm: "Limit Z to 15 mm/s and 200 mm/s2? Quietest preset; Z moves and homing become noticeably slower. Klipper will restart."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh 15 200 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Custom\u2026"
            confirm: "Set custom Z limits? Velocity 5-30 mm/s, accel 50-500 mm/s2 (stock maxima as upper bounds). Klipper will restart."
            inputs:
              - name: Z_VEL
                label: "max_z_velocity in mm/s (5-30)"
                placeholder: "20"
                regex: '^([5-9]|[12][0-9]|30)$'
              - name: Z_ACC
                label: "max_z_accel in mm/s2 (50-500)"
                placeholder: "300"
                regex: '^([5-9][0-9]|[1-4][0-9][0-9]|500)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-motion.sh "${Z_VEL}" "${Z_ACC}" &&
                /etc/init.d/S60klipper restart
        default: default

      z_stealthchop:
        label: Z StealthChop
        description: Runs the Z TMC2209 in StealthChop at all speeds. Biggest single noise reduction for Z moves; stock uses louder SpreadCycle. Slightly less torque at speed.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/z_stealthchop.cfg && echo "enabled" || echo "disabled"
        options:
          disabled:
            label: Stock (SpreadCycle)
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                echo "Z back to SpreadCycle. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          enabled:
            label: StealthChop
            confirm: "Enable StealthChop on the Z driver (quietest mode)? NOTE: Z homes sensorless via StallGuard; after enabling, verify Z homing works reliably (G28 Z) and watch the first few prints for lost Z steps under heavy bed load. Klipper will restart."
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                printf '%s\n' '# Z StealthChop override' '# Managed by firmware-config (Settings > Z Axis). Do not edit manually.' '' '[tmc2209 stepper_z]' 'stealthchop_threshold: 999999' > /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/z_stealthchop.cfg &&
                echo "Z StealthChop enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled

      z_current:
        label: Z Run Current
        description: TMC2209 run_current for stepper_z (stock 0.85A). Lower is quieter and cooler, but the Z drive lifts the full bed - too little current risks lost steps and a sagging bed.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/z_current.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^run_current:' "$f" | awk '{print $2}')
            case "$v" in
              0.7) echo c07 ;;
              *) echo custom ;;
            esac
        options:
          default:
            label: Stock (0.85A)
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/z_current.cfg &&
                echo "Z run current back to stock (0.85A). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          c07:
            label: 0.7A
            confirm: "Set Z run current to 0.7A? WARNING: The Z drive lifts the entire bed. Watch for lost Z steps (layer height drift, bed sag) especially with a loaded bed. Klipper will restart."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-current.sh 0.7 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Custom\u2026"
            confirm: "Set a custom Z run current (0.50-0.90A)? WARNING: The Z drive lifts the entire bed - too little current risks lost steps and bed sag. Also re-verify sensorless Z homing after changes, as StallGuard sensitivity shifts with current. Klipper will restart."
            inputs:
              - name: Z_CUR
                label: "run_current in A (0.50-0.90)"
                placeholder: "0.75"
                regex: '^(0\.[5-8][0-9]?|0\.90?)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/z-axis/set-z-current.sh "${Z_CUR}" &&
                /etc/init.d/S60klipper restart
        default: default
