settings:
  motor_upgrade:
    label: "XY-Motorumbau"
    items:
      xy_geometry:
        label: "XY-Motorsatz"
        description: >-
          Sagt Klipper, welche Motoren und Riemenscheiben tatsächlich verbaut sind.
          Daraus rechnet die Steuerung um, wieviel Motordrehung einem Millimeter
          Kopfbewegung entspricht. <br>⚠⚠ Erst umstellen, NACHDEM die Teile eingebaut
          sind. Passt die Angabe nicht zur Wirklichkeit, fährt der Drucker jede Strecke
          falsch — bei den 0,9°-Motoren mit Werksscheiben genau die halbe Länge. Klipper
          startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/motor_geometry.cfg
            if [ ! -f "$f" ]; then echo stock
            elif grep -q "^rotation_distance: 39$" "$f"; then echo ldo2504_26t
            else echo ldo2504_gt2
            fi
        options:
          stock:
            label: "Werkszustand (1,8°, GT2 20 Zähne)"
            confirm: >-
              Zurück auf die Werksangaben (1,8°-Motoren, GT2-Scheiben mit 20 Zähnen)?
              Nur wählen, wenn die Werksteile eingebaut sind. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_geometry.cfg &&
                echo "Stock XY geometry restored. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_26t:
            label: "LDO-2504 0,9° + 26 Zähne 1.5GT"
            confirm: >-
              Auf LDO-42STH48-2504MAC(F) mit 0,9° und Powge-Scheiben (26 Zähne, 1.5GT)
              umstellen? Rechnerisch: 39 mm Vorschub je Umdrehung, 400 Vollschritte. ⚠⚠
              Die Teile MÜSSEN eingebaut sein — mit Werksmotoren halbiert diese
              Einstellung jede XY-Bewegung. Danach: Drehrichtung mit STEPPER_BUZZ
              prüfen, die Referenzfahrt-Empfindlichkeit neu einstellen und den
              Schwingungsausgleich neu messen. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/motor-upgrade/geometry-ldo2504-26t.cfg /oem/printer_data/config/extended/klipper/motor_geometry.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_geometry.cfg &&
                echo "LDO-2504 + 26T 1.5GT geometry active. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_gt2:
            label: "LDO-2504 0,9° + Werksscheiben GT2 20 Zähne"
            confirm: >-
              Auf LDO-42STH48-2504MAC(F) mit 0,9° umstellen, aber die Werksscheiben
              (GT2, 20 Zähne) behalten? Rechnerisch: 40 mm Vorschub je Umdrehung, 400
              Vollschritte. ⚠⚠ Die Motoren MÜSSEN eingebaut sein. Danach: Drehrichtung
              mit STEPPER_BUZZ prüfen, Referenzfahrt-Empfindlichkeit neu einstellen,
              Schwingungsausgleich neu messen. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/motor-upgrade/geometry-ldo2504-gt2.cfg /oem/printer_data/config/extended/klipper/motor_geometry.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_geometry.cfg &&
                echo "LDO-2504 + stock GT2 geometry active. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: stock

      xy_run_current:
        label: "XY-Motorstrom"
        description: >-
          Fahrstrom der X- und Y-Motoren, ab Werk 1,2 A. <br>Mehr Strom heißt mehr
          Drehmoment und damit weniger verlorene Schritte bei hohem Tempo — aber auch
          mehr Wärme in Motor UND Treiberbaustein. Oberhalb von 1,2 A braucht der
          Treiber zusätzliche Kühlung; 1,77 A ist die Dauergrenze der LDO-2504-Motoren.
          <br>⚠ Der Strom beeinflusst auch die Referenzfahrt: Sie erkennt den Anschlag
          am einbrechenden Drehmoment, und diese Empfindlichkeit verschiebt sich mit dem
          Strom. <br>Eine Wahl hier ersetzt die Einstellung „Verringerter TMC-Strom“.
          Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/motor_current.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^run_current:' "$f" | awk '{print $2}')
            case "$v" in
              1.0) echo c10 ;;
              1.1) echo c11 ;;
              1.2) echo c12 ;;
              1.3) echo c13 ;;
              1.4) echo c14 ;;
              1.5) echo c15 ;;
              1.6) echo c16 ;;
              *) echo custom ;;
            esac
        options:
          default:
            label: "Werkseinstellung (1,2 A)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_current.cfg &&
                echo "XY run current back to firmware default (1.2A). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          c10:
            label: "1,0 A"
            confirm: >-
              XY-Fahrstrom auf 1,0 A setzen? Weniger Strom heißt weniger Wärme und
              Geräusch, unter Last können aber Schritte verlorengehen. Ersetzt die
              Einstellung „Verringerter TMC-Strom“, falls sie aktiv war. Klipper startet
              neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.0 &&
                /etc/init.d/S60klipper restart
          c11:
            label: "1,1 A"
            confirm: >-
              XY-Fahrstrom auf 1,1 A setzen? Ersetzt die Einstellung „Verringerter
              TMC-Strom“, falls sie aktiv war. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.1 &&
                /etc/init.d/S60klipper restart
          c12:
            label: "1,2 A (festgeschrieben)"
            confirm: >-
              XY-Fahrstrom auf 1,2 A festschreiben — derselbe Wert wie ab Werk, aber
              ausdrücklich gesetzt? Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.2 &&
                /etc/init.d/S60klipper restart
          c13:
            label: "1,3 A"
            confirm: >-
              XY-Fahrstrom auf 1,3 A setzen? ⚠ Über Werksniveau. Der Treiber braucht
              zusätzliche Kühlung. Bei den ersten Drucken Treiber- und Motortemperaturen
              im Blick behalten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.3 &&
                /etc/init.d/S60klipper restart
          c14:
            label: "1,4 A"
            confirm: >-
              XY-Fahrstrom auf 1,4 A setzen? ⚠ Deutlich über Werksniveau. Der Treiber
              braucht zusätzliche Kühlung. Treiber- und Motortemperaturen genau
              beobachten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.4 &&
                /etc/init.d/S60klipper restart
          c15:
            label: "1,5 A"
            confirm: >-
              XY-Fahrstrom auf 1,5 A setzen? ⚠ Hoher Strom. Nur mit stärkeren Motoren
              (LDO-2504 oder vergleichbar) UND zusätzlicher Treiberkühlung. Temperaturen
              genau beobachten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.5 &&
                /etc/init.d/S60klipper restart
          c16:
            label: "1,6 A"
            confirm: >-
              XY-Fahrstrom auf 1,6 A setzen? ⚠ Sehr hoher Strom, nahe der Dauergrenze
              der LDO-2504 von 1,77 A. Nur mit stärkeren Motoren UND wirksamer
              Treiberkühlung. Die Treiber werden heiß — Temperaturanzeige im Auge
              behalten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh 1.6 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigener Wert…"
            confirm: >-
              Eigenen XY-Fahrstrom setzen (0,50–1,77 A)? Über 1,2 A braucht der Treiber
              zusätzliche Kühlung. 1,77 A ist die absolute Dauergrenze der LDO-2504.
              Klipper startet neu.
            inputs:
              - name: MOTOR_CURRENT
                label: "Fahrstrom in A (0,50–1,77)"
                placeholder: "1.25"
                regex: '^(0\.[5-9][0-9]?|1\.[0-6][0-9]?|1\.7[0-7]?)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-current.sh "${MOTOR_CURRENT}" &&
                /etc/init.d/S60klipper restart
        default: default

      xy_autotune:
        label: "Treiber-Selbstabstimmung (Motordatenbank)"
        description: >-
          Stimmt die Treibereinstellungen im laufenden Betrieb auf den tatsächlich
          verbauten Motor ab. Die Erweiterung klipper_tmc_autotune bringt eine Datenbank
          echter Motorkennwerte mit — Induktivität, Widerstand, Haltemoment — und leitet
          daraus ab, wann der Treiber leise und wann kräftig arbeiten soll. <br>Das ist
          genauer als feste Werte, weil es sich an Drehzahl und Last anpasst.
          <br>Ersetzt die feste Einstellung „TMC AutoTune“, die auf die Werksmotoren
          abgestimmt ist. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/motor_autotune.cfg
            if [ ! -f "$f" ]; then echo disabled; exit 0; fi
            g=$(grep -m1 '^tuning_goal:' "$f" | awk '{print $2}')
            case "$g" in
              performance) echo ldo2504_perf ;;
              silent) echo ldo2504_silent ;;
              autoswitch) echo ldo2504_autoswitch ;;
              *) echo ldo2504_auto ;;
            esac
        options:
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                echo "AutoTune (motor DB) disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_auto:
            label: "LDO-2504 (automatisch)"
            confirm: >-
              ⚠ ACHTUNG U1: Das ZERSTÖRT das sensorlose Homing. AutoTune setzt
              sg4_filt_en=1 — StallGuard mittelt dann über eine volle elektrische Umdrehung
              und erkennt den Anschlag zu spät. Am 2026-08-06 zweimal gemessen:
              distance_diff 0,68–1,47 mm statt der erlaubten 0,01, bis zu neun
              Wiederholungen, dann Abbruch. Betrifft alle vier Ziele gleichermaßen, einen
              Abschalter dafür gibt es im Plugin nicht (klipper_tmc_autotune #154/#145,
              TMC2240-spezifisch).
              <br>
              Selbstabstimmung für die LDO-42STH48-2504MAC(F) einschalten, Ziel
              „automatisch“? Nur mit tatsächlich eingebauten LDO-2504-Motoren wählen.
              Schaltet die feste Einstellung „TMC AutoTune“ ab. Beim ersten Einsatz die
              Motortemperaturen beobachten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/motor-upgrade/autotune-ldo2504.cfg /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                if [ -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg ]; then
                  rm -v /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                  echo "NOTE: static TMC AutoTune tweak removed (superseded by motor-DB autotune)."
                fi &&
                echo "AutoTune for LDO-2504 (auto) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_perf:
            label: "LDO-2504 (kräftig)"
            confirm: >-
              ⚠ ACHTUNG U1: Das ZERSTÖRT das sensorlose Homing. AutoTune setzt
              sg4_filt_en=1 — StallGuard mittelt dann über eine volle elektrische Umdrehung
              und erkennt den Anschlag zu spät. Am 2026-08-06 zweimal gemessen:
              distance_diff 0,68–1,47 mm statt der erlaubten 0,01, bis zu neun
              Wiederholungen, dann Abbruch. Betrifft alle vier Ziele gleichermaßen, einen
              Abschalter dafür gibt es im Plugin nicht (klipper_tmc_autotune #154/#145,
              TMC2240-spezifisch).
              <br>
              Selbstabstimmung mit Ziel „kräftig“ einschalten? Der Treiber arbeitet dann
              bei allen Geschwindigkeiten im harten Modus: mehr Drehmoment, dafür lauter
              und wärmer. Nur mit eingebauten LDO-2504-Motoren. Schaltet die feste
              Einstellung „TMC AutoTune“ ab. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                sed 's/^tuning_goal: auto$/tuning_goal: performance/' /usr/local/share/firmware-config/motor-upgrade/autotune-ldo2504.cfg > /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                if [ -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg ]; then
                  rm -v /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                  echo "NOTE: static TMC AutoTune tweak removed (superseded by motor-DB autotune)."
                fi &&
                echo "AutoTune for LDO-2504 (performance) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_silent:
            label: "LDO-2504 (leise)"
            confirm: >-
              ⚠ ACHTUNG U1: Das ZERSTÖRT das sensorlose Homing. AutoTune setzt
              sg4_filt_en=1 — StallGuard mittelt dann über eine volle elektrische Umdrehung
              und erkennt den Anschlag zu spät. Am 2026-08-06 zweimal gemessen:
              distance_diff 0,68–1,47 mm statt der erlaubten 0,01, bis zu neun
              Wiederholungen, dann Abbruch. Betrifft alle vier Ziele gleichermaßen, einen
              Abschalter dafür gibt es im Plugin nicht (klipper_tmc_autotune #154/#145,
              TMC2240-spezifisch).
              <br>
              Selbstabstimmung mit Ziel „leise“ einschalten? Der Treiber bleibt bei
              allen Geschwindigkeiten im Flüstermodus: am leisesten und bei niedrigem
              bis mittlerem Tempo oft mit weniger feinen Oberflächenmustern, aber mit
              weniger Drehmoment bei hohem Tempo. ⚠ Bei Werks-Höchstgeschwindigkeit sind
              verlorene Schritte zu erwarten — sinnvoll nur zusammen mit einer
              Geschwindigkeitsbegrenzung. Nur mit eingebauten LDO-2504-Motoren. Klipper
              startet neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                sed 's/^tuning_goal: auto$/tuning_goal: silent/' /usr/local/share/firmware-config/motor-upgrade/autotune-ldo2504.cfg > /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                if [ -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg ]; then
                  rm -v /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                  echo "NOTE: static TMC AutoTune tweak removed (superseded by motor-DB autotune)."
                fi &&
                echo "AutoTune for LDO-2504 (silent) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          ldo2504_autoswitch:
            label: "LDO-2504 (Moduswechsel, erprobend)"
            confirm: >-
              ⚠ ACHTUNG U1: Das ZERSTÖRT das sensorlose Homing. AutoTune setzt
              sg4_filt_en=1 — StallGuard mittelt dann über eine volle elektrische Umdrehung
              und erkennt den Anschlag zu spät. Am 2026-08-06 zweimal gemessen:
              distance_diff 0,68–1,47 mm statt der erlaubten 0,01, bis zu neun
              Wiederholungen, dann Abbruch. Betrifft alle vier Ziele gleichermaßen, einen
              Abschalter dafür gibt es im Plugin nicht (klipper_tmc_autotune #154/#145,
              TMC2240-spezifisch).
              <br>
              Selbstabstimmung mit Ziel „Moduswechsel“ einschalten? ⚠ Erprobend: leise
              bei niedrigem Tempo, Wechsel in den kräftigen Modus, sobald mehr
              Drehmoment nötig wird. Der Wechsel selbst kann mitten im Druck sichtbare
              Spuren hinterlassen. Nur mit eingebauten LDO-2504-Motoren. Klipper startet
              neu.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                sed 's/^tuning_goal: auto$/tuning_goal: autoswitch/' /usr/local/share/firmware-config/motor-upgrade/autotune-ldo2504.cfg > /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_autotune.cfg &&
                if [ -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg ]; then
                  rm -v /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                  echo "NOTE: static TMC AutoTune tweak removed (superseded by motor-DB autotune)."
                fi &&
                echo "AutoTune for LDO-2504 (autoswitch) enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled

      xy_stallguard:
        label: "Empfindlichkeit der XY-Referenzfahrt"
        description: >-
          Legt fest, ab welchem Drehmomenteinbruch der Treiber den Anschlag meldet. Der
          U1 referenziert ohne Endschalter: Der Kopf fährt gegen den Rahmen, das
          Drehmoment bricht ein, und der Treiber meldet „angekommen“. <br>Wie stark
          dieser Einbruch sein muss, hängt von Motor, Strom und Geschwindigkeit ab —
          nach einem Motorwechsel stimmt der Werkswert nicht mehr. <br>Zwei Zahlenwelten
          je nach Treiber: SG4_THRS von 0 bis 255 und das ältere SGT von −64 bis 63; bei
          beiden gilt: höher = unempfindlicher. <br>⚠ Auf Werkseinstellung lassen, bis
          der richtige Wert ermittelt ist. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/motor_stallguard.cfg
            if [ ! -f "$f" ]; then echo default
            elif grep -q "^driver_SG4_THRS:" "$f"; then echo sg4
            else echo sgt
            fi
        options:
          default:
            label: "Werkseinstellung"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_stallguard.cfg &&
                echo "StallGuard override removed (stock thresholds). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          sg4:
            label: "SG4_THRS eigener Wert…"
            confirm: >-
              SG4_THRS für X und Y selbst setzen? ⚠⚠ Ein falscher Wert lässt den Kopf in
              den Rahmen fahren (zu unempfindlich) oder mitten im Weg stehenbleiben (zu
              empfindlich). Erst durch Ausprobieren ermitteln — und bei der ersten
              Referenzfahrt danebenstehen, um notfalls auszuschalten. Klipper startet
              neu.
            inputs:
              - name: SG_X
                label: "SG4_THRS X (0–255)"
                placeholder: "70"
                regex: '^([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$'
              - name: SG_Y
                label: "SG4_THRS Y (0–255)"
                placeholder: "70"
                regex: '^([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-stallguard.sh sg4 "${SG_X}" "${SG_Y}" &&
                /etc/init.d/S60klipper restart
          sgt:
            label: "SGT eigener Wert…"
            confirm: >-
              SGT für X und Y selbst setzen? ⚠⚠ Ein falscher Wert lässt den Kopf in den
              Rahmen fahren oder mitten im Weg stehenbleiben. Erst durch Ausprobieren
              ermitteln — und bei der ersten Referenzfahrt danebenstehen, um notfalls
              auszuschalten. Klipper startet neu.
            inputs:
              - name: SG_X
                label: "SGT X (−64 bis 63)"
                placeholder: "1"
                regex: '^(-(6[0-4]|[1-5][0-9]|[1-9])|6[0-3]|[1-5][0-9]|[0-9])$'
              - name: SG_Y
                label: "SGT Y (−64 bis 63)"
                placeholder: "1"
                regex: '^(-(6[0-4]|[1-5][0-9]|[1-9])|6[0-3]|[1-5][0-9]|[0-9])$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-stallguard.sh sgt "${SG_X}" "${SG_Y}" &&
                /etc/init.d/S60klipper restart
        default: default

      xy_speed_limit:
        label: "XY-Geschwindigkeitsgrenze"
        description: >-
          Begrenzt die Höchstgeschwindigkeit des Druckkopfs. <br>Das ist der erste
          Griff, wenn die 0,9°-Motoren bei Spitzentempo Schritte verlieren — und der
          bessere, bevor man den Strom anhebt: 0,9°-Motoren liefern bei hoher Drehzahl
          weniger Drehmoment als 1,8°-Motoren, weil sie doppelt so oft schalten müssen.
          Mehr Strom bekämpft dann nur das Symptom und heizt Treiber und Motor auf.
          <br>„Werkseinstellung“ heißt: keine eigene Grenze, es gilt der Wert aus der
          printer.cfg. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/motor_speed_limit.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^max_velocity:' "$f" | awk '{print $2}')
            case "$v" in
              450) echo v450 ;;
              400) echo v400 ;;
              350) echo v350 ;;
              *) echo custom ;;
            esac
        options:
          default:
            label: "Werkseinstellung"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_speed_limit.cfg &&
                echo "Speed limit removed (stock max_velocity). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          v450:
            label: "450 mm/s"
            confirm: "Höchstgeschwindigkeit auf 450 mm/s begrenzen? Klipper startet neu."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-speed-limit.sh 450 &&
                /etc/init.d/S60klipper restart
          v400:
            label: "400 mm/s"
            confirm: "Höchstgeschwindigkeit auf 400 mm/s begrenzen? Klipper startet neu."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-speed-limit.sh 400 &&
                /etc/init.d/S60klipper restart
          v350:
            label: "350 mm/s"
            confirm: "Höchstgeschwindigkeit auf 350 mm/s begrenzen? Klipper startet neu."
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-speed-limit.sh 350 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigener Wert…"
            confirm: >-
              Eigene Höchstgeschwindigkeit setzen (100–1000 mm/s)? Klipper startet neu.
            inputs:
              - name: MAX_VEL
                label: "Höchstgeschwindigkeit in mm/s (100–1000)"
                placeholder: "450"
                regex: '^([1-9][0-9][0-9]|1000)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/motor-upgrade/set-speed-limit.sh "${MAX_VEL}" &&
                /etc/init.d/S60klipper restart
        default: default

      xy_macros:
        label: "Makros für die Inbetriebnahme"
        description: >-
          Stellt zwei Befehle für die Inbetriebnahme nach einem Motorumbau bereit.
          <br>XY_DRIVER_TEMPS meldet die Temperaturen der Treiberbausteine und den
          tatsächlich eingestellten Fahrstrom — damit lässt sich prüfen, ob ein
          angehobener Strom die Treiber überhitzt. <br>XY_STRESS_TEST fährt den Kopf
          über längere Zeit hart hin und her und protokolliert dabei die Temperaturen.
          So zeigt sich unter Last, ob Strom und Kühlung zusammenpassen, bevor es ein
          echter Druck herausfindet. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/motor_macros.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/motor-upgrade/motor-macros.cfg /oem/printer_data/config/extended/klipper/motor_macros.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/motor_macros.cfg &&
                echo "Commissioning macros installed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/motor_macros.cfg &&
                echo "Commissioning macros removed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
