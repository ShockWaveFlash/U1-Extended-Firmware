# Diagnostics: enable FORCE_MOVE and SET_KINEMATIC_POSITION
# Lets single steppers be moved without homing - useful to verify motor
# direction and belt routing after a motor swap. STEPPER_BUZZ works without
# this; FORCE_MOVE does not.
# Managed by firmware-config (Settings > Motor Upgrade). Do not edit manually.

[force_move]
enable_force_move: True
