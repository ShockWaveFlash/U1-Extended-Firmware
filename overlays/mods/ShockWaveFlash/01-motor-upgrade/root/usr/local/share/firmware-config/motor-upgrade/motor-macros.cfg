# Motor Upgrade: commissioning/monitoring macros
# Managed by firmware-config (Settings > Motor Upgrade). Do not edit manually.

[gcode_macro XY_DRIVER_TEMPS]
description: Report TMC2240 driver temperatures for stepper_x/stepper_y
gcode:
  {% set tx = printer['tmc2240 stepper_x'].temperature %}
  {% set ty = printer['tmc2240 stepper_y'].temperature %}
  {% set cx = printer['tmc2240 stepper_x'].run_current %}
  {% set cy = printer['tmc2240 stepper_y'].run_current %}
  RESPOND MSG="TMC2240 X: {'%.1f' % tx if tx is not none else 'n/a (motor off)'}C @ {cx}A | Y: {'%.1f' % ty if ty is not none else 'n/a (motor off)'}C @ {cy}A"

[gcode_macro XY_STRESS_TEST]
description: XY motion stress test. Params SPEED (mm/s, default 300), LOOPS (default 5), MARGIN (mm, default 30)
gcode:
  {% if 'xy' not in printer.toolhead.homed_axes %}
    { action_raise_error("Home X and Y first (G28 X Y)") }
  {% endif %}
  {% set speed = params.SPEED|default(300)|float * 60 %}
  {% set loops = params.LOOPS|default(5)|int %}
  {% set margin = params.MARGIN|default(30)|float %}
  {% set xmin = printer.toolhead.axis_minimum.x + margin %}
  {% set xmax = printer.toolhead.axis_maximum.x - margin %}
  {% set ymin = printer.toolhead.axis_minimum.y + margin %}
  {% set ymax = printer.toolhead.axis_maximum.y - margin %}
  SAVE_GCODE_STATE NAME=xy_stress
  G90
  RESPOND MSG="XY stress test: {loops} loops @ {params.SPEED|default(300)}mm/s"
  {% for i in range(loops) %}
    G1 X{xmin} Y{ymin} F{speed}
    G1 X{xmax} Y{ymax} F{speed}
    G1 X{xmin} Y{ymax} F{speed}
    G1 X{xmax} Y{ymin} F{speed}
    G1 X{xmin} Y{ymin} F{speed}
    G1 X{xmax} Y{ymin} F{speed}
    G1 X{xmax} Y{ymax} F{speed}
    G1 X{xmin} Y{ymax} F{speed}
    XY_DRIVER_TEMPS
  {% endfor %}
  M400
  RESTORE_GCODE_STATE NAME=xy_stress
  RESPOND MSG="XY stress test done. Check for skipped steps: G28 X Y and verify position."
