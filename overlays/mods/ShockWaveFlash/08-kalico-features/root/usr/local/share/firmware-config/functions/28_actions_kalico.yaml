actions:
  kalico:
    items:

      kalico-status:
        label: Show Kalico Status
        description: >-
          Shows which Klipper tree is running (Snapmaker stock or Kalico) and which
          Kalico features are currently switched on.
        cmd:
          - sh
          - /usr/local/share/firmware-config/kalico/status.sh
        background: false
        message: "Kalico status:"

      cold-extrude-on:
        label: Allow Cold Extrusion (all 4)
        description: >-
          Allows extruder moves below the minimum extrusion temperature on all four
          hotends (COLD_EXTRUDE HEATER=... ENABLE=1). Useful for clearing a jam or
          pulling filament without heating. NOT persistent: a Klipper restart
          resets it. Needs the Kalico tree; stock Klipper knows neither M302 nor
          COLD_EXTRUDE.
        confirm: "Allow cold extrusion on all four hotends? Moving cold filament can strain the extruder gears - use short moves only."
        cmd:
          - sh
          - /usr/local/share/firmware-config/kalico/set-cold-extrude.sh
          - "1"
        background: false
        message: "Enabling cold extrusion..."

      cold-extrude-off:
        label: Forbid Cold Extrusion (all 4)
        description: >-
          Restores the normal minimum extrusion temperature on all four hotends
          (COLD_EXTRUDE HEATER=... ENABLE=0).
        cmd:
          - sh
          - /usr/local/share/firmware-config/kalico/set-cold-extrude.sh
          - "0"
        background: false
        message: "Disabling cold extrusion..."

      mpc-calibrate-all:
        label: Calibrate MPC (all 4 hotends)
        description: >-
          Runs MPC_CALIBRATE for extruder, extruder1, extruder2 and extruder3 one
          after another. Each hotend heats up, then cools with the fan stepping
          through several speeds. Expect roughly 10-20 minutes PER hotend. Only
          meaningful once the hotends are switched to MPC.
        confirm: "Start MPC calibration for ALL FOUR hotends? This heats every hotend in turn and takes up to an hour in total. Remove filament and make sure the nozzles are clean first. Do not print during calibration."
        cmd:
          - sh
          - /usr/local/share/firmware-config/kalico/mpc-calibrate-all.sh
        background: true
        message: "MPC calibration running - follow the console for progress..."
