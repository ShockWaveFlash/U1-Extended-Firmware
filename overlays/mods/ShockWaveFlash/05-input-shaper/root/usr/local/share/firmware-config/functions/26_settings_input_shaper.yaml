settings:
  input_shaper:
    label: "Schwingungsausgleich"
    items:
      is_values:
        label: "Schwingungsausgleich (X/Y)"
        description: >-
          Hält die Werte einer Resonanzmessung dauerhaft fest — Ausgleichsart und
          Frequenz je Achse. Der Schwingungsausgleich verformt jede Bewegung so, dass
          der Rahmen möglichst wenig nachschwingt; das ist es, was Geisterbilder hinter
          Kanten verhindert. <br>Die Werte werden als eigene Datei abgelegt und
          überleben deshalb auch ein Firmware-Update, anders als ein Eintrag direkt in
          der printer.cfg. <br>⚠ Nach dem XY-Motorumbau neu messen: mit anderen Motoren
          und anderer bewegter Masse verschieben sich die Resonanzfrequenzen. Klipper
          startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/input_shaper.cfg && echo "custom" || echo "default"
        options:
          default:
            label: "Aus (Werkszustand)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/input_shaper.cfg &&
                echo "Input shaper override removed (back to stock). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigene Werte…"
            confirm: >-
              Diese Werte für den Schwingungsausgleich übernehmen? Einzutragen ist, was
              die Resonanzmessung je Achse empfohlen hat. Klipper startet neu.
            inputs:
              - name: SHAPER_X
                label: "Ausgleichsart X (zv/mzv/ei/2hump_ei/3hump_ei)"
                placeholder: "mzv"
                regex: '^(zv|mzv|ei|2hump_ei|3hump_ei)$'
              - name: FREQ_X
                label: "Frequenz X in Hz (20-150)"
                placeholder: "52.4"
                regex: '^(2[0-9]|[3-9][0-9]|1[0-4][0-9]|150)(\.[0-9])?$'
              - name: SHAPER_Y
                label: "Ausgleichsart Y (zv/mzv/ei/2hump_ei/3hump_ei)"
                placeholder: "mzv"
                regex: '^(zv|mzv|ei|2hump_ei|3hump_ei)$'
              - name: FREQ_Y
                label: "Frequenz Y in Hz (20-150)"
                placeholder: "41.8"
                regex: '^(2[0-9]|[3-9][0-9]|1[0-4][0-9]|150)(\.[0-9])?$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/input-shaper/set-input-shaper.sh "${SHAPER_X}" "${FREQ_X}" "${SHAPER_Y}" "${FREQ_Y}" &&
                /etc/init.d/S60klipper restart
        default: default

      is_calibrate:
        label: "Messmakro"
        description: >-
          Stellt den Befehl CALIBRATE_INPUT_SHAPER bereit. Er fährt Klippers
          Resonanzmessung für X und Y: der Kopf rüttelt in aufsteigenden Frequenzen,
          während der eingebaute Beschleunigungssensor mitmisst. Am Ende nennt Klipper
          die empfohlene Ausgleichsart und Frequenz je Achse — genau die Werte, die oben
          einzutragen sind. <br>Die Messung ist laut und dauert einige Minuten. <br>⚠
          Setzt einen funktionierenden Beschleunigungssensor voraus. Klipper startet
          beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/input_shaper_calibrate.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/input-shaper/input-shaper-calibrate.cfg /oem/printer_data/config/extended/klipper/input_shaper_calibrate.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/input_shaper_calibrate.cfg &&
                echo "CALIBRATE_INPUT_SHAPER macro installed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/input_shaper_calibrate.cfg &&
                echo "CALIBRATE_INPUT_SHAPER macro removed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
