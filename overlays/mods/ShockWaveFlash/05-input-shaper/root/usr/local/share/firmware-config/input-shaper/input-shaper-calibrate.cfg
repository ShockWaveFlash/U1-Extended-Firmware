# Input Shaper: resonance calibration macro
# Managed by firmware-config (Settings > Input Shaper). Do not edit manually.
# Requires a working [resonance_tester] + accelerometer on this machine.

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Measure XY resonances via SHAPER_CALIBRATE and report the recommended shaper. Optional AXIS=X or AXIS=Y to do a single axis.
gcode:
  {% set axis = params.AXIS | default('XY') | upper %}
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    RESPOND MSG="CALIBRATE_INPUT_SHAPER: homing X/Y first..."
    G28 X Y
  {% endif %}
  RESPOND MSG="CALIBRATE_INPUT_SHAPER: measuring {axis}. Keep the printer on a solid surface and quiet - this takes a few minutes and moves the toolhead vigorously."
  {% if axis == 'X' %}
    SHAPER_CALIBRATE AXIS=X
  {% elif axis == 'Y' %}
    SHAPER_CALIBRATE AXIS=Y
  {% else %}
    SHAPER_CALIBRATE AXIS=X
    SHAPER_CALIBRATE AXIS=Y
  {% endif %}
  RESPOND MSG="CALIBRATE_INPUT_SHAPER: done. Read the 'Recommended shaper' line(s) above, then enter type + frequency per axis under Settings > Input Shaper > Custom. (Values are NOT auto-saved - this firmware manages printer.cfg via extended overlays.)"
