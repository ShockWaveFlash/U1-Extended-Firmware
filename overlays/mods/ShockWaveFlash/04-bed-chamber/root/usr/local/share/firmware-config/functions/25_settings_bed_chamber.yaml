settings:
  bed_chamber:
    label: "Bett und Innenraum"
    items:
      bed_maxtemp:
        label: "Höchsttemperatur des Betts"
        description: >-
          Hebt die zulässige Höchsttemperatur des Heizbetts an, ab Werk 110 °C. <br>Der
          Schalter heizt nichts — er erlaubt lediglich, im Slicer oder in der Oberfläche
          höhere Werte einzustellen. Gebraucht wird das für Hochtemperatur-Kunststoffe
          wie ABS, ASA oder PC, die von einem heißeren Bett profitieren. <br>⚠ Oberhalb
          von 110 °C wird es für die Umgebung eng: Die Klebeschicht unter der
          Druckplatte, die PEI-Beschichtung und die Isolierung der Bettkabel sind für
          einen bestimmten Bereich ausgelegt. Vor dem Anheben nachsehen, was die
          verwendete Platte verträgt. <br>⚠ Der Druckerraum hat kein Fenster —
          ABS/ASA/PC nur bei guter Lüftung. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/bed_maxtemp.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            v=$(grep -m1 '^max_temp:' "$f" | awk '{print $2}')
            case "$v" in
              115) echo p115 ;;
              120) echo p120 ;;
              *) echo custom ;;
            esac
        options:
          default:
            label: "Werkseinstellung (110 °C)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/bed_maxtemp.cfg &&
                echo "Bed max_temp back to stock (110C). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          p115:
            label: "115 °C"
            confirm: >-
              Höchsttemperatur des Betts auf 115 °C anheben? Nur anheben, wenn
              Druckplatte, Klebeschicht und Verkabelung dafür ausgelegt sind. Klipper
              startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/bed-chamber/set-bed-maxtemp.sh 115 &&
                /etc/init.d/S60klipper restart
          p120:
            label: "120 °C"
            confirm: >-
              Höchsttemperatur des Betts auf 120 °C anheben, den Höchstwert dieser
              Erweiterung? ⚠ Das liegt deutlich über der Werksgrenze von 110 °C — vorher
              sicherstellen, dass Druckplatte, Klebeschicht und Kabel das aushalten.
              Dauerhaft hohe Betttemperaturen belasten Heizung und Netzteil. Klipper
              startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/bed-chamber/set-bed-maxtemp.sh 120 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Eigener Wert…"
            confirm: >-
              Eigene Höchsttemperatur fürs Bett setzen (111–120 °C)? ⚠ Oberhalb der
              Werksgrenze von 110 °C — nur so weit anheben, wie Druckplatte,
              Klebeschicht und Verkabelung es zulassen. Klipper startet neu.
            inputs:
              - name: BED_MAX
                label: "Höchsttemperatur in °C (111–120)"
                placeholder: "115"
                regex: '^(11[1-9]|120)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/bed-chamber/set-bed-maxtemp.sh "${BED_MAX}" &&
                /etc/init.d/S60klipper restart
        default: default

      heat_soak_macro:
        label: "Aufwärm-Makro (HEAT_SOAK)"
        description: >-
          Stellt den Befehl HEAT_SOAK bereit. Er heizt das Bett auf und hält es dann
          entweder eine feste Zeit (Angabe MINUTES) oder wartet, bis der Innenraum eine
          Zieltemperatur erreicht hat (Angabe CHAMBER), gemessen mit dem eingebauten
          Innenraumfühler. <br>Wozu das gut ist: Ein Druckerrahmen aus Aluminium dehnt
          sich beim Aufwärmen aus. Startet man sofort, verzieht sich die Geometrie
          während der ersten Schichten — die Düse steht nach zwanzig Minuten woanders
          als beim Nivellieren. Das Durchwärmen vorweg nimmt dem Rahmen diese Bewegung.
          Bei ABS und ASA kommt hinzu, dass ein warmer Innenraum das Ablösen an den
          Ecken verhindert. <br>Der Befehl blockiert, bis er fertig ist — gedacht für
          den Start-G-Code des Druckprofils oder zum Vorheizen von Hand. Klipper startet
          beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/heat_soak.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                cp -v /usr/local/share/firmware-config/bed-chamber/heat-soak.cfg /oem/printer_data/config/extended/klipper/heat_soak.cfg &&
                chown lava:lava /oem/printer_data/config/extended/klipper/heat_soak.cfg &&
                echo "HEAT_SOAK macro installed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/heat_soak.cfg &&
                echo "HEAT_SOAK macro removed. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
