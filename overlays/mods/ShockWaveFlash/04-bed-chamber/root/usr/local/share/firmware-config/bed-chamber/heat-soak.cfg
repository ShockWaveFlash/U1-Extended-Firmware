# Bed & Chamber: HEAT_SOAK macro
# Managed by firmware-config (Settings > Bed & Chamber). Do not edit manually.
# Uses the stock [temperature_sensor cavity] (gcode_id C) for chamber-based soaking.

[gcode_macro HEAT_SOAK]
description: Pre-print heat soak. BED=<C> required, plus exactly one of MINUTES=<n> or CHAMBER=<C>
gcode:
  {% set bed = params.BED | default(0) | int %}
  {% set minutes = params.MINUTES | default(0) | int %}
  {% set chamber = params.CHAMBER | default(0) | int %}
  {% if bed <= 0 %}
    { action_raise_error("HEAT_SOAK: BED=<temp> is required") }
  {% endif %}
  {% if (minutes > 0) == (chamber > 0) %}
    { action_raise_error("HEAT_SOAK: give exactly one of MINUTES=<n> or CHAMBER=<temp>") }
  {% endif %}
  {% if minutes > 120 %}
    { action_raise_error("HEAT_SOAK: MINUTES capped at 120") }
  {% endif %}
  {% if chamber > 55 %}
    { action_raise_error("HEAT_SOAK: CHAMBER capped at 55C (cavity is passively heated by the bed, sensor max_temp 70C). Given: " ~ chamber) }
  {% endif %}
  M140 S{bed}
  RESPOND MSG="HEAT_SOAK: heating bed to {bed}C..."
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  {% set cav = printer['temperature_sensor cavity'].temperature %}
  {% if minutes > 0 %}
    RESPOND MSG="HEAT_SOAK: bed at {bed}C, soaking {minutes} min (chamber now {'%.1f' % cav}C)..."
    G4 P{minutes * 60000}
    RESPOND MSG="HEAT_SOAK: {minutes} min soak done. Chamber {'%.1f' % printer['temperature_sensor cavity'].temperature}C, bed {'%.1f' % printer.heater_bed.temperature}C."
  {% else %}
    RESPOND MSG="HEAT_SOAK: bed at {bed}C, waiting for chamber >= {chamber}C (chamber now {'%.1f' % cav}C). Blocks until reached - abort with CANCEL_PRINT / M112 if it stalls."
    TEMPERATURE_WAIT SENSOR="temperature_sensor cavity" MINIMUM={chamber}
    RESPOND MSG="HEAT_SOAK: chamber reached {'%.1f' % printer['temperature_sensor cavity'].temperature}C. Done."
  {% endif %}
