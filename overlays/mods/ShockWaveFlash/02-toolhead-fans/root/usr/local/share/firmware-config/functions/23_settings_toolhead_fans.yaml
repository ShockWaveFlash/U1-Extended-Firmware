settings:
  toolhead_fans:
    label: "Düsenlüfter"
    items:
      nozzle_fan_speed:
        label: "Drehzahl der Düsenlüfter (T0–T3)"
        description: >-
          Drehzahl der temperaturgesteuerten Düsenlüfter, je Werkzeug einer. Diese
          Lüfter kühlen die Wärmebremse zwischen Heizblock und Kühlkörper — die Stelle,
          an der das Filament fest bleiben MUSS. Wird dort zu wenig gekühlt, wandert die
          Wärme nach oben, das Filament wird schon im Zuführrohr weich und verstopft die
          Düse (Heat Creep). <br>Werkseinstellung ist 1.0, also volle Drehzahl. Weniger
          ist leiser, unter etwa 0.6 steigt die Verstopfungsgefahr aber deutlich. <br>⚠
          Das ist NICHT der Bauteillüfter, der das gedruckte Material anbläst — dessen
          Drehzahl kommt aus dem Druckprofil. Klipper startet beim Umschalten neu.
        get_cmd:
          - bash
          - -c
          - |
            f=/oem/printer_data/config/extended/klipper/nozzle_fans.cfg
            if [ ! -f "$f" ]; then echo default; exit 0; fi
            vals=$(grep '^fan_speed:' "$f" | awk '{print $2}' | tr '\n' ' ')
            if [ "$vals" = "0.6 0.6 0.6 0.6 " ]; then echo quiet
            elif [ "$vals" = "0.8 0.8 0.8 0.8 " ]; then echo reduced
            else echo custom
            fi
        options:
          default:
            label: "Werkseinstellung (1.0)"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/nozzle_fans.cfg &&
                echo "Nozzle fan speeds back to stock (1.0). Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          reduced:
            label: "Verringert (0.8, alle)"
            confirm: >-
              Alle vier Düsenlüfter auf 0.8 setzen? Leiser bei mäßig verringerter
              Kühlung. Bei langen, heißen Drucken auf Anzeichen von Heat Creep achten:
              leises Klicken des Antriebs, stockender Fluss. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/toolhead-fans/set-nozzle-fans.sh 0.8 0.8 0.8 0.8 &&
                /etc/init.d/S60klipper restart
          quiet:
            label: "Leise (0.6, alle)"
            confirm: >-
              Alle vier Düsenlüfter auf 0.6 setzen? Dieser Wert hat sich in der
              Nutzergemeinde als leise Einstellung bewährt. ⚠ Die Wärmebremse wird
              spürbar weniger gekühlt. Besonders bei PLA, langen Drucken und warmem
              Innenraum auf Verstopfungen achten. Klipper startet neu.
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/toolhead-fans/set-nozzle-fans.sh 0.6 0.6 0.6 0.6 &&
                /etc/init.d/S60klipper restart
          custom:
            label: "Je Werkzeug einzeln…"
            confirm: >-
              Für jedes Werkzeug eine eigene Lüfterdrehzahl setzen (0.30–1.0)? ⚠ Unter
              0.6 steigt die Verstopfungsgefahr deutlich — so weit nur heruntergehen bei
              Werkzeugen, die selten laufen, oder nachdem die Temperaturen nachgemessen
              wurden. Klipper startet neu.
            inputs:
              - name: FAN_T0
                label: "T0 Drehzahl (0.30–1.0)"
                placeholder: "0.6"
                regex: '^(0\.[3-9][0-9]?|1(\.00?)?)$'
              - name: FAN_T1
                label: "T1 Drehzahl (0.30–1.0)"
                placeholder: "0.6"
                regex: '^(0\.[3-9][0-9]?|1(\.00?)?)$'
              - name: FAN_T2
                label: "T2 Drehzahl (0.30–1.0)"
                placeholder: "0.6"
                regex: '^(0\.[3-9][0-9]?|1(\.00?)?)$'
              - name: FAN_T3
                label: "T3 Drehzahl (0.30–1.0)"
                placeholder: "0.6"
                regex: '^(0\.[3-9][0-9]?|1(\.00?)?)$'
            cmd:
              - bash
              - -xc
              - |
                sh /usr/local/share/firmware-config/toolhead-fans/set-nozzle-fans.sh "${FAN_T0}" "${FAN_T1}" "${FAN_T2}" "${FAN_T3}" &&
                /etc/init.d/S60klipper restart
        default: default
