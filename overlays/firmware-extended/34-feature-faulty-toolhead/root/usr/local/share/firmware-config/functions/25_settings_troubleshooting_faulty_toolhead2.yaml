settings:
  troubleshooting:
    items:
      toolhead2:
        label: "Werkzeugkopf 2"
        description: >-
          Nimmt Werkzeugkopf 2 vorübergehend aus der Temperaturüberwachung. <br>Wozu:
          Ist der Temperaturfühler eines Kopfes defekt, hält Klipper das für einen
          Notfall und verweigert den Betrieb — obwohl die anderen drei Köpfe in Ordnung
          sind. Dieser Schalter lässt den Drucker mit den übrigen Köpfen weiterarbeiten,
          bis Ersatz da ist. <br>⚠⚠ Mit dem überbrückten Kopf darf weder geheizt noch
          gedruckt werden: Ohne Fühler merkt niemand, wenn er zu heiß wird. Klipper
          startet beim Umschalten neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/faulty_toolhead
        get_cmd:
          - bash
          - -c
          - test -e /oem/printer_data/config/extended/klipper/faulty_toolhead2.cfg && echo "bypass_thermistor" || echo "enabled"
        options:
          enabled:
            label: "Normal"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/faulty_toolhead2.cfg &&
                echo "Toolhead 2 thermistor bypass disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          bypass_thermistor:
            label: "Fühler überbrücken"
            confirm: >-
              Werkzeugkopf 2 aus der Temperaturüberwachung nehmen? Der Drucker kann dann
              mit den übrigen Köpfen weiterarbeiten. ⚠⚠ Mit diesem Kopf darf solange
              weder geheizt noch gedruckt werden.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/faulty_toolhead2.cfg /oem/printer_data/config/extended/klipper/faulty_toolhead2.cfg &&
                echo "Toolhead 2 faulty toolhead bypass enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: enabled
