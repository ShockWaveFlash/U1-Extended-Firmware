settings:
  troubleshooting:
    items:
      toolhead4:
        label: "Werkzeugkopf 4"
        description: >-
          Nimmt Werkzeugkopf 4 vorübergehend aus der Temperaturüberwachung. <br>Wozu:
          Ist der Temperaturfühler eines Kopfes defekt, hält Klipper das für einen
          Notfall und verweigert den Betrieb — obwohl die anderen drei Köpfe in Ordnung
          sind. Dieser Schalter lässt den Drucker mit den übrigen Köpfen weiterarbeiten,
          bis Ersatz da ist. <br>⚠⚠ Mit dem überbrückten Kopf darf weder geheizt noch
          gedruckt werden: Ohne Fühler merkt niemand, wenn er zu heiß wird. Klipper
          startet beim Umschalten neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/faulty_toolhead
        get_cmd:
          - bash
          - -c
          - |
            if test -e /oem/printer_data/config/extended/klipper/faulty_toolhead4_mcu.cfg; then
              echo "bypass_mcu"
            elif test -e /oem/printer_data/config/extended/klipper/faulty_toolhead4.cfg; then
              echo "bypass_thermistor"
            else
              echo "enabled"
            fi
        options:
          enabled:
            label: "Normal"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/faulty_toolhead4.cfg \
                      /oem/printer_data/config/extended/klipper/faulty_toolhead4_mcu.cfg &&
                echo "Toolhead 4 bypass disabled. Restarting Klipper..." &&
                /etc/init.d/S59toolhead-sim restart &&
                /etc/init.d/S60klipper restart
          bypass_thermistor:
            label: "Fühler überbrücken"
            confirm: >-
              Werkzeugkopf 4 aus der Temperaturüberwachung nehmen? Der Drucker kann dann
              mit den übrigen Köpfen weiterarbeiten. ⚠⚠ Mit diesem Kopf darf solange
              weder geheizt noch gedruckt werden.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                rm -f /oem/printer_data/config/extended/klipper/faulty_toolhead4_mcu.cfg &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/faulty_toolhead4.cfg /oem/printer_data/config/extended/klipper/faulty_toolhead4.cfg &&
                echo "Toolhead 4 faulty toolhead bypass enabled. Restarting Klipper..." &&
                /etc/init.d/S59toolhead-sim restart &&
                /etc/init.d/S60klipper restart
          bypass_mcu:
            label: "Platine überbrücken (nicht angeschlossen)"
            confirm: >-
              Die Platine von Werkzeugkopf 4 überbrücken? Nur verwenden, wenn die
              Platine dieses Kopfes defekt oder sein Kabel abgezogen ist. Motor und
              Heizung von Werkzeugkopf 4 werden damit vollständig totgelegt — er kann
              weder verfahren noch fördern noch heizen. Dafür startet der Drucker wieder
              und die übrigen Werkzeugköpfe bleiben nutzbar.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                rm -f /oem/printer_data/config/extended/klipper/faulty_toolhead4.cfg &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/faulty_toolhead4_mcu.cfg /oem/printer_data/config/extended/klipper/faulty_toolhead4_mcu.cfg &&
                echo "Toolhead 4 MCU bypass enabled. Restarting toolhead simulator and Klipper..." &&
                /etc/init.d/S59toolhead-sim restart &&
                /etc/init.d/S60klipper restart
        default: enabled
