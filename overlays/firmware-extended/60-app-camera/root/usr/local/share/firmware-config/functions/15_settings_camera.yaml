links:
  internal-camera:
    url: /webcam
    icon: "📷"
    label: "Eingebaute Kamera"
    condition:
      setting: camera-internal
      value: paxx12

  usb-camera:
    url: /webcam2
    icon: "📹"
    label: "USB-Kamera"
    condition:
      setting: camera-usb
      value: paxx12

settings:
  camera:
    items:
      camera-internal:
        label: "Eingebaute Kamera"
        description: >-
          Wählt, welche Ansteuerung für die eingebaute Kamera verwendet wird.
          <br>„Snapmaker“ ist die Werksansteuerung. „Paxx12“ ist die Variante der
          erweiterten Firmware; sie kann zusätzlich einen RTSP-Videostrom ausgeben und
          die KI-Erkennung bedienen. <br>⚠ Eine Änderung greift erst nach einem Neustart
          des Druckers.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - camera
          - internal
          - paxx12
        options:
          paxx12:
            label: "Paxx12"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal paxx12 &&
                /etc/init.d/S90lmd stop &&
                /etc/init.d/S99v4l2-mpp-mipi restart
          snapmaker:
            label: "Snapmaker"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal snapmaker &&
                /etc/init.d/S99v4l2-mpp-mipi stop &&
                /etc/init.d/S90lmd start
          none:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal none &&
                /etc/init.d/S99v4l2-mpp-mipi stop &&
                /etc/init.d/S90lmd stop
        default: paxx12

      camera-internal-resolution:
        label: "Auflösung der eingebauten Kamera"
        description: >-
          Auflösung und Bildrate der eingebauten Kamera. Die Auflösung liegt fest bei
          1080p, nur die Bildrate lässt sich senken. <br>Weniger Bilder je Sekunde
          bedeuten weniger Rechenlast und weniger Netzverkehr — sinnvoll, wenn der
          Drucker unter Last ruckelt oder das Bild über eine langsame Verbindung geht.
          Für die Drucküberwachung reichen wenige Bilder je Sekunde völlig.
        if_cmd: test "$(/usr/local/bin/extended-config.py get /home/lava/printer_data/config/extended/extended2.cfg camera internal paxx12)" = "paxx12"
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - camera
          - internal_resolution
          - 1080p25
        options:
          1080p30:
            label: "1920×1080 mit 30 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal_resolution 1080p30 &&
                /etc/init.d/S99v4l2-mpp-mipi restart
          1080p25:
            label: "1920×1080 mit 25 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal_resolution 1080p25 &&
                /etc/init.d/S99v4l2-mpp-mipi restart
          1080p15:
            label: "1920×1080 mit 15 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal_resolution 1080p15 &&
                /etc/init.d/S99v4l2-mpp-mipi restart
          1080p5:
            label: "1920×1080 mit 5 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera internal_resolution 1080p5 &&
                /etc/init.d/S99v4l2-mpp-mipi restart
        default: 1080p25

      camera-usb:
        label: "USB-Kamera"
        description: >-
          Gibt das Bild einer zusätzlich angeschlossenen USB-Kamera aus. <br>⚠ Der U1
          hat nur einen freien USB-Anschluss — eine Kamera dort belegt den Platz, den
          sonst ein Wiederherstellungs-Stick oder ein Zusatzrechner braucht.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - camera
          - usb
          - none
        options:
          paxx12:
            label: "Paxx12"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb paxx12 &&
                /usr/local/bin/extended-config.py uncomment /home/lava/printer_data/config/extended/moonraker/03_usb_camera.cfg "webcam usb" &&
                /usr/local/bin/extended-config.py update /home/lava/printer_data/config/extended/moonraker/03_usb_camera.cfg "webcam usb" enabled true &&
                /etc/init.d/S99v4l2-mpp-usb restart &&
                /etc/init.d/S61moonraker restart
          none:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb none &&
                /usr/local/bin/extended-config.py comment /home/lava/printer_data/config/extended/moonraker/03_usb_camera.cfg "webcam usb" &&
                /etc/init.d/S99v4l2-mpp-usb stop &&
                /etc/init.d/S61moonraker restart
        default: none

      camera-usb-resolution:
        label: "Auflösung der USB-Kamera"
        description: >-
          Auflösung und Bildrate der USB-Kamera. ⚠ Wird nur von der Paxx12-Ansteuerung
          unterstützt; mit der Werksansteuerung bleibt die Einstellung wirkungslos.
        if_cmd: test "$(/usr/local/bin/extended-config.py get /home/lava/printer_data/config/extended/extended2.cfg camera usb none)" = "paxx12"
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - camera
          - usb_resolution
          - 1080p25
        options:
          1080p30:
            label: "1920×1080 mit 30 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 1080p30 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          1080p25:
            label: "1920×1080 mit 25 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 1080p25 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          1080p5:
            label: "1920×1080 mit 5 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 1080p5 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          720p30:
            label: "1280×720 mit 30 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 720p30 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          720p25:
            label: "1280×720 mit 25 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 720p25 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          720p5:
            label: "1280×720 mit 5 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 720p5 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          360p30:
            label: "640×360 mit 30 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 360p30 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          360p25:
            label: "640×360 mit 25 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 360p25 &&
                /etc/init.d/S99v4l2-mpp-usb restart
          360p5:
            label: "640×360 mit 5 Bildern/s"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera usb_resolution 360p5 &&
                /etc/init.d/S99v4l2-mpp-usb restart
        default: 1080p25

      camera-rtsp:
        label: "RTSP-Videostrom (nur mit Paxx12)"
        description: >-
          Gibt das Kamerabild zusätzlich als RTSP-Videostrom aus — das Format, das
          Überwachungssoftware und Hausautomation erwarten. <br>Damit lässt sich das
          Druckbild etwa in Home Assistant oder einen Videorekorder einbinden, ohne den
          Umweg über die Weboberfläche. ⚠ Nur mit der Paxx12-Ansteuerung.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - camera
          - rtsp
          - "false"
        options:
          "true":
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera rtsp true &&
                /etc/init.d/S99v4l2-mpp-mipi restart &&
                /etc/init.d/S99v4l2-mpp-usb restart
          "false":
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg camera rtsp false &&
                /etc/init.d/S99v4l2-mpp-mipi restart &&
                /etc/init.d/S99v4l2-mpp-usb restart
        default: "false"
