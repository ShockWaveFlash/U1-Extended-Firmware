quick_actions:
  upgrades:
    items:
      helixscreen-upgrade:
        label: Upgrade HelixScreen
        description: Download and install the latest pinned HelixScreen version.
        if_cmd: /usr/local/bin/helixscreen-pkg needs_upgrade
        confirm: "Upgrade HelixScreen? The printer must be rebooted afterwards to run the new version."
        cmd:
          - bash
          - -ec
          - |
            /usr/local/bin/helixscreen-pkg upgrade
            echo ""
            echo ">> HelixScreen upgraded. Reboot the printer to apply."
        message: "Upgrading HelixScreen..."
