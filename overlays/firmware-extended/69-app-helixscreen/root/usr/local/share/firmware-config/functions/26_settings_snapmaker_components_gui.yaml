settings:
  snapmaker_components:
    items:
      gui:
        label: Touchscreen GUI
        description: Select the interface shown on the printer's built-in touchscreen.
        help_url: https://snapmakeru1-extended-firmware.pages.dev/helixscreen
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /oem/printer_data/config/extended/extended2.cfg
          - components
          - gui
          - snapmaker
        options:
          snapmaker:
            label: Snapmaker
            confirm: "Switch back to the stock Snapmaker touchscreen UI?\n\nThe printer must be rebooted for the change to take effect. The downloaded HelixScreen files are kept, so switching back to HelixScreen later does not re-download them."
            cmd:
              - bash
              - -xec
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components gui snapmaker
                echo ""
                echo ">> Stock Snapmaker UI selected. Reboot the printer to apply."
          helixscreen:
            label: HelixScreen
            confirm: "Replace the stock Snapmaker touchscreen UI with HelixScreen?\n\nHelixScreen is a third-party Klipper touchscreen interface and is downloaded on demand (~46 MB). It takes over WiFi setup from the stock UI, so a saved network is reconnected by HelixScreen itself.\n\nThe printer must be rebooted for the change to take effect."
            cmd:
              - bash
              - -xec
              - |
                /usr/local/bin/helixscreen-pkg download
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components gui helixscreen
                echo ""
                echo ">> HelixScreen selected. Reboot the printer to apply."
        default: snapmaker
