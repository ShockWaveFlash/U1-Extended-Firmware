settings:
  snapmaker_components:
    items:
      afc:
        label: "AFC Lite (Mehrspulen-Verwaltung)"
        description: >-
          Bindet die Mehrspulen-Verwaltung AFC Lite ein und stellt die Befehle
          CHANGE_TOOL und LANE_UNLOAD bereit. <br>Gedacht für angebaute Spulenwechsler
          mit mehreren Zuführungen. ⚠ Der U1 hat sein eigenes Werkzeugsystem mit vier
          Köpfen und braucht das im Normalfall nicht. Klipper startet beim Umschalten
          neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/afc-lite
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/afc.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              AFC Lite einschalten? Fügt die Mehrspulen-Verwaltung mit den Befehlen
              CHANGE_TOOL und LANE_UNLOAD hinzu. Näheres in der Dokumentation.
            cmd:
              - bash
              - -xc
              - |
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/afc.cfg /oem/printer_data/config/extended/klipper/afc.cfg &&
                echo "AFC enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -vf /oem/printer_data/config/extended/klipper/afc.cfg &&
                echo "AFC disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
