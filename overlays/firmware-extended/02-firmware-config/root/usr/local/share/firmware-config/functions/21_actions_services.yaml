actions:
  services:
    items:
      restart-klipper:
        label: "Klipper neu starten"
        description: >-
          Startet die Drucksteuerung neu. Sie liest dabei ihre Konfiguration frisch ein
          und baut die Verbindung zu allen Mikrocontrollern neu auf. <br>Das ist der
          übliche Weg, nachdem Klipper mit einem Fehler stehengeblieben ist, und nach
          Änderungen an der Konfiguration. <br>⚠ Ein laufender Druck wird abgebrochen,
          und die Referenzierung geht verloren.
        confirm: "Klipper neu starten? Ein laufender Druck wird abgebrochen und die Referenzierung geht verloren."
        cmd:
          - /etc/init.d/S60klipper
          - restart
        message: "Klipper wird neu gestartet…"

      restart-moonraker:
        label: "Moonraker neu starten"
        description: >-
          Startet den Vermittlungsdienst neu, über den Weboberfläche, Slicer und
          Hausautomation mit dem Drucker sprechen. <br>Klipper selbst und ein laufender
          Druck bleiben davon unberührt — es bricht nur kurz die Verbindung zu allen
          Bedienoberflächen ab. <br>Hilft, wenn die Weboberfläche keine Werte mehr
          zeigt, während der Drucker weiterläuft.
        confirm: "Klipper neu starten? Ein laufender Druck wird abgebrochen und die Referenzierung geht verloren."
        cmd:
          - /etc/init.d/S61moonraker
          - restart
        message: "Moonraker wird neu gestartet…"
