settings:
  remote_access:
    items:
      authorization:
        label: "Passwortschutz der Weboberfläche (erprobend)"
        description: >-
          Schützt den Zugang zur Weboberfläche und zu dieser Konfigurationsseite mit
          einem Passwort, geprüft von Moonraker. <br>Ohne diesen Schutz kann jeder im
          selben Netz den Drucker steuern, Dateien hochladen und Heizungen einschalten.
          <br>⚠ Erprobend, und es funktioniert nur mit der Oberfläche Fluidd — Mainsail
          unterstützt diese Anmeldung nicht. Wer Mainsail benutzt, sperrt sich damit
          unter Umständen selbst aus.
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/moonraker/authorization.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              Passwortschutz einschalten? Es wird ein Verwalterkonto mit zufälligem
              Passwort angelegt, mit dem man sich künftig anmelden muss. ⚠ Erprobend und
              nur mit Fluidd nutzbar — Mainsail unterstützt das nicht.
            cmd:
              - bash
              - -c
              - |
                FRONTEND=$(/usr/local/bin/extended-config.py get /home/lava/printer_data/config/extended/extended2.cfg web frontend fluidd)
                if [ "$FRONTEND" = "mainsail" ]; then
                  echo "ERROR: Authentication requires Fluidd."
                  echo "Mainsail does not support Moonraker authentication."
                  echo "Please switch to Fluidd first."
                  exit 1
                fi
                CLOUD=$(/usr/local/bin/extended-config.py get /home/lava/printer_data/config/extended/extended2.cfg remote_access cloud none)
                if [ "$CLOUD" = "octoeverywhere" ]; then
                  echo "ERROR: OctoEverywhere companion mode is incompatible with authentication."
                  echo "Disable OctoEverywhere first to enable authentication."
                  exit 1
                fi
                URL="http://127.0.0.1:7125"
                echo "Deleting existing admin user..."
                /usr/local/bin/curl -s -X DELETE "$URL/access/user" -H "Content-Type: application/json" -d '{"username": "admin"}' > /dev/null 2>&1
                echo "Enabling force_logins in Moonraker..."
                mkdir -p /oem/printer_data/config/extended/moonraker
                ln -sf /usr/local/share/firmware-config/tweaks/moonraker/authorization.cfg /oem/printer_data/config/extended/moonraker/authorization.cfg
                echo "Restarting Moonraker..."
                /etc/init.d/S61moonraker restart
                echo "Waiting for Moonraker to restart..."
                sleep 10
                PASSWORD=$(head -c 12 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 16)
                echo "Creating new admin user..."
                RESULT=$(/usr/local/bin/curl -s -X POST "$URL/access/user" -H "Content-Type: application/json" -d "{\"username\": \"admin\", \"password\": \"$PASSWORD\"}")
                if echo "$RESULT" | grep -q '"action": "user_created"'; then
                  echo ""
                  echo "============================================"
                  echo "  IMPORTANT: Save these credentials!"
                  echo "============================================"
                  echo "  Username: admin"
                  echo "  Password: $PASSWORD"
                  echo "============================================"
                  echo ""
                  echo "You can change your password in Fluidd"
                  echo "under Profile > Change Password."
                  echo ""
                  echo "If you forget your password, create a file"
                  echo "named 'extended-recover.txt' on a USB drive"
                  echo "and reboot to reset extended configuration."
                  echo ""
                else
                  echo "Warning: Could not create admin user"
                  echo "$RESULT"
                fi
          disabled:
            label: "Aus"
            confirm: >-
              Passwortschutz abschalten? Danach kann jeder im selben Netz den Drucker
              bedienen.
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/moonraker/authorization.cfg &&
                echo "Authentication disabled. Restarting Moonraker..." &&
                /etc/init.d/S61moonraker restart
        default: disabled
