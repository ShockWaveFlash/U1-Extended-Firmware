settings:
  web:
    items:
      firmware-config:
        label: "Diese Konfigurationsseite"
        description: >-
          Schaltet diese Weboberfläche selbst ein oder aus. <br>⚠ Nach dem Abschalten
          ist diese Seite nicht mehr erreichbar — sie lässt sich dann nur wieder
          aktivieren, indem man die Datei extended2.cfg von Hand bearbeitet, also über
          SSH oder den Touchscreen.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - web
          - firmware_config
          - "true"
        options:
          "true":
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg web firmware_config true &&
                /etc/init.d/S99firmware-config restart
          "false":
            label: "Aus"
            confirm: >-
              Abschalten nimmt den Zugang zu dieser Seite. Wieder einschalten geht dann
              nur noch, indem extended2.cfg von Hand bearbeitet wird.
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg web firmware_config false &&
                /etc/init.d/S99firmware-config stop
        default: "true"
