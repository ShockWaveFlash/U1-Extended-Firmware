quick_actions:
  upgrades:
    items:
      tailscale-upgrade:
        label: "Tailscale aktualisieren"
        description: >-
          Lädt die in dieser Firmware hinterlegte Fassung von Tailscale herunter und
          installiert sie. <br>⚠ Es wird eine FEST VORGEGEBENE Version geladen, nicht
          die jeweils neueste — ein neuerer Stand kommt erst mit einem Firmware-Update.
        if_cmd: /usr/local/bin/extended-pkg tailscale needs_upgrade
        confirm: "Tailscale aktualisieren und den VPN-Dienst neu starten?"
        cmd:
          - bash
          - -ec
          - |
            /usr/local/bin/extended-pkg tailscale upgrade
            /etc/init.d/S99vpn restart
        message: "Tailscale wird aktualisiert…"

actions:
  troubleshooting:
    items:
      tailscale-status:
        label: "Tailscale-Zustand"
        description: >-
          Zeigt, ob die VPN-Verbindung steht, und unter welcher Adresse der Drucker im
          VPN erreichbar ist.
        cmd: [/usr/local/bin/tailscale, status]
        message: "Tailscale-Zustand wird abgefragt…"
