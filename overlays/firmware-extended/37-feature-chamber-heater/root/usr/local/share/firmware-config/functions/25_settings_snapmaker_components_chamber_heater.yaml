settings:
  snapmaker_components:
    items:
      chamber_heater:
        label: "Innenraumheizung (Panda Breath / DragonBreath)"
        description: >-
          Bindet die Innenraumheizung mit Luftfilter von BIQU ein — wahlweise mit der
          Werksfirmware (Panda Breath) oder mit der freien Firmware DragonBreath auf
          derselben Platine. Sie erwärmt den Bauraum und filtert die Abluft. <br>Wozu:
          ABS, ASA und PC schrumpfen beim Abkühlen stark. In kalter Umgebung reißen die
          Schichten auf oder das Werkstück löst sich an den Ecken vom Bett. Ein warmer
          Innenraum verlangsamt das Abkühlen und verhindert das. <br>⚠⚠ Der Preis ist
          Verschleiß: Die Elektronik des Druckers sitzt im selben Gehäuse und ist für
          diese Dauertemperaturen nicht ausgelegt. Ohne zusätzliche Kühlung der
          Hauptplatine darf die Heizung nicht laufen. <br>⚠ Der Druckerraum hat kein
          Fenster — ABS und ASA nur bei guter Lüftung drucken. <br>⚠ Der Drucker spricht
          das Gerät über seine Netzadresse an; beide Adressen müssen im Router
          festgeschrieben sein, sonst findet Klipper die Heizung nach einem Neustart
          nicht mehr.
        help_url: https://snapmakeru1-extended-firmware.pages.dev/panda_breath
        get_cmd:
          - bash
          - -c
          - |
            CFG=/oem/printer_data/config/extended/klipper
            if test -f "$CFG/dragonbreath.cfg"; then
              echo "dragonbreath"
            elif /usr/local/bin/extended-config.py has "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg" &>/dev/null; then
              echo "auto"
            elif /usr/local/bin/extended-config.py has "$CFG/panda_breath.cfg" "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg" &>/dev/null; then
              echo "manual"
            elif test -f "$CFG/panda_breath.cfg"; then
              echo "manual"
            else
              echo "disabled"
            fi
        options:
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -ec
              - |
                CFG=/oem/printer_data/config/extended/klipper
                if PANDA_BREATH_IP=$(/usr/local/bin/extended-config.py get "$CFG/panda_breath.cfg" panda_breath host 2>/dev/null); then
                  echo ""
                  echo ">> Unbinding Panda Breath at ${PANDA_BREATH_IP}..."
                  /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" unbind || true
                fi

                echo ""
                echo ">> Removing chamber heater configuration..."
                rm -f "$CFG/panda_breath.cfg"
                rm -f "$CFG/dragonbreath.cfg"

                echo ""
                echo ">> Chamber heater disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled
