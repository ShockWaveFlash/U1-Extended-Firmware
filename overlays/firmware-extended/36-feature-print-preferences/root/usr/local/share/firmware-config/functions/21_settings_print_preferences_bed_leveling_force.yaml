settings:
  print_preferences:
    items:
      bed_leveling_force:
        label: "Bettvermessung vor jedem Druck erzwingen"
        description: >-
          Erzwingt, dass der Drucker vor jedem Druck das Bett neu vermisst, unabhängig
          davon, was im Druckprofil steht. <br>Der Sinn: Das Bett verzieht sich mit der
          Temperatur, und ein Raster von gestern passt nach dem Aufheizen nicht mehr
          genau. <br>„Vollständig“ tastet die ganze Fläche ab. „Angepasst“ vermisst nur
          den Bereich, in dem tatsächlich gedruckt wird — schneller, setzt aber voraus,
          dass der Slicer die Objektgrenzen mitliefert. Klipper startet beim Umschalten
          neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#force-auto-bed-leveling
        get_cmd:
          - bash
          - -c
          - |
            if test -f /oem/printer_data/config/extended/klipper/bed_leveling_adaptive_force.cfg; then
              echo "adaptive"
            elif test -f /oem/printer_data/config/extended/klipper/bed_leveling_force.cfg; then
              echo "force"
            else
              echo "disabled"
            fi
        options:
          force:
            label: "Vollständig vermessen"
            confirm: "Vor jedem Druck das ganze Bett vermessen?"
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                rm -f /oem/printer_data/config/extended/klipper/bed_leveling_adaptive_force.cfg &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/bed_leveling_force.cfg /oem/printer_data/config/extended/klipper/bed_leveling_force.cfg &&
                echo "Force full bed mesh enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          adaptive:
            label: "Angepasst vermessen"
            confirm: >-
              Vor jedem Druck nur den bedruckten Bereich vermessen? ⚠ Ohne Objektgrenzen
              fällt der Drucker auf die vollständige Vermessung zurück. Dafür muss im
              Slicer „Objekte ausschließen“ (Exclude Object) eingeschaltet sein — sonst
              greift die Anpassung nie.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                rm -f /oem/printer_data/config/extended/klipper/bed_leveling_force.cfg &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/bed_leveling_adaptive_force.cfg /oem/printer_data/config/extended/klipper/bed_leveling_adaptive_force.cfg &&
                echo "Force adaptive bed mesh enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/bed_leveling_force.cfg \
                      /oem/printer_data/config/extended/klipper/bed_leveling_adaptive_force.cfg &&
                echo "Force bed mesh disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
