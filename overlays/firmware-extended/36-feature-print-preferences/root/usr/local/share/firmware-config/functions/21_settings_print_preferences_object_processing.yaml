settings:
  print_preferences:
    items:
      object_processing:
        label: "Objekterkennung für die angepasste Vermessung"
        description: >-
          Lässt Moonraker die Druckdatei selbst nach Objektgrenzen durchsuchen, damit
          die angepasste Bettvermessung weiß, wo gedruckt wird. <br>⚠ Der bessere Weg
          ist, im Slicer „Objekte ausschließen“ einzuschalten — dann stehen die Grenzen
          bereits in der Datei. Diese Auswertung hier kostet bei großen Dateien viel
          Zeit: über 100 MB dauert das Hochladen spürbar länger, und Snapmaker Orca
          bleibt scheinbar bei 100 % hängen. Nur einschalten, wenn der Slicer es nicht
          selbst kann.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#object-processing-for-adaptive-mesh
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/moonraker/object_processing.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              Objekterkennung durch Moonraker einschalten? ⚠ Besser wäre „Objekte
              ausschließen“ im Slicer. Bei Dateien über 100 MB dauert die Auswertung
              lange, das Hochladen verzögert sich, und Snapmaker Orca scheint bei 100 %
              hängenzubleiben. Nur einschalten, wenn der Slicer das nicht selbst kann.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/moonraker &&
                ln -sf /usr/local/share/firmware-config/tweaks/moonraker/object_processing.cfg /oem/printer_data/config/extended/moonraker/object_processing.cfg &&
                echo "Object processing enabled. Restarting Moonraker..." &&
                /etc/init.d/S61moonraker restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/moonraker/object_processing.cfg &&
                echo "Object processing disabled. Restarting Moonraker..." &&
                /etc/init.d/S61moonraker restart
        default: disabled
