settings:
  print_preferences:
    items:
      timelapse_force:
        label: "Zeitraffer erzwingen"
        description: >-
          Erlaubt Zeitrafferaufnahmen auch dann, wenn sie in der Snapmaker-App nicht
          eingeschaltet sind. <br>⚠ Der Slicer muss die Befehle selbst geben:
          TIMELAPSE_START am Anfang, TIMELAPSE_TAKE_FRAME bei jedem Schichtwechsel und
          TIMELAPSE_STOP am Ende. Ohne diese Aufrufe passiert nichts.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#force-timelapse
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/timelapse_force.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              Zeitraffer auch ohne die Einstellung in der Snapmaker-App zulassen? Der
              Slicer muss TIMELAPSE_START, TIMELAPSE_TAKE_FRAME und TIMELAPSE_STOP
              selbst aufrufen.
            cmd:
              - bash
              - -xc
              - |
                mkdir -p /oem/printer_data/config/extended/klipper &&
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/timelapse_force.cfg /oem/printer_data/config/extended/klipper/timelapse_force.cfg &&
                echo "Force timelapse enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/timelapse_force.cfg &&
                echo "Force timelapse disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
