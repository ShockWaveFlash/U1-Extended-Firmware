settings:
  snapmaker_components:
    items:
      panda_breath:
        label: "Panda Breath (Innenraumheizung)"
        description: >-
          Bindet die Innenraumheizung mit Luftfilter von BIQU ein. Sie erwärmt den
          Bauraum und filtert die Abluft. <br>Wozu: ABS, ASA und PC schrumpfen beim
          Abkühlen stark. In kalter Umgebung reißen die Schichten auf oder das Werkstück
          löst sich an den Ecken vom Bett. Ein warmer Innenraum verlangsamt das Abkühlen
          und verhindert das. <br>⚠⚠ Der Preis ist Verschleiß: Die Elektronik des
          Druckers sitzt im selben Gehäuse und ist für diese Dauertemperaturen nicht
          ausgelegt. Ohne zusätzliche Kühlung der Hauptplatine darf die Heizung nicht
          laufen. <br>⚠ Der Druckerraum hat kein Fenster — ABS und ASA nur bei guter
          Lüftung drucken. <br>⚠ Der Drucker spricht das Gerät über seine Netzadresse
          an; beide Adressen müssen im Router festgeschrieben sein, sonst findet Klipper
          die Heizung nach einem Neustart nicht mehr.
        help_url: https://snapmakeru1-extended-firmware.pages.dev/panda_breath
        get_cmd:
          - bash
          - -c
          - |
            if /usr/local/bin/extended-config.py has /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg" &>/dev/null; then
              echo "auto"
            elif /usr/local/bin/extended-config.py has /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg" &>/dev/null; then
              echo "manual"
            elif test -f /oem/printer_data/config/extended/klipper/panda_breath.cfg; then
              echo "manual"
            else
              echo "disabled"
            fi
        options:
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -ec
              - |
                if PANDA_BREATH_IP=$(/usr/local/bin/extended-config.py get /oem/printer_data/config/extended/klipper/panda_breath.cfg panda_breath host 2>/dev/null); then
                  echo ""
                  echo ">> Unbinding Panda Breath at ${PANDA_BREATH_IP}..."
                  /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" unbind || true
                fi

                echo ""
                echo ">> Removing Panda Breath configuration..."
                rm -f /oem/printer_data/config/extended/klipper/panda_breath.cfg

                echo ""
                echo ">> Panda Breath disabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          auto:
            label: "Automatik (empfohlen)"
            confirm: >-
              ⚠⚠ Panda Breath hält den Innenraum dauerhaft deutlich wärmer. Elektronik,
              Motoren und Kunststoffteile arbeiten dann jenseits dessen, wofür sie
              ausgelegt sind, und altern schneller. Schäden durch diese Wärmebelastung
              sind vermutlich kein Garantiefall. Vor dem Einsatz MUSS die Hauptplatine
              zusätzlich gekühlt werden — Näheres in der Dokumentation. Vor dem
              Einschalten der Betriebsart „Automatik“ alle folgenden Schritte erledigen:
              1. Zusätzliche aktive Kühlung an der Hauptplatine anbringen. 2.
              Sicherstellen, dass auf dem Panda-Breath-Gerät die Firmware 1.0.3 läuft.
              3. Im Router eine feste Adresse für DIESEN DRUCKER vergeben — seine
              Adresse wird im Panda-Breath-Gerät hinterlegt und darf sich nach einem
              Neustart nicht ändern. 4. Im Router auch für das Panda-Breath-Gerät eine
              feste Adresse vergeben — Klipper spricht es bei jedem Druck über die
              Adresse an. 5. Das Panda-Breath-Gerät stromlos machen und mindestens 5
              Sekunden warten. 6. Unten die Adresse des Panda-Breath-Geräts eintragen.
              In der Automatik heizt zunächst Klipper den Innenraum auf; das Halten der
              Temperatur und das Abkühlen übernimmt danach die Eigenautomatik des
              Geräts.
            inputs:
              - name: ACKNOWLEDGED
                label: >-
                  Zum Bestätigen I UNDERSTAND eintippen — damit wird bestätigt, dass die
                  Dokumentation gelesen wurde und die Risiken für Garantie und
                  Lebensdauer angenommen werden
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: PANDA_BREATH_IP
                label: "Netzadresse des Panda-Breath-Geräts"
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                echo ""
                echo ">> Detecting printer IP address..."
                PRINTER_IP=$((ip -4 -o addr show eth0 2>/dev/null || ip -4 -o addr show wlan0 2>/dev/null) | awk '{print $4}' | cut -d/ -f1)

                echo ""
                echo ">> Binding Panda Breath at ${PANDA_BREATH_IP} to printer at ${PRINTER_IP}..."
                /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" bind-klipper --printer-ip "${PRINTER_IP}"

                echo ""
                echo ">> Writing configuration..."
                mkdir -p /oem/printer_data/config/extended/klipper
                cp -n /usr/local/share/firmware-config/tweaks/klipper/panda_breath.cfg /oem/printer_data/config/extended/klipper/panda_breath.cfg
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/klipper/panda_breath.cfg panda_breath host "${PANDA_BREATH_IP}"
                /usr/local/bin/extended-config.py uncomment /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg"
                /usr/local/bin/extended-config.py comment /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg"
                chown lava:lava /oem/printer_data/config/extended/klipper/panda_breath.cfg

                echo ""
                echo ">> Panda Breath auto mode enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
          manual:
            label: "Von Hand (für Fortgeschrittene)"
            hidden: true
            confirm: >-
              ⚠⚠ Panda Breath hält den Innenraum dauerhaft deutlich wärmer. Elektronik,
              Motoren und Kunststoffteile arbeiten dann jenseits dessen, wofür sie
              ausgelegt sind, und altern schneller. Schäden durch diese Wärmebelastung
              sind vermutlich kein Garantiefall. Vor dem Einsatz MUSS die Hauptplatine
              zusätzlich gekühlt werden — Näheres in der Dokumentation. Vor dem
              Einschalten der Betriebsart „Von Hand“ alle folgenden Schritte erledigen:
              1. Zusätzliche aktive Kühlung an der Hauptplatine anbringen. 2.
              Sicherstellen, dass auf dem Panda-Breath-Gerät die Firmware 1.0.3 läuft.
              3. Im Router eine feste Adresse für DIESEN DRUCKER vergeben — seine
              Adresse wird im Panda-Breath-Gerät hinterlegt und darf sich nach einem
              Neustart nicht ändern. 4. Im Router auch für das Panda-Breath-Gerät eine
              feste Adresse vergeben — Klipper spricht es bei jedem Druck über die
              Adresse an. 5. Das Panda-Breath-Gerät stromlos machen und mindestens 5
              Sekunden warten. 6. Unten die Adresse des Panda-Breath-Geräts eintragen. ⚠
              Die Betriebsart „Von Hand“ ist ein Überbleibsel aus früheren Fassungen.
              Sie ist weniger sicher: Fällt das Gerät oder die Netzverbindung während
              eines Drucks aus, bemerkt der Drucker das nicht zuverlässig.
            inputs:
              - name: ACKNOWLEDGED
                label: >-
                  Zum Bestätigen I UNDERSTAND eintippen — damit wird bestätigt, dass die
                  Dokumentation gelesen wurde und die Risiken für Garantie und
                  Lebensdauer angenommen werden
                placeholder: "I UNDERSTAND"
                regex: '^I UNDERSTAND$'
              - name: PANDA_BREATH_IP
                label: "Netzadresse des Panda-Breath-Geräts"
                placeholder: "192.168.1.100"
                regex: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'
            cmd:
              - bash
              - -ec
              - |
                echo ""
                echo ">> Detecting printer IP address..."
                PRINTER_IP=$((ip -4 -o addr show eth0 2>/dev/null || ip -4 -o addr show wlan0 2>/dev/null) | awk '{print $4}' | cut -d/ -f1)

                echo ""
                echo ">> Binding Panda Breath at ${PANDA_BREATH_IP} to printer at ${PRINTER_IP}..."
                /usr/local/bin/panda_breath_cli.py --host "${PANDA_BREATH_IP}" bind-klipper --printer-ip "${PRINTER_IP}"

                echo ""
                echo ">> Writing configuration..."
                mkdir -p /oem/printer_data/config/extended/klipper
                cp -n /usr/local/share/firmware-config/tweaks/klipper/panda_breath.cfg /oem/printer_data/config/extended/klipper/panda_breath.cfg
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/klipper/panda_breath.cfg panda_breath host "${PANDA_BREATH_IP}"
                /usr/local/bin/extended-config.py comment /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_auto.cfg"
                /usr/local/bin/extended-config.py uncomment /oem/printer_data/config/extended/klipper/panda_breath.cfg "include /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg"
                chown lava:lava /oem/printer_data/config/extended/klipper/panda_breath.cfg
                ln -sf /usr/local/share/firmware-config/tweaks/klipper/panda_breath_heater_manual.cfg /oem/printer_data/config/extended/klipper/panda_breath_heater.cfg

                echo ""
                echo ">> Panda Breath manual mode enabled. Restarting Klipper..."
                /etc/init.d/S60klipper restart
        default: disabled
