settings:
  remote_access:
    items:
      ssh:
        label: "SSH-Zugang"
        description: >-
          Öffnet eine Kommandozeile auf dem Drucker über das Netz. Damit lässt sich
          alles am Gerät nachsehen und ändern, was diese Oberfläche nicht abdeckt —
          Konfigurationsdateien, Protokolle, Dienste. <br>⚠ Der Zugang läuft als
          Verwalter und ist mit einem festen Standardpasswort geschützt. In einem Netz
          mit fremden Geräten sollte er ausgeschaltet bleiben. <br>⚠ Nach einem
          Firmware-Wechsel meldet der eigene Rechner einen geänderten Geräteschlüssel —
          das ist normal und kein Angriff.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - remote_access
          - ssh
          - "false"
        options:
          "true":
            label: "Ein"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg remote_access ssh true &&
                /etc/init.d/S50dropbear restart
          "false":
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg remote_access ssh false &&
                /etc/init.d/S50dropbear stop
        default: "false"
