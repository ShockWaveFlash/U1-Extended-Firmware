settings:
  tweaks:
    items:
      tmc_autotune:
        label: "Treiber-Selbstabstimmung (feste Werte)"
        description: >-
          Stellt die Schrittmotortreiber auf leiseren und gleichmäßigeren Lauf ein — mit
          festen Werten, die auf die WERKSMOTOREN abgestimmt sind. <br>⚠ Nach einem
          Motorumbau ist stattdessen die Selbstabstimmung aus der Motordatenbank die
          richtige Wahl (unter „XY-Motorumbau“); beide gleichzeitig ergeben keinen Sinn.
          Klipper startet beim Umschalten neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#tmc-autotune
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              Treiber-Selbstabstimmung mit festen Werten einschalten? Beim ersten
              Einsatz Motortemperaturen, Druckbild und mögliche verlorene Schritte
              beobachten.
            cmd:
              - bash
              - -xc
              - |
                cp /usr/local/share/firmware-config/tweaks/klipper/tmc_autotune.cfg /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                echo "TMC AutoTune enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -f /oem/printer_data/config/extended/klipper/tmc_autotune.cfg &&
                echo "TMC AutoTune disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
