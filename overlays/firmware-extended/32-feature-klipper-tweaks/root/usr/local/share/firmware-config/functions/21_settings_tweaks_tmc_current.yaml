settings:
  tweaks:
    items:
      tmc_reduce_current:
        label: "Verringerter TMC-Strom"
        description: >-
          Senkt den Fahrstrom der X- und Y-Motoren von 1,2 A auf 1,0 A. Leiser und
          kühler, dafür weniger Drehmoment — unter Last können Schritte verlorengehen,
          was sich als versetzte Schichten zeigt. <br>⚠ Wird von einer eigenen Stromwahl
          unter „XY-Motorumbau“ überschrieben. Klipper startet beim Umschalten neu.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#tmc-reduced-current
        get_cmd:
          - bash
          - -c
          - test -f /oem/printer_data/config/extended/klipper/tmc_current.cfg && echo "enabled" || echo "disabled"
        options:
          enabled:
            label: "Ein"
            confirm: >-
              Verringerten Motorstrom einschalten? Senkt X/Y von 1,2 A auf 1,0 A. Danach
              Motortemperaturen und Druckbild beobachten, besonders auf versetzte
              Schichten.
            cmd:
              - bash
              - -xc
              - |
                cp -v /usr/local/share/firmware-config/tweaks/klipper/tmc_current.cfg /oem/printer_data/config/extended/klipper/tmc_current.cfg &&
                echo "TMC Reduced Current enabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
          disabled:
            label: "Aus"
            cmd:
              - bash
              - -xc
              - |
                rm -vf /oem/printer_data/config/extended/klipper/tmc_current.cfg &&
                echo "TMC Reduced Current disabled. Restarting Klipper..." &&
                /etc/init.d/S60klipper restart
        default: disabled
