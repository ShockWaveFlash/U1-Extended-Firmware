settings:
  snapmaker_components:
    label: "Snapmaker-Komponenten"
    items:
      rfid:
        label: "Filamenterkennung"
        help_url: https://snapmakeru1-extended-firmware.pages.dev/rfid_support#alternative-detection-systems
        description: >-
          Legt fest, woher der Drucker weiß, welches Filament eingelegt ist.
          <br>„Snapmaker“ nutzt die Funkerkennung der Originalspulen, die Materialart
          und Farbe selbst melden. „Extern“ schaltet auf einen selbst angeschlossenen
          Lesekopf um, mit dem sich auch Fremdspulen kennzeichnen lassen. Klipper
          startet beim Umschalten neu.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /oem/printer_data/config/extended/extended2.cfg
          - components
          - rfid
          - snapmaker
        options:
          external:
            label: "Extern"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components rfid external
                /etc/init.d/S99openrfid stop
                /etc/init.d/S59rfid-support restart
                /etc/init.d/S60klipper restart
          snapmaker:
            label: "Snapmaker"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /oem/printer_data/config/extended/extended2.cfg components rfid snapmaker
                /etc/init.d/S99openrfid stop
                /etc/init.d/S59rfid-support restart
                /etc/init.d/S60klipper restart
        default: snapmaker
